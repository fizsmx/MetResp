<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetResp - Métodos Numéricos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #120e1f;
            --text-color: #ffffff;
            --primary: #8a2be2;
            --primary-hover: #9b4dff;
            --secondary: #00d2ff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --danger: #ff4757;
            --success: #2ed573;
            --input-bg: rgba(0, 0, 0, 0.3);
            --font-main: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --text-color: #1a1a1a;
            --primary: #6c5ce7;
            --primary-hover: #5f27cd;
            --secondary: #0984e3;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.1);
            --input-bg: rgba(255, 255, 255, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-color);
            background-image: linear-gradient(135deg, var(--bg-color) 0%, #2a0845 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        [data-theme="light"] body {
            background-image: linear-gradient(135deg, var(--bg-color) 0%, #dcdde1 100%);
        }

        [data-theme="light"] header {
            background: rgba(240, 242, 245, 0.94);
        }

        header {
            padding: 1rem 2rem;
            background: rgba(18, 14, 31, 0.92);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls button, .header-controls select {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-main);
            margin-left: 0.5rem;
        }

        .header-controls button:hover {
            background: var(--primary);
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        /* Navigation */
        .cat-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .cat-tab {
            padding: 0.8rem 1.5rem;
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .cat-tab:hover, .cat-tab.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .method-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .method-tab {
            padding: 0.5rem 1rem;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .method-tab:hover, .method-tab.active {
            background: var(--secondary);
            border-color: var(--secondary);
            color: #000;
        }

        /* Smart Input */
        .smart-input-container {
            margin-bottom: 2rem;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 1rem;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 1rem;
            resize: vertical;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        input {
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 0.8rem;
            border-radius: 8px;
            font-family: var(--font-mono);
        }

        .btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            width: 100%;
            transition: opacity 0.3s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Results Area */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .switch-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .step-card {
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            font-family: var(--font-mono);
        }

        .math-expr {
            color: var(--secondary);
        }

        .result-box {
            border: 1px solid var(--success);
            padding: 0.5rem;
            display: inline-block;
            margin: 0.5rem 0;
            border-radius: 4px;
        }

        .badge {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge.success { background: var(--success); color: black; }
        .badge.danger { background: var(--danger); color: white; }
        .badge.info { background: var(--secondary); color: black; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        th, td {
            border: 1px solid var(--glass-border);
            padding: 0.8rem;
            text-align: center;
        }

        th {
            background: var(--primary);
            color: white;
        }

        .chart-container {
            width: 100%;
            height: 400px;
            margin-top: 2rem;
            background: var(--input-bg);
            border-radius: 8px;
            padding: 1rem;
        }

        .hidden { display: none !important; }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
        }

        /* Calculadora Styles */
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
        }
        .calc-display {
            grid-column: 1 / -1;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 1rem;
            text-align: right;
            font-family: var(--font-mono);
            font-size: 1.5rem;
            min-height: 80px;
            word-break: break-all;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .calc-display .history {
            font-size: 0.9rem;
            color: #aaa;
        }
        .calc-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .calc-btn:hover { background: var(--primary); }
        .calc-btn.op { background: var(--primary-hover); }
        .calc-btn.eq { grid-column: 1 / -1; background: var(--secondary); color: black; }

        /* Print CSS */
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            .glass-panel {
                border: none !important;
                box-shadow: none !important;
            }
            header, .cat-tabs, .method-tabs, .smart-input-container, .form-grid, .btn, .controls-row {
                display: none !important;
            }
            .step-card, table, .chart-container {
                page-break-inside: avoid;
            }
        }
        
        .dynamic-table {
            display: grid;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .dyn-row {
            display: flex;
            gap: 0.5rem;
        }
        .dyn-row input { flex: 1; }
        .btn-small { padding: 0.5rem; border:none; border-radius:4px; cursor:pointer; background:var(--primary); color:white;}
        .theory-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-left: 4px solid var(--secondary);
            border-radius: 8px;
            padding: 1rem 1.2rem;
            margin-bottom: 1.5rem;
            font-size: 0.92rem;
            line-height: 1.6;
        }
        .theory-box h4 {
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }
        .theory-box b { color: var(--primary); }

        /* ===== Interpolación Lineal (tabla) ===== */
        .lin-full { grid-column: 1 / -1; }
        .lin-table {
            width: 100%;
            max-width: 620px;
            border-collapse: collapse;
            margin: 0 auto;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }
        .lin-table th, .lin-table td {
            border: 1px solid var(--glass-border);
            padding: 0.5rem 0.7rem;
            text-align: center;
        }
        .lin-table th { background: var(--primary); color: #fff; }
        .lin-table th.corner { background: transparent; }
        .lin-table td.row-label {
            text-align: left;
            font-weight: 600;
            background: var(--glass-bg);
            white-space: nowrap;
        }
        .lin-table td.section {
            text-align: left;
            font-weight: 700;
            color: var(--secondary);
            background: var(--glass-bg);
            letter-spacing: 0.02em;
        }
        .lin-table input {
            width: 100%;
            padding: 0.45rem;
            text-align: center;
            border-radius: 6px;
        }
        .lin-table input.var-name { font-weight: 700; color: var(--secondary); }
        .lin-table input.auto-filled {
            border-color: var(--success);
            color: var(--success);
            background: rgba(46, 213, 115, 0.10);
            font-weight: 700;
        }
        .lin-hint {
            font-size: 0.82rem;
            opacity: 0.8;
            margin-top: 0.6rem;
            text-align: center;
        }
        .lin-status { margin-top: 0.6rem; text-align: center; }

        /* ===== Bloque de verificación ===== */
        .step-card.verification {
            border-left: 4px solid var(--success);
            background: rgba(46, 213, 115, 0.06);
        }
        .step-card.verification h4 {
            color: var(--success);
            margin-bottom: 0.7rem;
        }
        .verif-why {
            border-left: 3px solid var(--secondary);
            padding-left: 0.8rem;
            margin-bottom: 0.9rem;
            line-height: 1.55;
        }
        .verif-why b { color: var(--secondary); }
        .verif-check { line-height: 1.55; }
        .verif-check b { color: var(--primary); }
        .verif-final { margin-top: 0.8rem; }
        .verif-note {
            margin-top: 0.6rem;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        /* ===== Bloque de gráfica ===== */
        .chart-block { margin-top: 2rem; }
        .chart-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
        }
        .chart-tab {
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 0.45rem 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            font-family: var(--font-main);
            font-size: 0.85rem;
        }
        .chart-tab:hover { border-color: var(--secondary); }
        .chart-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            font-weight: 600;
        }
        .chart-caption {
            margin-top: 0.8rem;
            padding: 0.7rem 0.9rem;
            background: var(--input-bg);
            border-left: 3px solid var(--secondary);
            border-radius: 6px;
            font-size: 0.86rem;
            line-height: 1.55;
        }
        .chart-caption b { color: var(--secondary); }

        /* ===== Arreglos de formulario ===== */
        .form-grid { align-items: start; }
        .form-group { min-width: 0; }
        .form-group input, .form-group textarea { max-width: 100%; }
        .examples-box {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            margin-bottom: 1.2rem;
        }
        .examples-box .examples-label {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-right: 0.2rem;
        }
        .example-btn {
            background: transparent;
            border: 1px solid var(--secondary);
            color: var(--secondary);
            padding: 0.45rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            font-family: var(--font-main);
            font-size: 0.82rem;
            white-space: nowrap;
        }
        .example-btn:hover { background: var(--secondary); color: #06131b; }
        .dynamic-table { width: 100%; min-width: 0; }

        body { overflow-x: hidden; }
        .step-card { overflow-x: auto; }
        .step-card table, #resultsContent > table { min-width: 0; }
        #resultsContent { overflow-x: auto; }
        .verif-check table { font-size: 0.82rem; }
        @media (max-width: 720px) {
            header { padding: 0.8rem 1rem; flex-wrap: wrap; gap: 0.5rem; }
            .header-controls { flex-wrap: wrap; }
            .chart-container { height: 300px; }
        }
        .dyn-row input { flex: 1 1 0; min-width: 0; width: 100%; }
        .dyn-row .btn-small { flex: 0 0 auto; }
        @media (max-width: 640px) {
            .example-btn { white-space: normal; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">MetResp</div>
    <div class="header-controls">
        <select id="historySelect">
            <option value="">Cargar historial...</option>
        </select>
        <button id="themeToggle">Tema Claro</button>
        <button onclick="window.print()">Exportar PDF</button>
    </div>
</header>

<main>
    <!-- Navegación de Categorías -->
    <div class="cat-tabs" id="catTabs">
        <button class="cat-tab active" data-cat="raices">Raíces</button>
        <button class="cat-tab" data-cat="sistemas">Sistemas Lineales</button>
        <button class="cat-tab" data-cat="interpolacion">Interpolación</button>
        <button class="cat-tab" data-cat="integracion">Integración</button>
        <button class="cat-tab" data-cat="edo">Ec. Diferenciales</button>
        <button class="cat-tab" data-cat="ajuste">Ajuste de Curvas</button>
        <button class="cat-tab" data-cat="calc">Calculadora</button>
    </div>

    <!-- Navegación de Métodos -->
    <div class="method-tabs" id="methodTabs">
        <!-- Renderizado dinámico -->
    </div>

    <div id="methodContainer">
        <div class="glass-panel" id="inputPanel">
            <h2 id="methodTitle" style="margin-bottom: 1rem;"></h2>
            
            <div class="smart-input-container" id="smartInputWrap">
                <label>Entrada Inteligente (Intenta detectar método y parámetros automáticamente):</label>
                <textarea id="smartInput" placeholder="Ej: Resolver f(x)=exp(x)-2 con Newton, x0=0, error 0.01"></textarea>
            </div>

            <div id="dynamicForm" class="form-grid">
                <!-- Inputs dinámicos aquí -->
            </div>

            <button class="btn" id="solveBtn">Calcular Solución</button>
        </div>

        <div class="glass-panel hidden" id="resultsPanel">
            <div class="controls-row">
                <h3>Resultados y Procedimiento</h3>
                <div class="switch-container">
                    <label>Vista Detallada:</label>
                    <input type="checkbox" id="detailedToggle" checked>
                </div>
            </div>
            
            <div id="resultsContent"></div>
            
            <div class="chart-block hidden" id="mainChartWrap">
                <div class="chart-tabs" id="chartTabs"></div>
                <div class="chart-container">
                    <canvas id="mainChart"></canvas>
                </div>
                <div class="chart-caption" id="chartCaption"></div>
            </div>
        </div>
    </div>

    <!-- Calculadora (Oculta por defecto) -->
    <div class="glass-panel hidden" id="calcPanel">
        <h2>Calculadora Científica</h2>
        <div class="calc-grid" id="calcGrid">
            <div class="calc-display" id="calcDisplay">
                <div class="history" id="calcHist"></div>
                <div id="calcVal">0</div>
            </div>
            <!-- Fila Memoria y Modo -->
            <button class="calc-btn op" onclick="calcAction('MC')">MC</button>
            <button class="calc-btn op" onclick="calcAction('MR')">MR</button>
            <button class="calc-btn op" onclick="calcAction('M+')">M+</button>
            <button class="calc-btn op" onclick="calcAction('M-')">M-</button>
            
            <button class="calc-btn op" onclick="calcAction('MODE')" id="calcModeBtn">DEG</button>
            <button class="calc-btn op" onclick="calcAction('C')">C</button>
            <button class="calc-btn op" onclick="calcAction('DEL')">DEL</button>
            <button class="calc-btn op" onclick="calcAction('/')">/</button>
            
            <button class="calc-btn" onclick="calcAction('sin')">sin</button>
            <button class="calc-btn" onclick="calcAction('cos')">cos</button>
            <button class="calc-btn" onclick="calcAction('tan')">tan</button>
            <button class="calc-btn op" onclick="calcAction('*')">*</button>

            <button class="calc-btn" onclick="calcAction('asin')">asin</button>
            <button class="calc-btn" onclick="calcAction('acos')">acos</button>
            <button class="calc-btn" onclick="calcAction('atan')">atan</button>
            <button class="calc-btn op" onclick="calcAction('-')">-</button>
            
            <button class="calc-btn" onclick="calcAction('ln')">ln</button>
            <button class="calc-btn" onclick="calcAction('7')">7</button>
            <button class="calc-btn" onclick="calcAction('8')">8</button>
            <button class="calc-btn" onclick="calcAction('9')">9</button>
            
            <button class="calc-btn" onclick="calcAction('log')">log</button>
            <button class="calc-btn" onclick="calcAction('4')">4</button>
            <button class="calc-btn" onclick="calcAction('5')">5</button>
            <button class="calc-btn" onclick="calcAction('6')">6</button>
            <button class="calc-btn op" style="grid-row: span 2;" onclick="calcAction('+')">+</button>

            <button class="calc-btn" onclick="calcAction('sqrt')">√</button>
            <button class="calc-btn" onclick="calcAction('1')">1</button>
            <button class="calc-btn" onclick="calcAction('2')">2</button>
            <button class="calc-btn" onclick="calcAction('3')">3</button>

            <button class="calc-btn" onclick="calcAction('^')">^</button>
            <button class="calc-btn" onclick="calcAction('0')">0</button>
            <button class="calc-btn" onclick="calcAction('.')">.</button>
            <button class="calc-btn" onclick="calcAction('(-)')">±</button>
            
            <button class="calc-btn eq" onclick="calcAction('=')">=</button>
        </div>
    </div>
</main>

<footer>
    Desarrollado por Fisbert — MetResp © 2026
</footer>

<script>
/* ================= ESTRUCTURA Y DATOS ================= */
const methods = {
    raices: [
        { id: 'nr', name: 'Newton-Raphson', inputs: ['fx', 'fdx', 'x0', 'tol', 'iter'], theory: '<h4>Método de Newton-Raphson</h4><p>Basado en Taylor. Fórmula: x_{i+1} = x_i - f(x_i)/f\'(x_i). Convergencia cuadrática. Requiere f\'(x) ≠ 0.</p>', examples: [{ name: 'Exponencial', data: { fx: 'exp(x) - 2 + x^2', x0: '0', tol: '0.01', iter: '50' } }, { name: 'Cúbica', data: { fx: 'x^3 - 2*x - 5', x0: '2', tol: '0.01', iter: '50' } }, { name: 'Trigonométrica', data: { fx: 'cos(x) - x', x0: '0.5', tol: '0.001', iter: '50' } }] },
        { id: 'bis', name: 'Bisección', inputs: ['fx', 'a', 'b', 'tol', 'iter'], theory: '<h4>Método de Bisección</h4><p>Basado en el Teorema del Valor Intermedio. Divide el intervalo a la mitad. Convergencia lineal garantizada si f(a)·f(b) < 0.</p>', examples: [{ name: 'Ejemplo 1', data: { fx: 'exp(3*x)-4', a: '0', b: '1', tol: '0.01', iter: '50' } }, { name: 'Ejemplo 2', data: { fx: 'x^3-2*x-5', a: '2', b: '3', tol: '0.01', iter: '50' } }, { name: 'Ejemplo 3', data: { fx: 'sin(x)-x/2', a: '1', b: '2', tol: '0.01', iter: '50' } }] },
        { id: 'pf', name: 'Punto Fijo', inputs: ['fx', 'gx', 'x0', 'tol', 'iter'], theory: '<h4>Método de Punto Fijo</h4><p>Transforma f(x)=0 en x=g(x). Converge si |g\'(x)| < 1 en la vecindad de la raíz.</p>', examples: [{ name: 'Ejemplo 1', data: { fx: '2*sin(x)-x', gx: '2*sin(x)', x0: '1.5', tol: '0.01', iter: '50' } }, { name: 'Ejemplo 2', data: { fx: 'exp(-x)-x', gx: 'exp(-x)', x0: '0.5', tol: '0.01', iter: '50' } }, { name: 'Ejemplo 3', data: { fx: 'x^2-3', gx: 'sqrt(3+x)-1', x0: '1.5', tol: '0.01', iter: '50' } }] },

/* ================= UTILIDADES ================= */
function normExpr(expr) {
    if(!expr) return '';
    return expr
        .replace(/sen/gi, 'sin')
        .replace(/ln/gi, 'log')
        .replace(/e\^x/gi, 'exp(x)')
        .replace(/(\d)(x)/gi, '$1*$2')
        .replace(/x\^2/gi, 'x^2');
}

function evaluateExpr(expr, scope = {}) {
    try {
        let compiled = math.compile(normExpr(expr));
        return compiled.evaluate(scope);
    } catch(e) {
        return NaN;
    }
}

function getDerivative(expr, variable = 'x') {
    try {
        return math.derivative(normExpr(expr), variable).toString();
    } catch(e) {
        return null;
    }
}

function getVal(id) {
    let el = document.getElementById(`inp_${id}`);
    if(!el) return 0;
    if(el.tagName === 'TEXTAREA') return el.value;
    if(el.dataset.type === 'points') {
        let rows = el.querySelectorAll('.dyn-row');
        let pts = [];
        rows.forEach(r => {
            let ins = r.querySelectorAll('input');
            pts.push({x: parseFloat(ins[0].value), y: parseFloat(ins[1].value)});
        });
        return pts;
    }
    return parseFloat(el.value);
}

function getStr(id) {
    let el = document.getElementById(`inp_${id}`);
    return el ? el.value : '';
}

function addPointRow(div, x='', y='') {
    let row = document.createElement('div');
    row.className = 'dyn-row';
    row.innerHTML = `
        <input type="number" step="any" placeholder="x" value="${x}">
        <input type="number" step="any" placeholder="y" value="${y}">
        <button class="btn-small" onclick="this.parentElement.remove()">X</button>
    `;
    div.insertBefore(row, div.lastElementChild);
}

function createPointsInput(id, container, initial) {
    let div = document.createElement('div');
    div.id = `inp_${id}`;
    div.dataset.type = 'points';
    div.className = 'dynamic-table';

    let btn = document.createElement('button');
    btn.className = 'btn-small';
    btn.innerText = '+ Agregar Punto';
    btn.onclick = () => addPointRow(div);
    div.appendChild(btn);

    (initial || [[1, 1], [2, 4], [3, 9]]).forEach(p => {
        let x = Array.isArray(p) ? p[0] : p.x;
        let y = Array.isArray(p) ? p[1] : p.y;
        addPointRow(div, x, y);
    });

    container.appendChild(div);
}

// Reemplaza los puntos de una tabla dinámica (ejemplos precargados e historial)
function setPointsInput(id, pts) {
    let div = document.getElementById(`inp_${id}`);
    if(!div || !Array.isArray(pts)) return;
    div.querySelectorAll('.dyn-row').forEach(r => r.remove());
    pts.forEach(p => {
        let x = Array.isArray(p) ? p[0] : p.x;
        let y = Array.isArray(p) ? p[1] : p.y;
        if(x === undefined || y === undefined || x === null || y === null) return;
        addPointRow(div, x, y);
    });
}

/* ================= UI RENDER ================= */
function renderTabs() {
    let catTabs = document.getElementById('catTabs');
    catTabs.innerHTML = '';
    Object.keys(methods).forEach(cat => {
        let name = document.querySelector(`.cat-tab[data-cat="${cat}"]`)?.innerText || cat;
        if(cat === 'raices') name = 'Raíces';
        else if(cat === 'sistemas') name = 'Sistemas Lineales';
        else if(cat === 'interpolacion') name = 'Interpolación';
        else if(cat === 'integracion') name = 'Integración';
        else if(cat === 'edo') name = 'Ec. Diferenciales';
        else if(cat === 'ajuste') name = 'Ajuste de Curvas';
        else if(cat === 'calc') name = 'Calculadora';

        let b = document.createElement('button');
        b.className = `cat-tab ${cat === currentCategory ? 'active' : ''}`;
        b.dataset.cat = cat;
        b.innerText = name;
        b.onclick = () => {
            currentCategory = cat;
            if(methods[cat].length > 0) currentMethod = methods[cat][0].id;
            updateUI();
        };
        catTabs.appendChild(b);
    });

    let mTabs = document.getElementById('methodTabs');
    mTabs.innerHTML = '';
    if (currentCategory === 'calc') {
        document.getElementById('methodContainer').classList.add('hidden');
        document.getElementById('calcPanel').classList.remove('hidden');
        return;
    } else {
        document.getElementById('methodContainer').classList.remove('hidden');
        document.getElementById('calcPanel').classList.add('hidden');
    }

    methods[currentCategory].forEach(m => {
        let b = document.createElement('button');
        b.className = `method-tab ${m.id === currentMethod ? 'active' : ''}`;
        b.innerText = m.name;
        b.onclick = () => {
            currentMethod = m.id;
            updateUI();
        };
        mTabs.appendChild(b);
    });
}

function updateUI() {
    renderTabs();
    if(currentCategory === 'calc') return;

    let m = methods[currentCategory].find(x => x.id === currentMethod);
    document.getElementById('methodTitle').innerText = `Método: ${m.name}`;
    
    let form = document.getElementById('dynamicForm');
    form.innerHTML = '';
    
    // Remove old theory and examples if any
    document.querySelectorAll('.theory-box').forEach(el => el.remove());
    document.querySelectorAll('.examples-box').forEach(el => el.remove());

    // Add theory box
    let theoryBox = document.createElement('div');
    theoryBox.className = 'theory-box';
    theoryBox.innerHTML = m.theory || '';
    form.parentElement.insertBefore(theoryBox, form);

    if(m.examples && m.examples.length > 0) {
        let exDiv = document.createElement('div');
        exDiv.className = 'examples-box';
        let lbl = document.createElement('span');
        lbl.className = 'examples-label';
        lbl.innerText = 'Ejemplos:';
        exDiv.appendChild(lbl);
        m.examples.forEach((ex, i) => {
            let btn = document.createElement('button');
            btn.className = 'example-btn';
            btn.innerText = ex.name;
            btn.onclick = () => {
                if(currentMethod === 'linint') resetLinTable();
                Object.entries(ex.data).forEach(([k, v]) => {
                    let el = document.getElementById(`inp_${k}`);
                    if(!el) return;
                    if(el.dataset.type === 'points') setPointsInput(k, v);
                    else { el.value = v; el.classList.remove('auto-filled'); }
                });
                if(currentMethod === 'linint') {
                    linMode = (ex.data.lin_y3 !== undefined && ex.data.lin_x3 === undefined) ? 'x' : 'y';
                    syncLinHeaders();
                    runLinInterp(false);
                }
            };
            exDiv.appendChild(btn);
        });
        form.parentElement.insertBefore(exDiv, form);
    }

    m.inputs.forEach(inp => {
        let def = inputDefinitions[inp];
        let grp = document.createElement('div');
        grp.className = 'form-group';
        grp.innerHTML = `<label>${def.label}</label>`;
        form.appendChild(grp); // insertar antes de construir: los widgets buscan sus inputs por id

        if (def.isLinTable) {
            grp.classList.add('lin-full');
            createLinTableInput(grp);
        } else if (def.isPoints) {
            createPointsInput(inp, grp);
        } else if (def.isTextarea) {
            grp.innerHTML += `<textarea id="inp_${inp}" placeholder="${def.placeholder}"></textarea>`;
        } else {
            grp.innerHTML += `<input type="${def.type || 'text'}" id="inp_${inp}" placeholder="${def.placeholder}">`;
        }
    });

    document.getElementById('resultsPanel').classList.add('hidden');
    chartViews = [];

}

/* ================= HISTORIAL ================= */
function saveHistory(data) {
    let hist = JSON.parse(localStorage.getItem('metresp_history') || '[]');
    hist.unshift({
        time: new Date().toLocaleString(),
        cat: currentCategory,
        method: currentMethod,
        data: data
    });
    if(hist.length > 10) hist.pop();
    localStorage.setItem('metresp_history', JSON.stringify(hist));
    loadHistorySelect();
}

function loadHistorySelect() {
    let sel = document.getElementById('historySelect');
    sel.innerHTML = '<option value="">Cargar historial...</option>';
    let hist = JSON.parse(localStorage.getItem('metresp_history') || '[]');
    hist.forEach((h, i) => {
        let opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `${h.time} - ${h.method}`;
        sel.appendChild(opt);
    });
}

document.getElementById('historySelect').addEventListener('change', (e) => {
    let idx = e.target.value;
    if(idx === '') return;
    let hist = JSON.parse(localStorage.getItem('metresp_history') || '[]');
    let item = hist[idx];
    if(!item) return;
    currentCategory = item.cat;
    currentMethod = item.method;
    updateUI();
    
    // Fill inputs
    if(item.cat === 'interpolacion' && item.method === 'linint') resetLinTable();
    Object.keys(item.data).forEach(k => {
        let el = document.getElementById(`inp_${k}`);
        if(el) {
            if(el.dataset.type === 'points') {
                setPointsInput(k, item.data[k]);
            } else {
                el.value = item.data[k];
            }
        }
    });

    if(currentMethod === 'linint') { linMode = 'y'; syncLinHeaders(); runLinInterp(false); }
});

document.getElementById('solveBtn').addEventListener('click', () => {
    if(currentMethod === 'linint') { runLinInterp(true); return; }

    let res = document.getElementById('resultsContent');
    res.innerHTML = '';
    document.getElementById('resultsPanel').classList.remove('hidden');
    setCharts([]);
    
    let html = '';
    let table = '';
    let lastRoot = null;
    let isDetailed = document.getElementById('detailedToggle').checked;
    
    const addStep = (title, content) => {
        html += `<div class="step-card"><strong>${title}</strong><br>${content}</div>`;
    };

    let savedData = {};

    try {
        if(currentMethod === 'nr') {
            let fx = getStr('fx');
            let fdx = getStr('fdx');
            if(!fdx) { fdx = getDerivative(fx); addStep('Derivada automática', `f'(x) = ${fdx}`); }
            let x0 = getVal('x0');
            let tol = getVal('tol');
            let maxIter = getVal('iter') || 50;
            savedData = {fx, fdx, x0, tol, iter: maxIter};

            table = `<table><tr><th>Iter</th><th>x_i</th><th>f(x_i)</th><th>f'(x_i)</th><th>Error (%)</th></tr>`;
            let ea = 100, xi = x0, iter = 0;
            let histX = [], histErr = [];
            
            while(ea > tol && iter < maxIter) {
                let fxi = evaluateExpr(fx, {x: xi});
                let fdxi = evaluateExpr(fdx, {x: xi});
                let x_next = xi - (fxi / fdxi);
                
                if(iter > 0) ea = Math.abs((x_next - xi) / x_next) * 100;

                addStep(`Iteración ${iter}`, `
                    1) Evaluar: f(${xi}) = ${fxi.toFixed(6)}, f'(${xi}) = ${fdxi.toFixed(6)}<br>
                    2) Fórmula: x_i+1 = x_i - f(xi)/f'(xi) = ${xi} - (${fxi}/${fdxi}) = <span class="result-box">${x_next.toFixed(6)}</span><br>
                    3) Error: ${iter>0 ? `${ea.toFixed(4)}%` : '-'}
                `);
                table += `<tr><td>${iter}</td><td>${xi.toFixed(6)}</td><td>${fxi.toFixed(6)}</td><td>${fdxi.toFixed(6)}</td><td>${iter>0?ea.toFixed(4):'-'}</td></tr>`;
                
                histX.push(xi);
                if(iter > 0) histErr.push(ea);
                xi = x_next;
                iter++;
            }
            table += '</table>';
            lastRoot = xi;
            histX.push(xi);
            setCharts(vistasRaiz(fx, xi, histX, histErr, { a: x0 }));

        } else if(currentMethod === 'bis') {
            let fx = getStr('fx');
            let a = getVal('a');
            let b = getVal('b');
            let tol = getVal('tol');
            let maxIter = getVal('iter') || 50;
            savedData = {fx, a, b, tol, iter:maxIter};

            let fa = evaluateExpr(fx, {x: a});
            let fb = evaluateExpr(fx, {x: b});
            if(fa * fb >= 0) {
                res.innerHTML = `<div class="badge danger">Error: f(a) y f(b) deben tener signos opuestos.</div>`;
                return;
            }

            table = `<table><tr><th>Iter</th><th>a</th><th>b</th><th>m</th><th>f(m)</th><th>Error (%)</th></tr>`;
            let ea = 100, iter = 0, m;
            let aIni = a, bIni = b, histX = [], histErr = [];

            while(ea > tol && iter < maxIter) {
                m = (a + b) / 2;
                let fm = evaluateExpr(fx, {x: m});
                fa = evaluateExpr(fx, {x: a});
                ea = Math.abs((b - a) / 2) * 100;

                addStep(`Iteración ${iter}`, `
                    I) Medio: m = (${a} + ${b})/2 = <span class="result-box">${m.toFixed(6)}</span><br>
                    II) f(m) = ${fm.toFixed(6)}<br>
                    III) Nuevo intervalo: f(a)*f(m) = ${fa.toFixed(2)}*${fm.toFixed(2)} ${fa*fm < 0 ? '< 0 (b=m)' : '> 0 (a=m)'}<br>
                    IV) Error: ${ea.toFixed(4)}%
                `);

                table += `<tr><td>${iter}</td><td>${a.toFixed(6)}</td><td>${b.toFixed(6)}</td><td>${m.toFixed(6)}</td><td>${fm.toFixed(6)}</td><td>${ea.toFixed(4)}</td></tr>`;
                
                histX.push(m);
                histErr.push(ea);
                if(fa * fm < 0) b = m; else a = m;
                iter++;
            }
            table += '</table>';
            lastRoot = m;
            setCharts(vistasRaiz(fx, m, histX, histErr, { a: aIni, b: bIni }));
        }
        else if (currentMethod === 'gj') {
            let n = getVal('sys_n');
            let raw = getStr('sys_matrix');
            savedData = {sys_n: n, sys_matrix: raw};
            let rows = raw.trim().split('\n').map(r => r.split(',').map(Number));
            
            let A_orig = rows.map(r => r.slice(0, n));
            let b_orig = rows.map(r => r[n]);

            addStep('Matriz Inicial', renderMatrix(rows));
            
            for(let i=0; i<n; i++) {
                let pivot = rows[i][i];
                if(pivot === 0) { addStep('Error', 'Pivote 0 detectado, se requiere pivoteo (no implementado en esta versión básica)'); break; }
                
                for(let j=0; j<=n; j++) rows[i][j] /= pivot;
                addStep(`Pivoteo Fila ${i+1}`, `R${i+1} = R${i+1} / ${pivot.toFixed(2)}<br>` + renderMatrix(rows));

                for(let k=0; k<n; k++) {
                    if(k !== i) {
                        let factor = rows[k][i];
                        for(let j=0; j<=n; j++) rows[k][j] -= factor * rows[i][j];
                        addStep(`Eliminación Fila ${k+1}`, `R${k+1} = R${k+1} - (${factor.toFixed(2)})*R${i+1}<br>` + renderMatrix(rows));
                    }
                }
            }
            
            table = '<h4>Solución:</h4><ul>';
            for(let i=0; i<n; i++) table += `<li>x${i+1} = ${rows[i][n].toFixed(4)}</li>`;
            table += '</ul>';

            let solGJ = [];
            for(let i=0; i<n; i++) solGJ.push(rows[i][n]);
            let resGJ = residualTable(A_orig, b_orig, solGJ);
            table += buildVerif({
                fundamento: `Las operaciones por filas transforman la matriz paso a paso, pero un vector x sólo es solución si satisface <b>simultáneamente todas las ecuaciones del sistema original</b>. Por eso se sustituyen los valores obtenidos en cada ecuación tal como fue planteada y se compara con su término independiente: si todos los residuos |Ax &minus; b| son nulos, ninguna operación de fila introdujo error.`,
                comprobacion: resGJ.html,
                ok: resGJ.maxRes < 1e-6,
                okTxt: `Todas las ecuaciones se satisfacen (residuo máximo ${linFmt(resGJ.maxRes, 10)}): la solución es correcta.`,
                malTxt: `Hay residuos apreciables (máximo ${linFmt(resGJ.maxRes, 10)}); revisa la matriz o la necesidad de pivoteo.`
            });

            setCharts(vistasSistemaDirecto(A_orig, b_orig, solGJ, 'Gauss-Jordan'));
        }
        else if (currentMethod === 'eu') {
            let fxy = getStr('fxy');
            let x0 = getVal('x0');
            let y0 = getVal('y0');
            let h = getVal('h');
            let xf = getVal('xf');
            savedData = {fxy, x0, y0, h, xf};

            table = `<table><tr><th>Iter</th><th>x</th><th>y</th><th>f(x,y)</th></tr>`;
            let x = x0, y = y0, iter = 0;
            let xPlot=[], yPlot=[];

            while(x <= xf + h/2) {
                xPlot.push(x); yPlot.push(y);
                let fval = evaluateExpr(fxy, {x: x, y: y});
                
                addStep(`Paso ${iter}`, `
                    x = ${x.toFixed(4)}, y = ${y.toFixed(6)}<br>
                    f(${x}, ${y}) = ${fval.toFixed(6)}<br>
                    y_sig = ${y.toFixed(6)} + ${h} * ${fval.toFixed(6)} = <span class="result-box">${(y + h*fval).toFixed(6)}</span>
                `);
                
                table += `<tr><td>${iter}</td><td>${x.toFixed(4)}</td><td>${y.toFixed(6)}</td><td>${fval.toFixed(6)}</td></tr>`;
                
                y = y + h * fval;
                x += h;
                iter++;
            }
            table += '</table>';
            setCharts(vistasEDO(fxy, xPlot, yPlot, 'Euler'));

            let yFinalEu = yPlot[yPlot.length - 1];
            let xFinalEu = xPlot[xPlot.length - 1];
            let refEu = rk4Reference(fxy, x0, y0, xFinalEu);
            let errEu = Math.abs(yFinalEu - refEu);
            let errRelEu = Math.abs(refEu) > 1e-12 ? errEu / Math.abs(refEu) * 100 : 0;
            let pendNum = yPlot.length > 1 ? (yPlot[1] - yPlot[0]) / h : NaN;
            let pendEDO = evaluateExpr(fxy, {x: x0, y: y0});
            let yMitad = rk4Reference(fxy, x0, y0, xFinalEu, 4000);

            table += buildVerif({
                fundamento: `La solución numérica de una EDO debe cumplir dos cosas. Primero, <b>respetar la ecuación diferencial</b>: la pendiente con la que avanza cada paso tiene que ser f(x,y) evaluada en el punto de partida, que es exactamente lo que impone la fórmula de Euler. Segundo, <b>converger</b>: como Euler es de primer orden (error global O(h)), su resultado debe acercarse a la solución verdadera cuando el paso disminuye. Por eso se contrasta el valor final con una solución de referencia calculada con Runge-Kutta 4 y un paso miles de veces menor, cuyo error es despreciable frente al de Euler.`,
                comprobacion: `<b>1) El primer paso respeta la EDO:</b><br>
                    Pendiente usada: (y<sub>1</sub> &minus; y<sub>0</sub>)/h = ${linFmt(pendNum, 8)}<br>
                    Pendiente exigida por la ecuación: f(${linFmt(x0)}, ${linFmt(y0)}) = ${linFmt(pendEDO, 8)}<br>
                    Diferencia: ${linFmt(Math.abs(pendNum - pendEDO), 10)}<br><br>
                    <b>2) Contraste con la solución de referencia en x = ${linFmt(xFinalEu)}:</b>
                    <table>
                        <tr><th>Cálculo</th><th>y(${linFmt(xFinalEu)})</th></tr>
                        <tr><td>Euler con h = ${linFmt(h)}</td><td>${linFmt(yFinalEu, 8)}</td></tr>
                        <tr><td>Referencia RK4 (paso muy fino)</td><td>${linFmt(refEu, 8)}</td></tr>
                        <tr><td>Referencia con el doble de pasos</td><td>${linFmt(yMitad, 8)}</td></tr>
                        <tr><td>Error absoluto de Euler</td><td>${linFmt(errEu, 8)}</td></tr>
                        <tr><td>Error relativo</td><td>${linFmt(errRelEu, 6)} %</td></tr>
                    </table>`,
                ok: Math.abs(pendNum - pendEDO) < 1e-8,
                okTxt: `Cada paso reproduce la fórmula de Euler y el resultado sigue la solución de la EDO.`,
                malTxt: `El avance no coincide con f(x,y); revisa la expresión introducida.`,
                nota: `La diferencia frente a la referencia (${linFmt(errRelEu, 4)} %) no es un fallo del cálculo: es el error de truncamiento propio de Euler, proporcional a h. Al reducir h a la mitad, ese error debería reducirse aproximadamente a la mitad.`
            });
        }
        else if (currentMethod === 'pf') {
            let fx = getStr('fx');
            let gx = getStr('gx');
            let x0 = getVal('x0');
            let tol = getVal('tol');
            let maxIter = getVal('iter') || 50;
            savedData = {fx, gx, x0, tol, iter: maxIter};
            table = `<table><tr><th>Iter</th><th>x_i</th><th>g(x_i)</th><th>Error (%)</th></tr>`;
            let ea = 100, xi = x0, iter = 0;
            let histX = [], histErr = [];
            while(ea > tol && iter < maxIter) {
                let x_next = evaluateExpr(gx, {x: xi});
                if(iter > 0) ea = Math.abs((x_next - xi) / x_next) * 100;
                addStep(`Iteración ${iter}`, `1) x_i = ${xi.toFixed(6)}<br>2) g(x_i) = <span class="result-box">${x_next.toFixed(6)}</span><br>3) Error: ${iter>0 ? ea.toFixed(4)+'%' : '-'}`);
                table += `<tr><td>${iter}</td><td>${xi.toFixed(6)}</td><td>${x_next.toFixed(6)}</td><td>${iter>0?ea.toFixed(4):'-'}</td></tr>`;
                histX.push(xi);
                if(iter > 0) histErr.push(ea);
                xi = x_next;
                iter++;
            }
            table += '</table>';
            lastRoot = xi;
            histX.push(xi);
            setCharts(vistasPuntoFijo(fx, gx, xi, histX, histErr));
        }
        else if (currentMethod === 'sec') {
            let fx = getStr('fx');
            let x0 = getVal('x0');
            let x1 = getVal('x1');
            let tol = getVal('tol');
            let maxIter = getVal('iter') || 50;
            savedData = {fx, x0, x1, tol, iter: maxIter};
            table = `<table><tr><th>Iter</th><th>x_{i-1}</th><th>x_i</th><th>x_{i+1}</th><th>Error (%)</th></tr>`;
            let ea = 100, xi_prev = x0, xi = x1, iter = 0;
            let histX = [], histErr = [];
            while(ea > tol && iter < maxIter) {
                let fxi = evaluateExpr(fx, {x: xi});
                let fxi_prev = evaluateExpr(fx, {x: xi_prev});
                let x_next = xi - fxi * (xi - xi_prev) / (fxi - fxi_prev);
                ea = Math.abs((x_next - xi) / x_next) * 100;
                addStep(`Iteración ${iter}`, `f(${xi_prev.toFixed(4)}) = ${fxi_prev.toFixed(4)}, f(${xi.toFixed(4)}) = ${fxi.toFixed(4)}<br>Fórmula: x_{i+1} = <span class="result-box">${x_next.toFixed(6)}</span><br>Error: ${ea.toFixed(4)}%`);
                table += `<tr><td>${iter}</td><td>${xi_prev.toFixed(6)}</td><td>${xi.toFixed(6)}</td><td>${x_next.toFixed(6)}</td><td>${ea.toFixed(4)}</td></tr>`;
                histX.push(xi);
                histErr.push(ea);
                xi_prev = xi;
                xi = x_next;
                iter++;
            }
            table += '</table>';
            lastRoot = xi;
            histX.push(xi);
            setCharts(vistasRaiz(fx, xi, histX, histErr, { a: x0, b: x1 }));
        }
        else if (currentMethod === 'rf') {
            let fx = getStr('fx');
            let a = getVal('a');
            let b = getVal('b');
            let tol = getVal('tol');
            let maxIter = getVal('iter') || 50;
            savedData = {fx, a, b, tol, iter: maxIter};
            let fa = evaluateExpr(fx, {x: a});
            let fb = evaluateExpr(fx, {x: b});
            if(fa * fb >= 0) {
                res.innerHTML = `<div class="badge danger">Error: f(a) y f(b) deben tener signos opuestos.</div>`;
                return;
            }
            table = `<table><tr><th>Iter</th><th>a</th><th>b</th><th>c</th><th>f(c)</th><th>Error (%)</th></tr>`;
            let ea = 100, iter = 0, c, c_prev = a;
            let aIni = a, bIni = b, histX = [], histErr = [];
            while(ea > tol && iter < maxIter) {
                fa = evaluateExpr(fx, {x: a});
                fb = evaluateExpr(fx, {x: b});
                c = a - fa * (b - a) / (fb - fa);
                let fc = evaluateExpr(fx, {x: c});
                if(iter > 0) ea = Math.abs((c - c_prev) / c) * 100;
                addStep(`Iteración ${iter}`, `a=${a.toFixed(4)}, b=${b.toFixed(4)}<br>c = <span class="result-box">${c.toFixed(6)}</span><br>f(c) = ${fc.toFixed(6)}<br>Error: ${iter>0 ? ea.toFixed(4)+'%' : '-'}`);
                table += `<tr><td>${iter}</td><td>${a.toFixed(6)}</td><td>${b.toFixed(6)}</td><td>${c.toFixed(6)}</td><td>${fc.toFixed(6)}</td><td>${iter>0?ea.toFixed(4):'-'}</td></tr>`;
                histX.push(c);
                if(iter > 0) histErr.push(ea);
                if(fa * fc < 0) b = c; else a = c;
                c_prev = c;
                iter++;
            }
            table += '</table>';
            lastRoot = c;
            histX.push(c);
            setCharts(vistasRaiz(fx, c, histX, histErr, { a: aIni, b: bIni }));
        }
        else if (currentMethod === 'jac' || currentMethod === 'gs') {
            let n = getVal('sys_n');
            let raw = getStr('sys_matrix');
            let tol = getVal('tol');
            let maxIter = getVal('iter') || 50;
            savedData = {sys_n: n, sys_matrix: raw, tol, iter: maxIter};
            let rows = raw.trim().split('\n').map(r => r.split(',').map(Number));
            let x = new Array(n).fill(0);
            let x_new = new Array(n).fill(0);
            table = `<table><tr><th>Iter</th>` + x.map((_,i)=>`<th>x${i+1}</th>`).join('') + `<th>Error (%)</th></tr><tr><td>0</td>` + x.map(v=>`<td>${v}</td>`).join('') + `<td>-</td></tr>`;
            let ea = 100, iter = 0;
            let histX = [[...x]], histErr = [];
            while(ea > tol && iter < maxIter) {
                let max_ea = 0;
                let stepStr = "";
                for(let i=0; i<n; i++) {
                    let sum = 0;
                    for(let j=0; j<n; j++) {
                        if(j !== i) sum += rows[i][j] * (currentMethod === 'gs' ? x_new[j] : x[j]);
                    }
                    x_new[i] = (rows[i][n] - sum) / rows[i][i];
                    let curr_ea = Math.abs((x_new[i] - x[i]) / (x_new[i] === 0 ? 1 : x_new[i])) * 100;
                    if(curr_ea > max_ea) max_ea = curr_ea;
                    stepStr += `x${i+1} = (${rows[i][n].toFixed(2)} - suma)/${rows[i][i].toFixed(2)} = ${x_new[i].toFixed(6)}<br>`;
                }
                ea = max_ea;
                addStep(`Iteración ${iter+1}`, stepStr + `Error max: ${ea.toFixed(4)}%`);
                table += `<tr><td>${iter+1}</td>` + x_new.map(v=>`<td>${v.toFixed(6)}</td>`).join('') + `<td>${ea.toFixed(4)}</td></tr>`;
                histX.push([...x_new]);
                histErr.push(ea);
                x = [...x_new];
                iter++;
            }
            table += '</table>';

            let A_it = rows.map(r => r.slice(0, n));
            let b_it = rows.map(r => r[n]);
            let resIt = residualTable(A_it, b_it, x_new);

            let domFilas = '', dominante = true;
            for(let i=0; i<n; i++) {
                let diag = Math.abs(A_it[i][i]);
                let resto = 0;
                for(let j=0; j<n; j++) if(j !== i) resto += Math.abs(A_it[i][j]);
                if(diag < resto) dominante = false;
                domFilas += `<tr><td>${i+1}</td><td>${linFmt(diag, 4)}</td><td>${linFmt(resto, 4)}</td><td>${diag >= resto ? 'Cumple' : 'No cumple'}</td></tr>`;
            }

            table += buildVerif({
                fundamento: `Un método iterativo se detiene cuando dos aproximaciones consecutivas difieren menos que la tolerancia, pero eso sólo indica que la sucesión se estabilizó: <b>no demuestra que el valor alcanzado resuelva el sistema</b>. La prueba definitiva es sustituir la última aproximación en las ecuaciones originales y medir los residuos. Se revisa además la dominancia diagonal (|a<sub>ii</sub>| &ge; &Sigma;|a<sub>ij</sub>|), condición suficiente que garantiza la convergencia del método.`,
                comprobacion: resIt.html +
                    `<br><b>Criterio de convergencia (dominancia diagonal):</b>
                    <table><tr><th>Fila</th><th>|a<sub>ii</sub>|</th><th>&Sigma;|a<sub>ij</sub>| (j&ne;i)</th><th>Condición</th></tr>${domFilas}</table>
                    ${dominante ? 'La matriz es diagonalmente dominante: la convergencia estaba garantizada de antemano.' : 'La matriz no es diagonalmente dominante: el método puede converger igualmente, pero no está garantizado.'}
                    <br><br>Iteraciones realizadas: ${iter} &nbsp;|&nbsp; error final entre iteraciones: ${linFmt(ea, 6)} %`,
                ok: resIt.maxRes < 1e-3,
                okTxt: `La solución satisface el sistema (residuo máximo ${linFmt(resIt.maxRes, 8)}).`,
                malTxt: `Residuo máximo ${linFmt(resIt.maxRes, 8)}: la aproximación aún está lejos; reduce la tolerancia o aumenta las iteraciones.`,
                nota: `Al ser un método iterativo el residuo depende de la tolerancia pedida: más iteraciones lo acercan más a cero.`
            });

            setCharts(vistasSistemaIterativo(histX, histErr, currentMethod === 'gs' ? 'Gauss-Seidel' : 'Jacobi')
                .concat(vistasSistemaDirecto(A_it, b_it, x_new, currentMethod === 'gs' ? 'Gauss-Seidel' : 'Jacobi').slice(-1)));
        }
        else if (currentMethod === 'lag') {
            let pts = getVal('points').filter(p => !isNaN(p.x) && !isNaN(p.y));
            let x_eval = getVal('x_eval');
            if(pts.length < 2 || isNaN(x_eval)) {

                    if(j !== i) {
                        L *= (x_eval - pts[j].x) / (pts[i].x - pts[j].x);
                        num += `(${x_eval} - ${pts[j].x})`;

                    }
                }

            }
            addStep('Cálculo de Términos', stepStr);

            for(let px = Math.min(...pts.map(p=>p.x))-1; px <= Math.max(...pts.map(p=>p.x))+1; px+=0.1) {

            let filasLag = '', maxErrLag = 0, sumaL = 0;

            let detalleL = '';
            for(let i = 0; i < n; i++) {

            table += buildVerif({
                fundamento: `El polinomio de Lagrange se construye para <b>pasar exactamente por cada punto dado</b>: por eso la prueba es evaluarlo en las abscisas de los datos y comprobar que devuelve sus ordenadas. Se añade una segunda propiedad que caracteriza a la base de Lagrange: la suma de todos los polinomios base vale 1 en cualquier x (&Sigma;L<sub>i</sub>(x) = 1), lo que confirma que los pesos del promedio están bien calculados.`,
                comprobacion: `<b>1) El polinomio reproduce cada punto:</b>
                    <table><tr><th>i</th><th>x<sub>i</sub></th><th>y<sub>i</sub></th><th>P(x<sub>i</sub>)</th><th>|Error|</th></tr>${filasLag}</table>
                    <br><b>2) Suma de los polinomios base en x = ${linFmt(x_eval)}:</b><br>${detalleL}
                    &Sigma;L<sub>i</sub> = ${linFmt(sumaL, 10)} (debe ser 1)`,

            });
        }
        else if (currentMethod === 'new') {
            const f = linFmt;

            // --- Tabla de diferencias divididas ---

            for(let j = 1; j < n; j++) {

                        &nbsp;&nbsp;&nbsp;= ( ${f(dd[i + 1][j - 1], 6)} − ${f(dd[i][j - 1], 6)} ) / ( ${f(pts[i + j].x)} − ${f(pts[i].x)} )
                        = ${f(num, 6)} / ${f(den, 6)} = <b>${f(dd[i][j], 8)}</b><br><br>`;

                Donde cada coeficiente es una diferencia dividida: a<sub>j</sub> = f(x<sub>0</sub>, x<sub>1</sub>, ..., x<sub>j</sub>).`);

            addStep('3. Cálculo de las diferencias divididas', detalle);

                for(let j = 0; j < n - i; j++) {
                    let esCoef = (i === 0);

                }
                for(let j = n - i; j < n; j++) tablaHtml += `<td></td>`;
                tablaHtml += `</tr>`;
            }
            tablaHtml += `</table>`;
            addStep('4. Tabla de diferencias divididas', tablaHtml +
                `<br>Los coeficientes a<sub>j</sub> son los valores de la primera fila (recuadrados).`);

            // --- Paso 5: coeficientes ---
            let coefTxt = coefs.map((a, i) => `a<sub>${i}</sub> = ${f(a, 8)}`).join(' &nbsp;&nbsp;|&nbsp;&nbsp; ');
            addStep('5. Coeficientes del polinomio', coefTxt);

            // --- Paso 6: polinomio en forma de Newton ---
            addStep('6. Polinomio de Newton',
                `Forma general:<br><span class="math-expr">P(x) = ${newtonPolyString(coefs, pts, false)}</span><br><br>
                 Sustituyendo los coeficientes:<br><span class="math-expr">P(x) = ${newtonPolyString(coefs, pts, true)}</span>`);

            // --- Paso 7: forma expandida ---
            let expandido = [coefs[0]];
            let base = [1];
            for(let i = 1; i < n; i++) {
                base = polyMul(base, [-pts[i - 1].x, 1]);
                for(let k = 0; k < base.length; k++) expandido[k] = (expandido[k] || 0) + coefs[i] * base[k];
            }
            for(let k = 0; k < expandido.length; k++) if(expandido[k] === undefined) expandido[k] = 0;
            addStep('7. Polinomio simplificado (forma estándar)',
                `<span class="math-expr">P(x) = ${polyToString(expandido)}</span>`);

            // --- Paso 8: evaluación opcional ---
            let yEval = null;
            if(x_eval !== null && !isNaN(x_eval)) {
                yEval = polyEval(expandido, x_eval);
                let sust = `P(${f(x_eval)}) = `;
                let partes = [];
                let acum = 0;
                for(let i = 0; i < n; i++) {
                    let prod = coefs[i];
                    let factores = '';
                    for(let k = 0; k < i; k++) {
                        prod *= (x_eval - pts[k].x);
                        factores += `(${f(x_eval)} − ${f(pts[k].x)})`;

            } else {
                table = `<div class="result-box" style="font-size:1.05rem;">P(x) = ${polyToString(expandido)}</div>

            }

            table += `<table style="max-width:560px;">
                <tr><th>Concepto</th><th>Valor</th></tr>
                <tr><td>Grado</td><td>${n - 1}</td></tr>
                <tr><td>Forma de Newton</td><td>${newtonPolyString(coefs, pts, true)}</td></tr>
                <tr><td>Forma estándar</td><td>P(x) = ${polyToString(expandido)}</td></tr>
            </table>`;

            // --- Verificación: el polinomio debe pasar por todos los puntos ---
            let verifRows = '';
            let maxErr = 0;
            pts.forEach((p, i) => {

                let err = Math.abs(pv - p.y);
                if(err > maxErr) maxErr = err;
                verifRows += `<tr><td>${i}</td><td>${f(p.x)}</td><td>${f(p.y)}</td><td>${f(pv, 8)}</td><td>${f(err, 10)}</td></tr>`;
            });
            table += buildVerif({
                fundamento: `El polinomio de Newton se construye imponiendo que <b>pase exactamente por los n puntos dados</b>; ésa es la condición que define sus coeficientes. Por tanto, evaluarlo en cada abscisa x<sub>j</sub> y comparar con f(x<sub>j</sub>) comprueba de una vez la tabla de diferencias divididas, los coeficientes a<sub>j</sub> y la expansión algebraica: si un solo paso tuviera un error, el polinomio dejaría de pasar por alguno de los puntos.`,
                comprobacion: `<table><tr><th>j</th><th>x<sub>j</sub></th><th>f(x<sub>j</sub>)</th><th>P(x<sub>j</sub>)</th><th>|Error|</th></tr>${verifRows}</table>`,
                ok: maxErr < 1e-8,
                okTxt: `P(x) pasa por todos los puntos: el polinomio es el interpolante correcto.`,
                malTxt: `Se detectaron diferencias; revisa los datos ingresados.`,
                nota: `Con n puntos el interpolante de grado n&minus;1 es único: el polinomio obtenido por Newton y el de Lagrange son el mismo, sólo escrito de otra forma.`
            });

            setCharts(vistasInterpolacion(px => polyEval(expandido, px), pts, x_eval, yEval,
                'Polinomio de Newton de grado ' + (n - 1),
                `La curva azul es P(x) = ${polyToString(expandido)}. Debe <b>pasar por cada punto morado</b>: ésa es la comprobación visual de la tabla de diferencias divididas.${x_eval !== null && !isNaN(x_eval) ? ` El rombo verde es el valor evaluado P(${linFmt(x_eval)}) = ${linFmt(yEval, 6)}.` : ''}`));
        }
        else if (currentMethod === 'trap' || currentMethod === 's13' || currentMethod === 's38') {
            let fx = getStr('fx');
            let a = getVal('a'), b = getVal('b');

            savedData = {fx, a, b};
            if(currentMethod === 'trap') savedData.n_int = n;
            if(currentMethod === 's13') { savedData.n_even = n; if(n%2 !== 0) { res.innerHTML = `<div class="badge danger">n debe ser par.</div>`; return; } }
            if(currentMethod === 's38') { savedData.n_mult3 = n; if(n%3 !== 0) { res.innerHTML = `<div class="badge danger">n debe ser múltiplo de 3.</div>`; return; } }
            
            let h = (b - a) / n;
            let sum = 0, stepStr = `h = (${b} - ${a})/${n} = ${h.toFixed(4)}<br>`;
            
            for(let i=0; i<=n; i++) {
                let xi = a + i*h;
                let fxi = evaluateExpr(fx, {x: xi});
                let coeff = 1;
                
                if(i !== 0 && i !== n) {
                    if(currentMethod === 'trap') coeff = 2;
                    else if(currentMethod === 's13') coeff = i%2 === 1 ? 4 : 2;
                    else if(currentMethod === 's38') coeff = i%3 === 0 ? 2 : 3;
                }
                sum += coeff * fxi;
                stepStr += `f(x_${i}) = f(${xi.toFixed(4)}) = ${fxi.toFixed(4)} (coef: ${coeff})<br>`;
            }
            
            let finalRes = sum * (currentMethod === 'trap' ? h/2 : currentMethod === 's13' ? h/3 : 3*h/8);
            addStep('Evaluación', stepStr);
            table = `<div class="result-box">Integral = ${finalRes.toFixed(6)}</div>`;

            let ref = refIntegral(fx, a, b);
            let errAbs = Math.abs(finalRes - ref);
            let errRel = Math.abs(ref) > 1e-12 ? errAbs / Math.abs(ref) * 100 : 0;
            let paso = currentMethod === 's38' ? 2 : 2;
            let res2n = integrateRule(currentMethod, fx, a, b, n * paso);
            let dif2n = Math.abs(res2n - finalRes);
            let ordenTxt = currentMethod === 'trap' ? 'O(h²): al duplicar n el error debería reducirse ~4 veces'
                          : 'O(h⁴): al duplicar n el error debería reducirse ~16 veces';
            let nombreRegla = currentMethod === 'trap' ? 'trapecio' : currentMethod === 's13' ? 'Simpson 1/3' : 'Simpson 3/8';

            table += buildVerif({
                fundamento: `Una integral aproximada no puede comprobarse sustituyendo en una ecuación, porque su valor exacto es justamente lo que se desconoce. Lo que sí puede hacerse es <b>refinar</b>: toda regla de integración converge al valor exacto cuando el paso h tiende a cero. Por eso se compara el resultado con el de la misma función calculado con un mallado muy fino (Simpson con 2000 subintervalos, error despreciable) y se repite la propia regla con el doble de intervalos: si ambas cifras coinciden con la obtenida, el cálculo es consistente y el error es sólo el de truncamiento propio del método (${ordenTxt}).`,
                comprobacion: `Regla aplicada: ${nombreRegla} con n = ${n} &nbsp;(h = ${linFmt(h, 6)})<br><br>
                    <table>
                        <tr><th>Cálculo</th><th>Valor</th></tr>

                        <tr><td>Error absoluto frente a la referencia</td><td>${linFmt(errAbs, 8)}</td></tr>
                        <tr><td>Error relativo</td><td>${linFmt(errRel, 6)} %</td></tr>

        }
        else if (currentMethod === 'rk4') {

            let x = x0, y = y0, iter = 0;
            let xPlot=[], yPlot=[];
            while(x <= xf + h/2) {

                let k4 = h * evaluateExpr(fxy, {x: x + h, y: y + k3});
                addStep(`Paso ${iter}`, `x=${x.toFixed(4)}, y=${y.toFixed(6)}<br>k1=${k1.toFixed(6)}<br>k2=${k2.toFixed(6)}<br>k3=${k3.toFixed(6)}<br>k4=${k4.toFixed(6)}<br>y_sig=<span class="result-box">${(y + (k1 + 2*k2 + 2*k3 + k4)/6).toFixed(6)}</span>`);
                table += `<tr><td>${iter}</td><td>${x.toFixed(4)}</td><td>${y.toFixed(6)}</td><td>${k1.toFixed(6)}</td><td>${k2.toFixed(6)}</td><td>${k3.toFixed(6)}</td><td>${k4.toFixed(6)}</td></tr>`;
                y += (k1 + 2*k2 + 2*k3 + k4) / 6; x += h; iter++;
            }
            table += '</table>';
            setCharts(vistasEDO(fxy, xPlot, yPlot, 'Runge-Kutta 4'));

            let yFinalRK = yPlot[yPlot.length - 1];
            let xFinalRK = xPlot[xPlot.length - 1];
            let refRK = rk4Reference(fxy, x0, y0, xFinalRK);
            let errRK = Math.abs(yFinalRK - refRK);

            let rkMitad = (() => {
                let hh = h / 2, xx = x0, yy = y0;
                while(xx < xFinalRK - hh/2) {

                    let k2 = hh * evaluateExpr(fxy, {x: xx + hh/2, y: yy + k1/2});
                    let k3 = hh * evaluateExpr(fxy, {x: xx + hh/2, y: yy + k2/2});
                    let k4 = hh * evaluateExpr(fxy, {x: xx + hh, y: yy + k3});
                    yy += (k1 + 2*k2 + 2*k3 + k4)/6; xx += hh;
                }
                return yy;
            })();

            table += buildVerif({
                fundamento: `RK4 estima cada paso promediando cuatro pendientes (k<sub>1</sub>..k<sub>4</sub>) y tiene error global O(h⁴): al reducir el paso a la mitad el error debe caer unas 16 veces. Esa propiedad permite verificarlo <b>sin conocer la solución analítica</b>: se repite el cálculo con la mitad del paso y con un paso muy fino; si las tres cifras coinciden en sus primeros decimales, el método ya convergió y el resultado es fiable. Es el mismo razonamiento que sustenta el control de paso en los solucionadores profesionales.`,
                comprobacion: `<table>
                        <tr><th>Cálculo</th><th>y(${linFmt(xFinalRK)})</th></tr>
                        <tr><td>RK4 con h = ${linFmt(h)}</td><td>${linFmt(yFinalRK, 10)}</td></tr>
                        <tr><td>RK4 con h/2 = ${linFmt(h/2)}</td><td>${linFmt(rkMitad, 10)}</td></tr>
                        <tr><td>Referencia RK4 (paso muy fino)</td><td>${linFmt(refRK, 10)}</td></tr>
                        <tr><td>Error absoluto</td><td>${linFmt(errRK, 10)}</td></tr>
                        <tr><td>Error relativo</td><td>${linFmt(errRelRK, 8)} %</td></tr>
                    </table>`,
                ok: errRelRK < 0.1,
                okTxt: `Los tres cálculos coinciden: la solución numérica ha convergido.`,
                malTxt: `Diferencia del ${linFmt(errRelRK, 6)} % frente a la referencia: reduce el paso h.`,
                nota: `Compara con Euler sobre el mismo problema: con idéntico h, RK4 alcanza varios órdenes de magnitud más de precisión.`
            });
        }
        else if (currentMethod === 'minc') {
            let pts = getVal('points');
            let degree = getVal('degree') || 1;
