<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetResp - Métodos Numéricos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #120e1f;
            --text-color: #ffffff;
            --primary: #8a2be2;
            --primary-hover: #9b4dff;
            --secondary: #00d2ff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --danger: #ff4757;
            --success: #2ed573;
            --input-bg: rgba(0, 0, 0, 0.3);
            --font-main: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --text-color: #1a1a1a;
            --primary: #6c5ce7;
            --primary-hover: #5f27cd;
            --secondary: #0984e3;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.1);
            --input-bg: rgba(255, 255, 255, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-color);
            background-image: linear-gradient(135deg, var(--bg-color) 0%, #2a0845 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        [data-theme="light"] body {
            background-image: linear-gradient(135deg, var(--bg-color) 0%, #dcdde1 100%);
        }

        header {
            padding: 1rem 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls button, .header-controls select {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-main);
            margin-left: 0.5rem;
        }

        .header-controls button:hover {
            background: var(--primary);
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        /* Navigation */
        .cat-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .cat-tab {
            padding: 0.8rem 1.5rem;
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .cat-tab:hover, .cat-tab.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .method-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .method-tab {
            padding: 0.5rem 1rem;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .method-tab:hover, .method-tab.active {
            background: var(--secondary);
            border-color: var(--secondary);
            color: #000;
        }

        /* Smart Input */
        .smart-input-container {
            margin-bottom: 2rem;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 1rem;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 1rem;
            resize: vertical;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        input {
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 0.8rem;
            border-radius: 8px;
            font-family: var(--font-mono);
        }

        .btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            width: 100%;
            transition: opacity 0.3s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Results Area */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .switch-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .step-card {
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            font-family: var(--font-mono);
        }

        .math-expr {
            color: var(--secondary);
        }

        .result-box {
            border: 1px solid var(--success);
            padding: 0.5rem;
            display: inline-block;
            margin: 0.5rem 0;
            border-radius: 4px;
        }

        .badge {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge.success { background: var(--success); color: black; }
        .badge.danger { background: var(--danger); color: white; }
        .badge.info { background: var(--secondary); color: black; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        th, td {
            border: 1px solid var(--glass-border);
            padding: 0.8rem;
            text-align: center;
        }

        th {
            background: var(--primary);
            color: white;
        }

        .chart-container {
            width: 100%;
            height: 400px;
            margin-top: 2rem;
            background: var(--input-bg);
            border-radius: 8px;
            padding: 1rem;
        }

        .hidden { display: none !important; }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
        }

        /* Calculadora Styles */
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
        }
        .calc-display {
            grid-column: 1 / -1;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 1rem;
            text-align: right;
            font-family: var(--font-mono);
            font-size: 1.5rem;
            min-height: 80px;
            word-break: break-all;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .calc-display .history {
            font-size: 0.9rem;
            color: #aaa;
        }
        .calc-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .calc-btn:hover { background: var(--primary); }
        .calc-btn.op { background: var(--primary-hover); }
        .calc-btn.eq { grid-column: 1 / -1; background: var(--secondary); color: black; }

        /* Print CSS */
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            .glass-panel {
                border: none !important;
                box-shadow: none !important;
            }
            header, .cat-tabs, .method-tabs, .smart-input-container, .form-grid, .btn, .controls-row {
                display: none !important;
            }
            .step-card, table, .chart-container {
                page-break-inside: avoid;
            }
        }
        
        .dynamic-table {
            display: grid;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .dyn-row {
            display: flex;
            gap: 0.5rem;
        }
        .dyn-row input { flex: 1; }
        .btn-small { padding: 0.5rem; border:none; border-radius:4px; cursor:pointer; background:var(--primary); color:white;}
        .theory-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-left: 4px solid var(--secondary);
            border-radius: 8px;
            padding: 1rem 1.2rem;
            margin-bottom: 1.5rem;
            font-size: 0.92rem;
            line-height: 1.6;
        }
        .theory-box h4 {
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }
        .theory-box b { color: var(--primary); }

        /* ===== Interpolación Lineal (tabla) ===== */
        .lin-full { grid-column: 1 / -1; }
        .lin-table {
            width: 100%;
            max-width: 620px;
            border-collapse: collapse;
            margin: 0 auto;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }
        .lin-table th, .lin-table td {
            border: 1px solid var(--glass-border);
            padding: 0.5rem 0.7rem;
            text-align: center;
        }
        .lin-table th { background: var(--primary); color: #fff; }
        .lin-table th.corner { background: transparent; }
        .lin-table td.row-label {
            text-align: left;
            font-weight: 600;
            background: var(--glass-bg);
            white-space: nowrap;
        }
        .lin-table td.section {
            text-align: left;
            font-weight: 700;
            color: var(--secondary);
            background: var(--glass-bg);
            letter-spacing: 0.02em;
        }
        .lin-table input {
            width: 100%;
            padding: 0.45rem;
            text-align: center;
            border-radius: 6px;
        }
        .lin-table input.var-name { font-weight: 700; color: var(--secondary); }
        .lin-table input.auto-filled {
            border-color: var(--success);
            color: var(--success);
            background: rgba(46, 213, 115, 0.10);
            font-weight: 700;
        }
        .lin-hint {
            font-size: 0.82rem;
            opacity: 0.8;
            margin-top: 0.6rem;
            text-align: center;
        }
        .lin-status { margin-top: 0.6rem; text-align: center; }
    </style>
</head>
<body>

<header>
    <div class="logo">MetResp</div>
    <div class="header-controls">
        <select id="historySelect">
            <option value="">Cargar historial...</option>
        </select>
        <button id="themeToggle">Tema Claro</button>
        <button onclick="window.print()">Exportar PDF</button>
    </div>
</header>

<main>
    <!-- Navegación de Categorías -->
    <div class="cat-tabs" id="catTabs">
        <button class="cat-tab active" data-cat="raices">Raíces</button>
        <button class="cat-tab" data-cat="sistemas">Sistemas Lineales</button>
        <button class="cat-tab" data-cat="interpolacion">Interpolación</button>
        <button class="cat-tab" data-cat="integracion">Integración</button>
        <button class="cat-tab" data-cat="edo">Ec. Diferenciales</button>
        <button class="cat-tab" data-cat="ajuste">Ajuste de Curvas</button>
        <button class="cat-tab" data-cat="calc">Calculadora</button>
    </div>

    <!-- Navegación de Métodos -->
    <div class="method-tabs" id="methodTabs">
        <!-- Renderizado dinámico -->
    </div>

    <div id="methodContainer">
        <div class="glass-panel" id="inputPanel">
            <h2 id="methodTitle" style="margin-bottom: 1rem;"></h2>
            
            <div class="smart-input-container" id="smartInputWrap">
                <label>Entrada Inteligente (Intenta detectar método y parámetros automáticamente):</label>
                <textarea id="smartInput" placeholder="Ej: Resolver f(x)=exp(x)-2 con Newton, x0=0, error 0.01"></textarea>
            </div>

            <div id="dynamicForm" class="form-grid">
                <!-- Inputs dinámicos aquí -->
            </div>

            <button class="btn" id="solveBtn">Calcular Solución</button>
        </div>

        <div class="glass-panel hidden" id="resultsPanel">
            <div class="controls-row">
                <h3>Resultados y Procedimiento</h3>
                <div class="switch-container">
                    <label>Vista Detallada:</label>
                    <input type="checkbox" id="detailedToggle" checked>
                </div>
            </div>
            
            <div id="resultsContent"></div>
            
            <div class="chart-container hidden" id="mainChartWrap">
                <canvas id="mainChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Calculadora (Oculta por defecto) -->
    <div class="glass-panel hidden" id="calcPanel">
        <h2>Calculadora Científica</h2>
        <div class="calc-grid" id="calcGrid">
            <div class="calc-display" id="calcDisplay">
                <div class="history" id="calcHist"></div>
                <div id="calcVal">0</div>
            </div>
            <!-- Fila Memoria y Modo -->
            <button class="calc-btn op" onclick="calcAction('MC')">MC</button>
            <button class="calc-btn op" onclick="calcAction('MR')">MR</button>
            <button class="calc-btn op" onclick="calcAction('M+')">M+</button>
            <button class="calc-btn op" onclick="calcAction('M-')">M-</button>
            
            <button class="calc-btn op" onclick="calcAction('MODE')" id="calcModeBtn">DEG</button>
            <button class="calc-btn op" onclick="calcAction('C')">C</button>
            <button class="calc-btn op" onclick="calcAction('DEL')">DEL</button>
            <button class="calc-btn op" onclick="calcAction('/')">/</button>
            
            <button class="calc-btn" onclick="calcAction('sin')">sin</button>
            <button class="calc-btn" onclick="calcAction('cos')">cos</button>
            <button class="calc-btn" onclick="calcAction('tan')">tan</button>
            <button class="calc-btn op" onclick="calcAction('*')">*</button>

            <button class="calc-btn" onclick="calcAction('asin')">asin</button>
            <button class="calc-btn" onclick="calcAction('acos')">acos</button>
            <button class="calc-btn" onclick="calcAction('atan')">atan</button>
            <button class="calc-btn op" onclick="calcAction('-')">-</button>
            
            <button class="calc-btn" onclick="calcAction('ln')">ln</button>
            <button class="calc-btn" onclick="calcAction('7')">7</button>
            <button class="calc-btn" onclick="calcAction('8')">8</button>
            <button class="calc-btn" onclick="calcAction('9')">9</button>
            
            <button class="calc-btn" onclick="calcAction('log')">log</button>
            <button class="calc-btn" onclick="calcAction('4')">4</button>
            <button class="calc-btn" onclick="calcAction('5')">5</button>
            <button class="calc-btn" onclick="calcAction('6')">6</button>
            <button class="calc-btn op" style="grid-row: span 2;" onclick="calcAction('+')">+</button>

            <button class="calc-btn" onclick="calcAction('sqrt')">√</button>
            <button class="calc-btn" onclick="calcAction('1')">1</button>
            <button class="calc-btn" onclick="calcAction('2')">2</button>
            <button class="calc-btn" onclick="calcAction('3')">3</button>

            <button class="calc-btn" onclick="calcAction('^')">^</button>
            <button class="calc-btn" onclick="calcAction('0')">0</button>
            <button class="calc-btn" onclick="calcAction('.')">.</button>
            <button class="calc-btn" onclick="calcAction('(-)')">±</button>
            
            <button class="calc-btn eq" onclick="calcAction('=')">=</button>
        </div>
    </div>
</main>

<footer>
    Desarrollado por Fisbert — MetResp © 2026
</footer>

<script>
/* ================= ESTRUCTURA Y DATOS ================= */
const methods = {
    raices: [
        { id: 'nr', name: 'Newton-Raphson', inputs: ['fx', 'fdx', 'x0', 'tol', 'iter'], theory: '<h4>Método de Newton-Raphson</h4><p>Basado en Taylor. Fórmula: x_{i+1} = x_i - f(x_i)/f\'(x_i). Convergencia cuadrática. Requiere f\'(x) ≠ 0.</p>', examples: [{ name: 'Exponencial', data: { fx: 'exp(x) - 2 + x^2', x0: '0', tol: '0.01', iter: '50' } }, { name: 'Cúbica', data: { fx: 'x^3 - 2*x - 5', x0: '2', tol: '0.01', iter: '50' } }, { name: 'Trigonométrica', data: { fx: 'cos(x) - x', x0: '0.5', tol: '0.001', iter: '50' } }] },
        { id: 'bis', name: 'Bisección', inputs: ['fx', 'a', 'b', 'tol', 'iter'], theory: '<h4>Método de Bisección</h4><p>Basado en el Teorema del Valor Intermedio. Divide el intervalo a la mitad. Convergencia lineal garantizada si f(a)·f(b) < 0.</p>', examples: [{ name: 'Ejemplo 1', data: { fx: 'exp(3*x)-4', a: '0', b: '1', tol: '0.01', iter: '50' } }, { name: 'Ejemplo 2', data: { fx: 'x^3-2*x-5', a: '2', b: '3', tol: '0.01', iter: '50' } }, { name: 'Ejemplo 3', data: { fx: 'sin(x)-x/2', a: '1', b: '2', tol: '0.01', iter: '50' } }] },
        { id: 'pf', name: 'Punto Fijo', inputs: ['fx', 'gx', 'x0', 'tol', 'iter'], theory: '<h4>Método de Punto Fijo</h4><p>Transforma f(x)=0 en x=g(x). Converge si |g\'(x)| < 1 en la vecindad de la raíz.</p>', examples: [{ name: 'Ejemplo 1', data: { fx: '2*sin(x)-x', gx: '2*sin(x)', x0: '1.5', tol: '0.01', iter: '50' } }, { name: 'Ejemplo 2', data: { fx: 'exp(-x)-x', gx: 'exp(-x)', x0: '0.5', tol: '0.01', iter: '50' } }, { name: 'Ejemplo 3', data: { fx: 'x^2-3', gx: 'sqrt(3+x)-1', x0: '1.5', tol: '0.01', iter: '50' } }] },
        { id: 'sec', name: 'Secante', inputs: ['fx', 'x0', 'x1', 'tol', 'iter'], theory: '<h4>Método de la Secante</h4><p>Similar a Newton pero aproxima f\'(x) con diferencias finitas. No requiere derivada. Convergencia superlineal (orden ≈ 1.618).</p>', examples: [{ name: 'Ejemplo 1', data: { fx: 'x^3-2*x-5', x0: '2', x1: '3', tol: '0.01', iter: '50' } }, { name: 'Ejemplo 2', data: { fx: 'exp(x)-3', x0: '0', x1: '1', tol: '0.01', iter: '50' } }, { name: 'Ejemplo 3', data: { fx: 'x^2-4*sin(x)', x0: '1', x1: '2', tol: '0.01', iter: '50' } }] },
        { id: 'rf', name: 'Regla Falsa', inputs: ['fx', 'a', 'b', 'tol', 'iter'], theory: '<h4>Método de Regla Falsa</h4><p>Combina la seguridad de bisección con la velocidad de la secante. Siempre converge si f(a)·f(b) < 0.</p>', examples: [{ name: 'Ejemplo 1', data: { fx: 'x^3-2*x-5', a: '2', b: '3', tol: '0.01', iter: '50' } }, { name: 'Ejemplo 2', data: { fx: 'exp(x)-3', a: '0', b: '2', tol: '0.01', iter: '50' } }, { name: 'Ejemplo 3', data: { fx: 'x*sin(x)-1', a: '0', b: '2', tol: '0.01', iter: '50' } }] }
    ],
    sistemas: [
        { id: 'gj', name: 'Gauss-Jordan', inputs: ['sys_n', 'sys_matrix'], theory: '<h4>Método de Gauss-Jordan</h4><p>Eliminación por filas hasta RREF. Encuentra solución exacta. Complejidad O(n³).</p>', examples: [{ name: 'Ejemplo 1', data: { sys_n: '3', sys_matrix: '2,1,-1,8\n-3,-1,2,-11\n-2,1,2,-3' } }, { name: 'Ejemplo 2', data: { sys_n: '3', sys_matrix: '1,1,1,6\n2,3,1,14\n1,2,3,14' } }] },
        { id: 'jac', name: 'Jacobi', inputs: ['sys_n', 'sys_matrix', 'tol', 'iter'], theory: '<h4>Método de Jacobi</h4><p>Método iterativo para sistemas. Converge si la matriz es diagonalmente dominante. Usa valores de la iteración anterior.</p>', examples: [{ name: 'Ejemplo 1', data: { sys_n: '3', sys_matrix: '2,1,-1,8\n-3,-1,2,-11\n-2,1,2,-3', tol: '0.01', iter: '25' } }, { name: 'Ejemplo 2', data: { sys_n: '3', sys_matrix: '1,1,1,6\n2,3,1,14\n1,2,3,14', tol: '0.01', iter: '25' } }] },
        { id: 'gs', name: 'Gauss-Seidel', inputs: ['sys_n', 'sys_matrix', 'tol', 'iter'], theory: '<h4>Método de Gauss-Seidel</h4><p>Similar a Jacobi pero usa valores actualizados inmediatamente. Generalmente converge más rápido.</p>', examples: [{ name: 'Ejemplo 1', data: { sys_n: '3', sys_matrix: '2,1,-1,8\n-3,-1,2,-11\n-2,1,2,-3', tol: '0.01', iter: '25' } }, { name: 'Ejemplo 2', data: { sys_n: '3', sys_matrix: '1,1,1,6\n2,3,1,14\n1,2,3,14', tol: '0.01', iter: '25' } }] },
        { id: 'lu', name: 'Factorización LU', inputs: ['sys_n', 'sys_matrix'], theory: '<h4>Factorización LU</h4><p>Descompone A = L·U. Eficiente para resolver múltiples sistemas con la misma matriz.</p>', examples: [{ name: 'Ejemplo 1', data: { sys_n: '3', sys_matrix: '2,1,-1,8\n-3,-1,2,-11\n-2,1,2,-3' } }, { name: 'Ejemplo 2', data: { sys_n: '3', sys_matrix: '1,1,1,6\n2,3,1,14\n1,2,3,14' } }] }
    ],
    interpolacion: [

/* ================= UTILIDADES ================= */
function normExpr(expr) {
    if(!expr) return '';
    return expr
        .replace(/sen/gi, 'sin')
        .replace(/ln/gi, 'log')
        .replace(/e\^x/gi, 'exp(x)')
        .replace(/(\d)(x)/gi, '$1*$2')
        .replace(/x\^2/gi, 'x^2');
}

function evaluateExpr(expr, scope = {}) {
    try {
        let compiled = math.compile(normExpr(expr));
        return compiled.evaluate(scope);
    } catch(e) {
        return NaN;
    }
}

function getDerivative(expr, variable = 'x') {
    try {
        return math.derivative(normExpr(expr), variable).toString();
    } catch(e) {
        return null;
    }
}

function getVal(id) {
    let el = document.getElementById(`inp_${id}`);
    if(!el) return 0;
    if(el.tagName === 'TEXTAREA') return el.value;
    if(el.dataset.type === 'points') {
        let rows = el.querySelectorAll('.dyn-row');
        let pts = [];
        rows.forEach(r => {
            let ins = r.querySelectorAll('input');
            pts.push({x: parseFloat(ins[0].value), y: parseFloat(ins[1].value)});
        });
        return pts;
    }
    return parseFloat(el.value);
}

function getStr(id) {
    let el = document.getElementById(`inp_${id}`);
    return el ? el.value : '';
}

function addPointRow(div, x='', y='') {
    let row = document.createElement('div');
    row.className = 'dyn-row';
    row.innerHTML = `
        <input type="number" step="any" placeholder="x" value="${x}">
        <input type="number" step="any" placeholder="y" value="${y}">
        <button class="btn-small" onclick="this.parentElement.remove()">X</button>
    `;
    div.insertBefore(row, div.lastElementChild);
}

function createPointsInput(id, container, initial) {
    let div = document.createElement('div');
    div.id = `inp_${id}`;
    div.dataset.type = 'points';
    div.className = 'dynamic-table';

    let btn = document.createElement('button');
    btn.className = 'btn-small';
    btn.innerText = '+ Agregar Punto';
    btn.onclick = () => addPointRow(div);
    div.appendChild(btn);

    (initial || [[1, 1], [2, 4], [3, 9]]).forEach(p => {
        let x = Array.isArray(p) ? p[0] : p.x;
        let y = Array.isArray(p) ? p[1] : p.y;
        addPointRow(div, x, y);
    });

    container.appendChild(div);
}

// Reemplaza los puntos de una tabla dinámica (ejemplos precargados e historial)
function setPointsInput(id, pts) {
    let div = document.getElementById(`inp_${id}`);
    if(!div || !Array.isArray(pts)) return;
    div.querySelectorAll('.dyn-row').forEach(r => r.remove());
    pts.forEach(p => {
        let x = Array.isArray(p) ? p[0] : p.x;
        let y = Array.isArray(p) ? p[1] : p.y;
        if(x === undefined || y === undefined || x === null || y === null) return;
        addPointRow(div, x, y);
    });
}

/* ================= UI RENDER ================= */
function renderTabs() {
    let catTabs = document.getElementById('catTabs');
    catTabs.innerHTML = '';
    Object.keys(methods).forEach(cat => {
        let name = document.querySelector(`.cat-tab[data-cat="${cat}"]`)?.innerText || cat;
        if(cat === 'raices') name = 'Raíces';
        else if(cat === 'sistemas') name = 'Sistemas Lineales';
        else if(cat === 'interpolacion') name = 'Interpolación';
        else if(cat === 'integracion') name = 'Integración';
        else if(cat === 'edo') name = 'Ec. Diferenciales';
        else if(cat === 'ajuste') name = 'Ajuste de Curvas';
        else if(cat === 'calc') name = 'Calculadora';

        let b = document.createElement('button');
        b.className = `cat-tab ${cat === currentCategory ? 'active' : ''}`;
        b.dataset.cat = cat;
        b.innerText = name;
        b.onclick = () => {
            currentCategory = cat;
            if(methods[cat].length > 0) currentMethod = methods[cat][0].id;
            updateUI();
        };
        catTabs.appendChild(b);
    });

    let mTabs = document.getElementById('methodTabs');
    mTabs.innerHTML = '';
    if (currentCategory === 'calc') {
        document.getElementById('methodContainer').classList.add('hidden');
        document.getElementById('calcPanel').classList.remove('hidden');
        return;
    } else {
        document.getElementById('methodContainer').classList.remove('hidden');
        document.getElementById('calcPanel').classList.add('hidden');
    }

    methods[currentCategory].forEach(m => {
        let b = document.createElement('button');
        b.className = `method-tab ${m.id === currentMethod ? 'active' : ''}`;
        b.innerText = m.name;
        b.onclick = () => {
            currentMethod = m.id;
            updateUI();
        };
        mTabs.appendChild(b);
    });
}

function updateUI() {
    renderTabs();
    if(currentCategory === 'calc') return;

    let m = methods[currentCategory].find(x => x.id === currentMethod);
    document.getElementById('methodTitle').innerText = `Método: ${m.name}`;
    
    let form = document.getElementById('dynamicForm');
    form.innerHTML = '';
    
    // Remove old theory and examples if any
    document.querySelectorAll('.theory-box').forEach(el => el.remove());
    document.querySelectorAll('.examples-box').forEach(el => el.remove());

    // Add theory box
    let theoryBox = document.createElement('div');
    theoryBox.className = 'theory-box';
    theoryBox.innerHTML = m.theory || '';
    form.parentElement.insertBefore(theoryBox, form);

    if(m.examples && m.examples.length > 0) {
        let exDiv = document.createElement('div');
        exDiv.className = 'examples-box';
        exDiv.style.cssText = 'display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem;';
        m.examples.forEach((ex, i) => {
            let btn = document.createElement('button');
            btn.className = 'btn-small';
            btn.style.background = 'var(--secondary)';
            btn.innerText = 'Ejemplo: ' + ex.name;
            btn.onclick = () => {
                if(currentMethod === 'linint') resetLinTable();
                Object.entries(ex.data).forEach(([k, v]) => {
                    let el = document.getElementById(`inp_${k}`);
                    if(!el) return;
                    if(el.dataset.type === 'points') setPointsInput(k, v);
                    else { el.value = v; el.classList.remove('auto-filled'); }
                });
                if(currentMethod === 'linint') {
                    linMode = (ex.data.lin_y3 !== undefined && ex.data.lin_x3 === undefined) ? 'x' : 'y';
                    syncLinHeaders();
                    runLinInterp(false);
                }
            };
            exDiv.appendChild(btn);
        });
        form.appendChild(exDiv);
    }

    m.inputs.forEach(inp => {
        let def = inputDefinitions[inp];
        let grp = document.createElement('div');
        grp.className = 'form-group';
        grp.innerHTML = `<label>${def.label}</label>`;
        form.appendChild(grp); // insertar antes de construir: los widgets buscan sus inputs por id

        if (def.isLinTable) {
            grp.classList.add('lin-full');
            createLinTableInput(grp);
        } else if (def.isPoints) {
            createPointsInput(inp, grp);
        } else if (def.isTextarea) {
            grp.innerHTML += `<textarea id="inp_${inp}" placeholder="${def.placeholder}"></textarea>`;
        } else {
            grp.innerHTML += `<input type="${def.type || 'text'}" id="inp_${inp}" placeholder="${def.placeholder}">`;
        }
    });

    document.getElementById('resultsPanel').classList.add('hidden');
}

function saveHistory(data) {
    let hist = JSON.parse(localStorage.getItem('metresp_history') || '[]');
    hist.unshift({
        time: new Date().toLocaleString(),
        cat: currentCategory,
        method: currentMethod,
        data: data
    });
    if(hist.length > 10) hist.pop();
    localStorage.setItem('metresp_history', JSON.stringify(hist));
    loadHistorySelect();
}

function loadHistorySelect() {
    let sel = document.getElementById('historySelect');
    sel.innerHTML = '<option value="">Cargar historial...</option>';
    let hist = JSON.parse(localStorage.getItem('metresp_history') || '[]');
    hist.forEach((h, i) => {
        let opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `${h.time} - ${h.method}`;
        sel.appendChild(opt);
    });
}

document.getElementById('historySelect').addEventListener('change', (e) => {
    let idx = e.target.value;
    if(idx === '') return;
    let hist = JSON.parse(localStorage.getItem('metresp_history') || '[]');
    let item = hist[idx];
    if(!item) return;
    currentCategory = item.cat;
    currentMethod = item.method;
    updateUI();
    
    // Fill inputs
    if(item.cat === 'interpolacion' && item.method === 'linint') resetLinTable();
    Object.keys(item.data).forEach(k => {
        let el = document.getElementById(`inp_${k}`);
        if(el) {
            if(el.dataset.type === 'points') {
                setPointsInput(k, item.data[k]);
            } else {
                el.value = item.data[k];
            }
        }
    });

    if(currentMethod === 'linint') { linMode = 'y'; syncLinHeaders(); runLinInterp(false); }
});

function plotGraph(type, datasets, labels) {
    let wrap = document.getElementById('mainChartWrap');
    wrap.classList.remove('hidden');
    let ctx = document.getElementById('mainChart').getContext('2d');
    
    if(mainChart) mainChart.destroy();

    mainChart = new Chart(ctx, {
        type: type,
        data: {
            labels: labels,
            datasets: datasets
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { type: type==='scatter'?'linear':'category', position: 'bottom' }
            }
        }
    });
}

function plotFunction(expr, rootX) {
    let xVals = [];
    let yVals = [];
    let range = 5;
    for(let x = rootX - range; x <= rootX + range; x += 0.1) {
        xVals.push(x);
        yVals.push(evaluateExpr(expr, {x: x}));
    }

    plotGraph('line', [
        {
            label: 'f(x)',
            data: yVals,
            borderColor: '#00d2ff',
            tension: 0.1
        },
        {
            label: 'Raíz',
            data: xVals.map(x => Math.abs(x - rootX) < 0.05 ? 0 : null),
            borderColor: '#ff4757',
            pointRadius: 5,
            showLine: false
        }
    ], xVals.map(x => x.toFixed(1)));
}

/* ================= ENGINE MATEMÁTICO ================= */

document.getElementById('solveBtn').addEventListener('click', () => {
    if(currentMethod === 'linint') { runLinInterp(true); return; }

    let res = document.getElementById('resultsContent');
    res.innerHTML = '';
    document.getElementById('resultsPanel').classList.remove('hidden');
    document.getElementById('mainChartWrap').classList.add('hidden');
    
    let html = '';
    let table = '';
    let lastRoot = null;
    let isDetailed = document.getElementById('detailedToggle').checked;
    
    const addStep = (title, content) => {
        html += `<div class="step-card"><strong>${title}</strong><br>${content}</div>`;
    };

    let savedData = {};

    try {
        if(currentMethod === 'nr') {
            let fx = getStr('fx');
            let fdx = getStr('fdx');
            if(!fdx) { fdx = getDerivative(fx); addStep('Derivada automática', `f'(x) = ${fdx}`); }
            let x0 = getVal('x0');
            let tol = getVal('tol');
            let maxIter = getVal('iter') || 50;
            savedData = {fx, fdx, x0, tol, iter: maxIter};

            table = `<table><tr><th>Iter</th><th>x_i</th><th>f(x_i)</th><th>f'(x_i)</th><th>Error (%)</th></tr>`;
            let ea = 100, xi = x0, iter = 0;
            
            while(ea > tol && iter < maxIter) {
                let fxi = evaluateExpr(fx, {x: xi});
                let fdxi = evaluateExpr(fdx, {x: xi});
                let x_next = xi - (fxi / fdxi);
                
                if(iter > 0) ea = Math.abs((x_next - xi) / x_next) * 100;

                addStep(`Iteración ${iter}`, `
                    1) Evaluar: f(${xi}) = ${fxi.toFixed(6)}, f'(${xi}) = ${fdxi.toFixed(6)}<br>
                    2) Fórmula: x_i+1 = x_i - f(xi)/f'(xi) = ${xi} - (${fxi}/${fdxi}) = <span class="result-box">${x_next.toFixed(6)}</span><br>
                    3) Error: ${iter>0 ? `${ea.toFixed(4)}%` : '-'}
                `);
                table += `<tr><td>${iter}</td><td>${xi.toFixed(6)}</td><td>${fxi.toFixed(6)}</td><td>${fdxi.toFixed(6)}</td><td>${iter>0?ea.toFixed(4):'-'}</td></tr>`;
                
                xi = x_next;
                iter++;
            }
            table += '</table>';
            lastRoot = xi;
            plotFunction(fx, xi);

        } else if(currentMethod === 'bis') {
            let fx = getStr('fx');
            let a = getVal('a');
            let b = getVal('b');
            let tol = getVal('tol');
            let maxIter = getVal('iter') || 50;

                    else if(currentMethod === 's38') coeff = i%3 === 0 ? 2 : 3;
                }
                sum += coeff * fxi;
                stepStr += `f(x_${i}) = f(${xi.toFixed(4)}) = ${fxi.toFixed(4)} (coef: ${coeff})<br>`;
            }
            
            let finalRes = sum * (currentMethod === 'trap' ? h/2 : currentMethod === 's13' ? h/3 : 3*h/8);
            addStep('Evaluación', stepStr);
            table = `<div class="result-box">Integral = ${finalRes.toFixed(6)}</div>`;
        }
        else if (currentMethod === 'rk4') {
            let fxy = getStr('fxy'), x0 = getVal('x0'), y0 = getVal('y0'), h = getVal('h'), xf = getVal('xf');
            savedData = {fxy, x0, y0, h, xf};
            table = `<table><tr><th>Iter</th><th>x</th><th>y</th><th>k1</th><th>k2</th><th>k3</th><th>k4</th></tr>`;
            let x = x0, y = y0, iter = 0;
            let xPlot=[], yPlot=[];
            while(x <= xf + h/2) {
                xPlot.push(x); yPlot.push(y);
                let k1 = h * evaluateExpr(fxy, {x: x, y: y});
                let k2 = h * evaluateExpr(fxy, {x: x + h/2, y: y + k1/2});
                let k3 = h * evaluateExpr(fxy, {x: x + h/2, y: y + k2/2});
                let k4 = h * evaluateExpr(fxy, {x: x + h, y: y + k3});
                addStep(`Paso ${iter}`, `x=${x.toFixed(4)}, y=${y.toFixed(6)}<br>k1=${k1.toFixed(6)}<br>k2=${k2.toFixed(6)}<br>k3=${k3.toFixed(6)}<br>k4=${k4.toFixed(6)}<br>y_sig=<span class="result-box">${(y + (k1 + 2*k2 + 2*k3 + k4)/6).toFixed(6)}</span>`);
                table += `<tr><td>${iter}</td><td>${x.toFixed(4)}</td><td>${y.toFixed(6)}</td><td>${k1.toFixed(6)}</td><td>${k2.toFixed(6)}</td><td>${k3.toFixed(6)}</td><td>${k4.toFixed(6)}</td></tr>`;
                y += (k1 + 2*k2 + 2*k3 + k4) / 6; x += h; iter++;
            }
            table += '</table>';
            plotGraph('line', [{label:'RK4 y(x)', data:yPlot, borderColor:'#ff4757'}], xPlot.map(v=>v.toFixed(2)));
        }
        else if (currentMethod === 'minc') {
            let pts = getVal('points');
            let degree = getVal('degree') || 1;
            savedData = {points: pts, degree};
            let n = pts.length;
            
            // Build sums
            let sums = {};
            for(let p = 0; p <= 2*degree; p++) {
                sums['x'+p] = pts.reduce((s,pt) => s + Math.pow(pt.x, p), 0);
            }
            for(let p = 0; p <= degree; p++) {
                sums['xy'+p] = pts.reduce((s,pt) => s + Math.pow(pt.x, p) * pt.y, 0);
            }
            
            // Build normal equations matrix (degree+1 x degree+2)
            let mat = [];
            for(let i = 0; i <= degree; i++) {
                let row = [];
                for(let j = 0; j <= degree; j++) row.push(sums['x'+(i+j)]);
                row.push(sums['xy'+i]);
                mat.push(row);
            }
            
            addStep('Sumatorias', Object.entries(sums).map(([k,v]) => k + ' = ' + v.toFixed(4)).join('<br>'));
            addStep('Sistema Normal', renderMatrix(mat));
            
            // Solve using Gauss elimination
            let sz = degree + 1;
            for(let i = 0; i < sz; i++) {
                let pivot = mat[i][i];
                if(Math.abs(pivot) < 1e-12) { addStep('Error', 'Pivote cero'); break; }
                for(let j = 0; j <= sz; j++) mat[i][j] /= pivot;
                for(let k = 0; k < sz; k++) {
                    if(k !== i) {
                        let f = mat[k][i];
                        for(let j = 0; j <= sz; j++) mat[k][j] -= f * mat[i][j];
                    }
                }
            }
            
            let coeffs = [];
            for(let i = 0; i < sz; i++) coeffs.push(mat[i][sz]);
            
            // Build polynomial string
            let polyStr = coeffs.map((c, i) => {
                if(i === 0) return c.toFixed(4);
                return (c >= 0 ? ' + ' : ' - ') + Math.abs(c).toFixed(4) + (i === 1 ? 'x' : 'x^' + i);
            }).join('');
            
            // Calculate R²
            let yMean = pts.reduce((s,p) => s + p.y, 0) / n;
            let ssTot = pts.reduce((s,p) => s + Math.pow(p.y - yMean, 2), 0);
            let ssRes = pts.reduce((s,p) => {
                let yPred = coeffs.reduce((sum, c, i) => sum + c * Math.pow(p.x, i), 0);
                return s + Math.pow(p.y - yPred, 2);
            }, 0);
            let r2 = 1 - ssRes / ssTot;
            
            addStep('Coeficientes', coeffs.map((c,i) => 'a' + i + ' = ' + c.toFixed(6)).join('<br>'));
            table = `<div class="result-box">P(x) = ${polyStr}</div><br><div class="result-box">R² = ${r2.toFixed(6)}</div>`;
            
            // Plot
            let xMin = Math.min(...pts.map(p=>p.x)), xMax = Math.max(...pts.map(p=>p.x));
            let fitX = [], fitY = [];
            for(let x = xMin; x <= xMax; x += (xMax-xMin)/50) {
                fitX.push(x.toFixed(2));
                fitY.push(coeffs.reduce((sum, c, i) => sum + c * Math.pow(x, i), 0));
            }
            plotGraph('line', [
                {label:'Ajuste', data:fitY, borderColor:'#00d2ff'},
                {label:'Datos', data:pts.map(p=>p.y), type:'scatter', backgroundColor:'#ff4757'}
            ], fitX);
        }
        else if (currentMethod === 'lu') {
            let n = getVal('sys_n');
            let raw = getStr('sys_matrix');
            savedData = {sys_n: n, sys_matrix: raw};
            let rows = raw.trim().split('\n').map(r => r.split(',').map(Number));
            let A = rows.map(r => r.slice(0, n));
            let b_vec = rows.map(r => r[n]);
            
            // Initialize L and U
            let L = Array.from({length:n}, (_,i) => Array.from({length:n}, (_,j) => i===j?1:0));
            let U = A.map(r => [...r]);
            
            addStep('Matriz Original A', renderMatrix(rows));
            
            for(let i = 0; i < n; i++) {
                for(let k = i+1; k < n; k++) {
                    if(Math.abs(U[i][i]) < 1e-12) { addStep('Error', 'Pivote cero en LU'); break; }
                    let factor = U[k][i] / U[i][i];
                    L[k][i] = factor;
                    for(let j = 0; j < n; j++) U[k][j] -= factor * U[i][j];
                    addStep(`Eliminación F${k+1}`, `L[${k+1}][${i+1}] = ${factor.toFixed(4)}<br>R${k+1} = R${k+1} - ${factor.toFixed(4)} * R${i+1}`);
                }
            }
            
            addStep('Matriz L', renderMatrix(L.map((r,i) => [...r, 0])));
            addStep('Matriz U', renderMatrix(U.map((r,i) => [...r, 0])));
            
            // Forward substitution: Ly = b
            let y = new Array(n).fill(0);
            for(let i = 0; i < n; i++) {
                y[i] = b_vec[i];
                for(let j = 0; j < i; j++) y[i] -= L[i][j] * y[j];
                addStep(`Sustitución Ly=b: y${i+1}`, `y${i+1} = ${y[i].toFixed(6)}`);
            }
            
            // Back substitution: Ux = y
            let x_sol = new Array(n).fill(0);
            for(let i = n-1; i >= 0; i--) {
                x_sol[i] = y[i];
                for(let j = i+1; j < n; j++) x_sol[i] -= U[i][j] * x_sol[j];
                x_sol[i] /= U[i][i];
                addStep(`Sustitución Ux=y: x${i+1}`, `x${i+1} = <span class="result-box">${x_sol[i].toFixed(6)}</span>`);
            }
            
            table = '<h4>Solución:</h4><ul>';
            for(let i = 0; i < n; i++) table += `<li>x${i+1} = ${x_sol[i].toFixed(6)}</li>`;
            table += '</ul>';
        }
        else if (currentMethod === 'spline') {
            let pts = getVal('points').filter(p => !isNaN(p.x) && !isNaN(p.y));
            let x_eval_val = getVal('x_eval');
            if(pts.length < 3 || isNaN(x_eval_val)) {
                res.innerHTML = `<div class="badge danger">Introduce al menos 3 puntos válidos y el valor de x a evaluar.</div>`;
                return;
            }
            savedData = {points: pts, x_eval: x_eval_val};
            pts.sort((a,b) => a.x - b.x);
            let n = pts.length - 1;
            
            // Natural cubic spline
            let h = [], alpha = [];
            for(let i = 0; i < n; i++) h[i] = pts[i+1].x - pts[i].x;
            for(let i = 1; i < n; i++) alpha[i] = (3/h[i])*(pts[i+1].y-pts[i].y) - (3/h[i-1])*(pts[i].y-pts[i-1].y);
            
            let l = new Array(n+1), mu = new Array(n+1), z = new Array(n+1);
            let c = new Array(n+1).fill(0), b_s = new Array(n), d = new Array(n), a_s = pts.map(p => p.y);
            
            l[0] = 1; mu[0] = 0; z[0] = 0;
            for(let i = 1; i < n; i++) {
                l[i] = 2*(pts[i+1].x - pts[i-1].x) - h[i-1]*mu[i-1];
                mu[i] = h[i] / l[i];
                z[i] = (alpha[i] - h[i-1]*z[i-1]) / l[i];
            }
            l[n] = 1; z[n] = 0; c[n] = 0;
            
            for(let j = n-1; j >= 0; j--) {
                c[j] = z[j] - mu[j]*c[j+1];
                b_s[j] = (pts[j+1].y - pts[j].y)/h[j] - h[j]*(c[j+1]+2*c[j])/3;
                d[j] = (c[j+1]-c[j])/(3*h[j]);
            }
            
            // Show spline coefficients
            for(let i = 0; i < n; i++) {
                addStep(`Spline S${i}(x) en [${pts[i].x}, ${pts[i+1].x}]`,
                    `a=${a_s[i].toFixed(4)}, b=${b_s[i].toFixed(4)}, c=${c[i].toFixed(4)}, d=${d[i].toFixed(4)}<br>
                    S${i}(x) = ${a_s[i].toFixed(4)} + ${b_s[i].toFixed(4)}(x-${pts[i].x}) + ${c[i].toFixed(4)}(x-${pts[i].x})² + ${d[i].toFixed(4)}(x-${pts[i].x})³`);
            }
            
            // Evaluate at x_eval
            let result = NaN;
            for(let i = 0; i < n; i++) {
                if(x_eval_val >= pts[i].x && x_eval_val <= pts[i+1].x) {
                    let dx = x_eval_val - pts[i].x;
                    result = a_s[i] + b_s[i]*dx + c[i]*dx*dx + d[i]*dx*dx*dx;
                    break;
                }
            }
            table = `<div class="result-box">S(${x_eval_val}) = ${isNaN(result) ? 'Fuera de rango' : result.toFixed(6)}</div>`;
        }
        else if (currentMethod === 'romb') {
            let fx = getStr('fx');
            let a = getVal('a'), b = getVal('b');
            let n = getVal('n_int') || 4;
            savedData = {fx, a, b, n_int: n};
            
            // Build Romberg table
            let R = [];
            for(let i = 0; i <= n; i++) {
                R[i] = [];
                let h_i = (b - a) / Math.pow(2, i);
                let sum = 0;
                for(let k = 1; k < Math.pow(2, i); k++) sum += evaluateExpr(fx, {x: a + k * h_i});
                R[i][0] = h_i / 2 * (evaluateExpr(fx, {x: a}) + 2 * sum + evaluateExpr(fx, {x: b}));
                addStep(`R[${i+1}][1] - Trapecio h=${h_i.toFixed(4)}`, `R[${i+1}][1] = ${R[i][0].toFixed(8)}`);
            }
            
            for(let j = 1; j <= n; j++) {
                for(let i = j; i <= n; i++) {
                    R[i][j] = (Math.pow(4, j) * R[i][j-1] - R[i-1][j-1]) / (Math.pow(4, j) - 1);
                }
            }
            
            // Show Romberg table
            let tableHtml = '<table><tr><th></th>';
            for(let j = 0; j <= n; j++) tableHtml += `<th>O(h^${2*(j+1)})</th>`;
            tableHtml += '</tr>';
            for(let i = 0; i <= n; i++) {
                tableHtml += `<tr><td>n=${Math.pow(2,i)}</td>`;
                for(let j = 0; j <= i; j++) tableHtml += `<td>${R[i][j].toFixed(8)}</td>`;
                for(let j = i+1; j <= n; j++) tableHtml += '<td></td>';
                tableHtml += '</tr>';
            }
            tableHtml += '</table>';
            addStep('Tabla de Romberg', tableHtml);
            table = `<div class="result-box">Integral ≈ ${R[n][n].toFixed(8)}</div>`;
        }

        // Verification
        if(['nr','bis','pf','sec','rf'].includes(currentMethod) && lastRoot !== null) {
            let rootVal = lastRoot;
            let fRoot = evaluateExpr(getStr('fx'), {x: rootVal});
            let verifyHtml = `<div class="step-card verification"><h4>Verificación del Resultado</h4>
                <div class="math-block">Sustituyendo x = ${rootVal.toFixed(8)} en f(x):<br>
                f(${rootVal.toFixed(8)}) = <span class="result-box">${fRoot.toFixed(10)}</span><br>
                ${Math.abs(fRoot) < 0.01 ? 'El valor es cercano a 0, confirmando que es una raíz válida.' : 'NOTA: f(raíz) no es exactamente 0 debido a la tolerancia elegida.'}
                </div></div>`;
            table += verifyHtml;
        }
        res.innerHTML = (isDetailed ? html : '') + table;
        saveHistory(savedData);

    } catch (e) {
        res.innerHTML = `<div class="badge danger">Error en el cálculo: ${e.message}</div>`;
    }
});

function renderMatrix(mat) {
    let h = '<table style="width:auto; margin:0 auto;">';
    mat.forEach(r => {
        h += '<tr>';
        r.forEach((c, i) => { h += `<td style="${i===r.length-1?'border-left:2px solid var(--primary)':''}">${c.toFixed(2)}</td>` });
        h += '</tr>';
    });
    return h + '</table>';
}

let calcMem = 0;
let calcMode = 'DEG';
let calcExpr = '';
function calcAction(act) {
    let disp = document.getElementById('calcVal');
    let hist = document.getElementById('calcHist');

    if(act === 'C') { calcExpr = ''; disp.innerText = '0'; hist.innerText = ''; }
    else if(act === 'DEL') { calcExpr = calcExpr.slice(0, -1); disp.innerText = calcExpr || '0'; }
    else if(act === 'MODE') {
        calcMode = calcMode === 'DEG' ? 'RAD' : 'DEG';
        document.getElementById('calcModeBtn').innerText = calcMode;
    }
    else if(act === 'MC') { calcMem = 0; }
    else if(act === 'MR') { calcExpr = String(calcMem); disp.innerText = calcExpr; }
    else if(act === 'M+') { try { calcMem += math.evaluate(calcExpr); } catch(e) {} }
    else if(act === 'M-') { try { calcMem -= math.evaluate(calcExpr); } catch(e) {} }
    else if(act === '(-)') {
        try { calcExpr = String(-math.evaluate(calcExpr)); disp.innerText = calcExpr; } catch(e) {}
    }
    else if(act === '=') {
        try {
            let expr = calcExpr;
            if(calcMode === 'DEG') {
                expr = expr.replace(/sin\(/g, 'sin(pi/180*').replace(/cos\(/g, 'cos(pi/180*').replace(/tan\(/g, 'tan(pi/180*');
                expr = expr.replace(/asin\(/g, '(180/pi)*asin(').replace(/acos\(/g, '(180/pi)*acos(').replace(/atan\(/g, '(180/pi)*atan(');
            }
            let result = math.evaluate(expr);
            hist.innerText = calcExpr + ' =';
            calcExpr = String(typeof result === 'number' ? parseFloat(result.toPrecision(12)) : result);
            disp.innerText = calcExpr;
        } catch(e) { disp.innerText = 'Error'; setTimeout(() => { disp.innerText = calcExpr || '0'; }, 1500); }
    }
    else if(['sin','cos','tan','asin','acos','atan','ln','log','sqrt'].includes(act)) {
        calcExpr += act + '('; disp.innerText = calcExpr;
    }
    else {
        calcExpr += act;
        disp.innerText = calcExpr;
    }
}

/* ========== POLINOMIOS (Newton / diferencias divididas) ========== */
// Coeficientes en orden ascendente: [c0, c1, c2] = c0 + c1*x + c2*x^2
function polyMul(p, q) {
    let r = new Array(p.length + q.length - 1).fill(0);
    for(let i = 0; i < p.length; i++)
        for(let j = 0; j < q.length; j++) r[i + j] += p[i] * q[j];
    return r;
}

function polyEval(c, x) {
    let r = 0;
    for(let i = c.length - 1; i >= 0; i--) r = r * x + c[i];
    return r;
}

// Escribe el polinomio en potencias descendentes: 3x^2 - 2x + 1
function polyToString(c, v = 'x') {
    let terms = [];
    for(let i = c.length - 1; i >= 0; i--) {
        let a = parseFloat(c[i].toFixed(10));
        if(a === 0) continue;
        let abs = Math.abs(a);
        let coefTxt = (abs === 1 && i > 0) ? '' : linFmt(abs, 6);
        let varTxt = i === 0 ? '' : (i === 1 ? v : `${v}<sup>${i}</sup>`);
        terms.push({ sign: a < 0 ? '−' : '+', txt: coefTxt + varTxt });
    }
    if(terms.length === 0) return '0';
    let out = (terms[0].sign === '−' ? '−' : '') + terms[0].txt;
    for(let k = 1; k < terms.length; k++) out += ` ${terms[k].sign} ${terms[k].txt}`;
    return out;
}

// Factor (x − xj) formateado según el signo de xj
function newtonFactor(xj) {
    if(xj === 0) return '(x)';
    return xj > 0 ? `(x − ${linFmt(xj)})` : `(x + ${linFmt(Math.abs(xj))})`;
}

// P(x) = a0 + a1(x−x0) + a2(x−x0)(x−x1) + ... con o sin valores numéricos
function newtonPolyString(coefs, pts, numerico) {
    let out = '';
    for(let i = 0; i < coefs.length; i++) {
        let a = coefs[i];
        if(numerico && parseFloat(a.toFixed(10)) === 0 && i > 0) continue;
        let factores = '';
        for(let k = 0; k < i; k++) factores += newtonFactor(pts[k].x);
        let aTxt = numerico ? linFmt(Math.abs(a), 6) : `a<sub>${i}</sub>`;
        let signo = (numerico && a < 0) ? '−' : '+';
        if(out === '') out = (numerico && a < 0 ? '−' : '') + aTxt + factores;
        else out += ` ${numerico ? signo : '+'} ${aTxt}${factores}`;
    }
    return out === '' ? '0' : out;
}

// Gráfica de un polinomio con sus puntos de soporte
function plotPolynomial(coefs, pts, xEval, yEval, titulo) {
    let wrap = document.getElementById('mainChartWrap');
    wrap.classList.remove('hidden');
    let ctx = document.getElementById('mainChart').getContext('2d');
    if(mainChart) mainChart.destroy();

    const xsAll = pts.map(p => p.x).concat(xEval === null ? [] : [xEval]);
    const minX = Math.min(...xsAll), maxX = Math.max(...xsAll);
    const pad = (maxX - minX) * 0.2 || 1;
    const a = minX - pad, b = maxX + pad;
    const curva = [];
    const paso = (b - a) / 200;
    for(let x = a; x <= b + paso / 2; x += paso) curva.push({ x: x, y: polyEval(coefs, x) });

    let datasets = [
        {
            label: titulo || 'Polinomio P(x)',
            type: 'line',
            data: curva,
            borderColor: '#00d2ff',
            borderWidth: 2,
            pointRadius: 0,
            fill: false
        },
        {
            label: 'Puntos dados',
            data: pts.map(p => ({ x: p.x, y: p.y })),
            backgroundColor: '#8a2be2',
            pointRadius: 7
        }
    ];

    if(xEval !== null && !isNaN(xEval)) {
        datasets.push({
            label: `P(${linFmt(xEval)}) = ${linFmt(yEval, 6)}`,
            data: [{ x: xEval, y: yEval }],
            backgroundColor: '#2ed573',
            pointRadius: 9,
            pointStyle: 'rectRot'
        });
    }

    mainChart = new Chart(ctx, {
        type: 'scatter',
        data: { datasets: datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { type: 'linear', position: 'bottom', title: { display: true, text: 'x' } },
                y: { title: { display: true, text: 'f(x)' } }
            },
            plugins: {
                tooltip: {
                    callbacks: { label: c => `(${linFmt(c.parsed.x)}, ${linFmt(c.parsed.y)})` }
                }
            }
        }
    });
}

/* ================= INTERPOLACIÓN LINEAL ================= */
let linMode = 'y'; // 'y' = se conoce X y se calcula Y | 'x' = se conoce Y y se calcula X

function linFmt(v, d = 6) {
    if(v === null || v === undefined || isNaN(v)) return '—';
    if(!isFinite(v)) return '∞';
    let r = parseFloat(v.toFixed(d));
    if(Object.is(r, -0)) r = 0;
    return String(r);
}

function linEl(id) { return document.getElementById('inp_' + id); }

function linNum(id) {
    let el = linEl(id);
    if(!el || el.value.trim() === '') return null;
    let v = parseFloat(el.value);
    return isNaN(v) ? null : v;
}

function linVarNames() {
    let ex = linEl('lin_varx');
    let ey = linEl('lin_vary');
    let vx = (ex ? ex.value : '').trim() || 'X';
    let vy = (ey ? ey.value : '').trim() || 'Y';
    return { vx, vy };
}

function syncLinHeaders() {
    const { vx, vy } = linVarNames();
    let hx = document.getElementById('linHeadX');
    let hy = document.getElementById('linHeadY');
    if(hx) hx.innerText = vx;
    if(hy) hy.innerText = vy;
    let hint = document.getElementById('linHint');
    if(hint) hint.innerHTML = linMode === 'y'
        ? 'Escribe <b>' + vx + '</b> en el Punto 3 y <b>' + vy + '</b> se calcula automáticamente (o escribe ' + vy + ' para obtener ' + vx + ').'
        : 'Escribe <b>' + vy + '</b> en el Punto 3 y <b>' + vx + '</b> se calcula automáticamente (o escribe ' + vx + ' para obtener ' + vy + ').';
}

function resetLinTable() {
    ['lin_x3', 'lin_y3'].forEach(k => {
        let el = linEl(k);
        if(el) { el.value = ''; el.classList.remove('auto-filled'); }
    });
    linMode = 'y';
}

function createLinTableInput(container) {
    let wrap = document.createElement('div');
    wrap.id = 'inp_lin_table';
    wrap.dataset.type = 'linTable';
    wrap.innerHTML = `
        <table class="lin-table">
            <tr>
                <th class="corner"></th>
                <th id="linHeadX">X</th>
                <th id="linHeadY">Y</th>
            </tr>
            <tr>
                <td class="row-label">Nombre<br>variable</td>
                <td><input type="text" id="inp_lin_varx" class="var-name" value="X"></td>
                <td><input type="text" id="inp_lin_vary" class="var-name" value="Y"></td>
            </tr>
            <tr><td class="section" colspan="3">Puntos conocidos:</td></tr>
            <tr>
                <td class="row-label">Punto 1</td>
                <td><input type="number" step="any" id="inp_lin_x1" placeholder="x1"></td>
                <td><input type="number" step="any" id="inp_lin_y1" placeholder="y1"></td>
            </tr>
            <tr>
                <td class="row-label">Punto 2</td>
                <td><input type="number" step="any" id="inp_lin_x2" placeholder="x2"></td>
                <td><input type="number" step="any" id="inp_lin_y2" placeholder="y2"></td>
            </tr>
            <tr><td class="section" colspan="3">Punto a calcular:</td></tr>
            <tr>
                <td class="row-label">Punto 3</td>
                <td><input type="number" step="any" id="inp_lin_x3" placeholder="x3"></td>
                <td><input type="number" step="any" id="inp_lin_y3" placeholder="y3"></td>
            </tr>
        </table>
        <div class="lin-hint" id="linHint"></div>
    `;
    container.appendChild(wrap);

    ['lin_varx', 'lin_vary'].forEach(k => {
        linEl(k).addEventListener('input', () => { syncLinHeaders(); runLinInterp(false); });
    });
    ['lin_x1', 'lin_y1', 'lin_x2', 'lin_y2'].forEach(k => {
        linEl(k).addEventListener('input', () => runLinInterp(false));
    });
    linEl('lin_x3').addEventListener('input', () => {
        linMode = 'y';
        syncLinHeaders();
        runLinInterp(false);
    });
    linEl('lin_y3').addEventListener('input', () => {
        linMode = 'x';
        syncLinHeaders();
        runLinInterp(false);
    });

    linMode = 'y';
    syncLinHeaders();
}

function computeLinInterp() {
    const { vx, vy } = linVarNames();
    const x1 = linNum('lin_x1'), y1 = linNum('lin_y1');
    const x2 = linNum('lin_x2'), y2 = linNum('lin_y2');

    if([x1, y1, x2, y2].some(v => v === null))
        return { ok: false, pending: true, msg: `Completa los dos puntos conocidos: (${vx}<sub>1</sub>, ${vy}<sub>1</sub>) y (${vx}<sub>2</sub>, ${vy}<sub>2</sub>).`, vx, vy };

    if(x1 === x2 && y1 === y2)
        return { ok: false, msg: 'El Punto 1 y el Punto 2 son idénticos: no definen una recta.', vx, vy };

    const known = linMode === 'y' ? linNum('lin_x3') : linNum('lin_y3');
    if(known === null)
        return { ok: false, pending: true, msg: linMode === 'y'
            ? `Introduce el valor conocido ${vx}<sub>3</sub> del Punto 3.`
            : `Introduce el valor conocido ${vy}<sub>3</sub> del Punto 3.`, vx, vy };

    if(linMode === 'y' && x1 === x2)
        return { ok: false, msg: `${vx}<sub>1</sub> y ${vx}<sub>2</sub> son iguales: la recta es vertical y ${vy} no queda determinada.`, vx, vy };
    if(linMode === 'x' && y1 === y2)
        return { ok: false, msg: `${vy}<sub>1</sub> y ${vy}<sub>2</sub> son iguales: la recta es horizontal y ${vx} no puede despejarse.`, vx, vy };

    const dx = x2 - x1, dy = y2 - y1;
    const m = dy / dx;
    const b = y1 - m * x1;

    let x3, y3;
    if(linMode === 'y') {
        x3 = known;
        y3 = y1 + (x3 - x1) * (dy / dx);
    } else {
        y3 = known;
        x3 = x1 + (y3 - y1) * (dx / dy);
    }

    if(!isFinite(x3) || !isFinite(y3))
        return { ok: false, msg: 'El resultado no es un número finito. Revisa los datos ingresados.', vx, vy };

    const lo = Math.min(x1, x2), hi = Math.max(x1, x2);
    const dentro = x3 >= lo && x3 <= hi;

    return { ok: true, vx, vy, x1, y1, x2, y2, x3, y3, dx, dy, m, b, dentro, mode: linMode };
}

function buildLinSteps(r) {
    const { vx, vy, x1, y1, x2, y2, x3, y3, dx, dy, m, b } = r;
    const f = linFmt;
    let steps = [];

    steps.push({
        t: '1. Datos del problema',
        c: `<table style="max-width:440px;margin:0.5rem auto;">
            <tr><th></th><th>${vx}</th><th>${vy}</th></tr>
            <tr><td>Punto 1</td><td>${f(x1)}</td><td>${f(y1)}</td></tr>
            <tr><td>Punto 2</td><td>${f(x2)}</td><td>${f(y2)}</td></tr>
            <tr><td>Punto 3</td>
                <td${r.mode === 'y' ? '' : ' style="color:var(--success);font-weight:700"'}>${f(x3)}</td>
                <td${r.mode === 'x' ? '' : ' style="color:var(--success);font-weight:700"'}>${f(y3)}</td>
            </tr>
        </table>
        Dato conocido del Punto 3: <b>${r.mode === 'y' ? vx + '<sub>3</sub> = ' + f(x3) : vy + '<sub>3</sub> = ' + f(y3)}</b> &nbsp;|&nbsp; Incógnita: <b>${r.mode === 'y' ? vy + '<sub>3</sub>' : vx + '<sub>3</sub>'}</b>`
    });

    steps.push({
        t: '2. Planteamiento (semejanza de triángulos)',
        c: `Los tres puntos pertenecen a la misma recta, por lo que las pendientes de los segmentos P<sub>1</sub>P<sub>3</sub> y P<sub>1</sub>P<sub>2</sub> son iguales:<br><br>
            <span class="math-expr">(${vy} &minus; ${vy}<sub>1</sub>) / (${vx} &minus; ${vx}<sub>1</sub>) = (${vy}<sub>2</sub> &minus; ${vy}<sub>1</sub>) / (${vx}<sub>2</sub> &minus; ${vx}<sub>1</sub>)</span>`
    });

    steps.push({
        t: '3. Incrementos y pendiente',
        c: `&Delta;${vx} = ${vx}<sub>2</sub> &minus; ${vx}<sub>1</sub> = ${f(x2)} &minus; ${f(x1)} = <b>${f(dx)}</b><br>
            &Delta;${vy} = ${vy}<sub>2</sub> &minus; ${vy}<sub>1</sub> = ${f(y2)} &minus; ${f(y1)} = <b>${f(dy)}</b><br>
            m = &Delta;${vy} / &Delta;${vx} = ${f(dy)} / ${f(dx)} = <b>${f(m, 8)}</b>`
    });

    if(r.mode === 'y') {
        steps.push({
            t: '4. Despeje de la incógnita',
            c: `<span class="math-expr">${vy}<sub>3</sub> = ${vy}<sub>1</sub> + (${vx}<sub>3</sub> &minus; ${vx}<sub>1</sub>) &middot; (${vy}<sub>2</sub> &minus; ${vy}<sub>1</sub>) / (${vx}<sub>2</sub> &minus; ${vx}<sub>1</sub>)</span>`
        });
        steps.push({
            t: '5. Sustitución de valores',
            c: `${vy}<sub>3</sub> = ${f(y1)} + (${f(x3)} &minus; ${f(x1)}) &middot; (${f(y2)} &minus; ${f(y1)}) / (${f(x2)} &minus; ${f(x1)})<br>
                ${vy}<sub>3</sub> = ${f(y1)} + (${f(x3 - x1)}) &middot; (${f(dy)} / ${f(dx)})<br>
                ${vy}<sub>3</sub> = ${f(y1)} + (${f(x3 - x1)}) &middot; (${f(m, 8)})<br>
                ${vy}<sub>3</sub> = ${f(y1)} + ${f((x3 - x1) * m, 8)}<br>
                ${vy}<sub>3</sub> = <b>${f(y3, 8)}</b>`
        });
    } else {
        steps.push({
            t: '4. Despeje de la incógnita',
            c: `<span class="math-expr">${vx}<sub>3</sub> = ${vx}<sub>1</sub> + (${vy}<sub>3</sub> &minus; ${vy}<sub>1</sub>) &middot; (${vx}<sub>2</sub> &minus; ${vx}<sub>1</sub>) / (${vy}<sub>2</sub> &minus; ${vy}<sub>1</sub>)</span>`
        });
        steps.push({
            t: '5. Sustitución de valores',
            c: `${vx}<sub>3</sub> = ${f(x1)} + (${f(y3)} &minus; ${f(y1)}) &middot; (${f(x2)} &minus; ${f(x1)}) / (${f(y2)} &minus; ${f(y1)})<br>
                ${vx}<sub>3</sub> = ${f(x1)} + (${f(y3 - y1)}) &middot; (${f(dx)} / ${f(dy)})<br>
                ${vx}<sub>3</sub> = ${f(x1)} + (${f(y3 - y1)}) &middot; (${f(dx / dy, 8)})<br>
                ${vx}<sub>3</sub> = ${f(x1)} + ${f((y3 - y1) * (dx / dy), 8)}<br>
                ${vx}<sub>3</sub> = <b>${f(x3, 8)}</b>`
        });
    }

    steps.push({
        t: '6. Ecuación de la recta que une P<sub>1</sub> y P<sub>2</sub>',
        c: `<span class="math-expr">${vy} = ${f(m, 8)} &middot; ${vx} ${b >= 0 ? '+' : '&minus;'} ${f(Math.abs(b), 8)}</span><br>
            Forma punto-pendiente: ${vy} &minus; ${f(y1)} = ${f(m, 8)} &middot; (${vx} &minus; ${f(x1)})`
    });

    return steps;
}

function plotLinearInterp(r) {
    let wrap = document.getElementById('mainChartWrap');
    wrap.classList.remove('hidden');
    let ctx = document.getElementById('mainChart').getContext('2d');
    if(mainChart) mainChart.destroy();

    const xs = [r.x1, r.x2, r.x3], ys = [r.y1, r.y2, r.y3];
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const padX = (maxX - minX) * 0.25 || Math.abs(maxX * 0.25) || 1;
    const padY = (maxY - minY) * 0.25 || Math.abs(maxY * 0.25) || 1;
    const a = minX - padX, bb = maxX + padX;
    const yAt = x => r.y1 + r.m * (x - r.x1);

    mainChart = new Chart(ctx, {
        type: 'scatter',
        data: {
            datasets: [
                {
                    label: 'Recta de interpolación',
                    type: 'line',
                    data: [{ x: a, y: yAt(a) }, { x: bb, y: yAt(bb) }],
                    borderColor: '#00d2ff',
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: false
                },
                {
                    label: 'Proyección del Punto 3',
                    type: 'line',
                    data: [
                        { x: r.x3, y: minY - padY },
                        { x: r.x3, y: r.y3 },
                        { x: a, y: r.y3 }
                    ],
                    borderColor: '#ff4757',
                    borderWidth: 1.5,
                    borderDash: [6, 4],
                    pointRadius: 0,
                    fill: false
                },
                {
                    label: 'Puntos conocidos (P1, P2)',
                    data: [{ x: r.x1, y: r.y1 }, { x: r.x2, y: r.y2 }],
                    backgroundColor: '#8a2be2',
                    pointRadius: 7
                },
                {
                    label: 'Punto calculado (P3)',
                    data: [{ x: r.x3, y: r.y3 }],
                    backgroundColor: '#2ed573',
                    pointRadius: 9,
                    pointStyle: 'rectRot'
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { type: 'linear', position: 'bottom', title: { display: true, text: r.vx } },
                y: { title: { display: true, text: r.vy } }
            },
            plugins: {
                tooltip: {
                    callbacks: {
                        label: c => '(' + r.vx + ': ' + linFmt(c.parsed.x) + ', ' + r.vy + ': ' + linFmt(c.parsed.y) + ')'
                    }
                }
            }
        }
    });
}

function runLinInterp(save) {
    let panel = document.getElementById('resultsPanel');
    let res = document.getElementById('resultsContent');
    if(!panel || !res) return;

    const r = computeLinInterp();

    // Rellenar automáticamente la celda calculada del Punto 3
    const outId = linMode === 'y' ? 'lin_y3' : 'lin_x3';
    const otherId = linMode === 'y' ? 'lin_x3' : 'lin_y3';
    let outEl = linEl(outId), otherEl = linEl(otherId);
    if(outEl) {
        if(r.ok) {
            outEl.value = linFmt(linMode === 'y' ? r.y3 : r.x3, 8);
            outEl.classList.add('auto-filled');
        } else {
            outEl.value = '';
            outEl.classList.remove('auto-filled');
        }
    }
    if(otherEl) otherEl.classList.remove('auto-filled');

    if(!r.ok) {
        panel.classList.remove('hidden');
        document.getElementById('mainChartWrap').classList.add('hidden');
        res.innerHTML = `<div class="badge ${r.pending ? 'info' : 'danger'}">${r.msg}</div>`;
        return;
    }

    const f = linFmt;
    const isDetailed = document.getElementById('detailedToggle').checked;
    let html = '';
    buildLinSteps(r).forEach(s => {
        html += `<div class="step-card"><strong>${s.t}</strong><br>${s.c}</div>`;
    });

    const yVerif = r.y1 + r.m * (r.x3 - r.x1);
    const errAbs = Math.abs(yVerif - r.y3);
    const colin = (r.x2 - r.x1) * (r.y3 - r.y1) - (r.y2 - r.y1) * (r.x3 - r.x1);
    const escala = Math.max(1, Math.abs(r.dx * r.dy));

    let verif = `<div class="step-card verification"><h4>Verificación del resultado</h4>
        Sustituyendo ${r.vx} = ${f(r.x3)} en la ecuación de la recta:<br>
        ${r.vy} = ${f(r.m, 8)} &middot; ${f(r.x3)} ${r.b >= 0 ? '+' : '&minus;'} ${f(Math.abs(r.b), 8)} = <b>${f(yVerif, 8)}</b><br>
        Diferencia con el valor obtenido: ${f(errAbs, 10)}<br>
        Prueba de colinealidad de P<sub>1</sub>, P<sub>2</sub> y P<sub>3</sub>: (${r.vx}<sub>2</sub>&minus;${r.vx}<sub>1</sub>)(${r.vy}<sub>3</sub>&minus;${r.vy}<sub>1</sub>) &minus; (${r.vy}<sub>2</sub>&minus;${r.vy}<sub>1</sub>)(${r.vx}<sub>3</sub>&minus;${r.vx}<sub>1</sub>) = ${f(colin, 8)}<br>
        ${Math.abs(colin) < 1e-8 * escala ? '<span class="badge success">Los tres puntos son colineales: el resultado es correcto.</span>' : '<span class="badge danger">Los puntos no resultan colineales, revisa los datos.</span>'}
        </div>`;

    let aviso = r.dentro
        ? `<span class="badge success">Interpolación: ${r.vx}<sub>3</sub> = ${f(r.x3)} está dentro del intervalo [${f(Math.min(r.x1, r.x2))}, ${f(Math.max(r.x1, r.x2))}].</span>`
        : `<span class="badge danger">Extrapolación: ${r.vx}<sub>3</sub> = ${f(r.x3)} está fuera del intervalo [${f(Math.min(r.x1, r.x2))}, ${f(Math.max(r.x1, r.x2))}]; el resultado es menos confiable.</span>`;

    let resumen = `<div class="result-box" style="font-size:1.1rem;">
            Punto 3 = ( ${r.vx} = ${f(r.x3, 8)} , ${r.vy} = ${f(r.y3, 8)} )
        </div>
        <div style="margin:0.5rem 0;">${aviso}</div>
        <table style="max-width:480px;">
            <tr><th>Concepto</th><th>Valor</th></tr>
            <tr><td>${r.mode === 'y' ? r.vy + '<sub>3</sub> (calculado)' : r.vx + '<sub>3</sub> (calculado)'}</td><td>${f(r.mode === 'y' ? r.y3 : r.x3, 8)}</td></tr>
            <tr><td>Pendiente (m)</td><td>${f(r.m, 8)}</td></tr>
            <tr><td>Ordenada al origen (b)</td><td>${f(r.b, 8)}</td></tr>
            <tr><td>Ecuación de la recta</td><td>${r.vy} = ${f(r.m, 6)}&middot;${r.vx} ${r.b >= 0 ? '+' : '&minus;'} ${f(Math.abs(r.b), 6)}</td></tr>
            <tr><td>&Delta;${r.vx} / &Delta;${r.vy}</td><td>${f(r.dx)} / ${f(r.dy)}</td></tr>
        </table>`;

    panel.classList.remove('hidden');
    res.innerHTML = (isDetailed ? html : '') + resumen + verif;
    plotLinearInterp(r);

    if(save) {
        saveHistory({
            lin_varx: r.vx, lin_vary: r.vy,
            lin_x1: r.x1, lin_y1: r.y1,
            lin_x2: r.x2, lin_y2: r.y2,
            lin_x3: f(r.x3, 8), lin_y3: f(r.y3, 8)
        });
    }
}

/* INIT */
updateUI();
loadHistorySelect();

</script>
