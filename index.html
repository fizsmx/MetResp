<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetResp - Métodos Numéricos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #120e1f;
            --text-color: #ffffff;
            --primary: #8a2be2;
            --primary-hover: #9b4dff;
            --secondary: #00d2ff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --danger: #ff4757;
            --success: #2ed573;
            --input-bg: rgba(0, 0, 0, 0.3);
            --font-main: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --text-color: #1a1a1a;
            --primary: #6c5ce7;
            --primary-hover: #5f27cd;
            --secondary: #0984e3;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.1);
            --input-bg: rgba(255, 255, 255, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-color);
            background-image: linear-gradient(135deg, var(--bg-color) 0%, #2a0845 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        [data-theme="light"] body {
            background-image: linear-gradient(135deg, var(--bg-color) 0%, #dcdde1 100%);
        }

        header {
            padding: 1rem 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls button, .header-controls select {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-main);
            margin-left: 0.5rem;
        }

        .header-controls button:hover {
            background: var(--primary);
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        /* Navigation */
        .cat-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .cat-tab {
            padding: 0.8rem 1.5rem;
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .cat-tab:hover, .cat-tab.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .method-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .method-tab {
            padding: 0.5rem 1rem;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .method-tab:hover, .method-tab.active {
            background: var(--secondary);
            border-color: var(--secondary);
            color: #000;
        }

        /* Smart Input */
        .smart-input-container {
            margin-bottom: 2rem;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 1rem;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 1rem;
            resize: vertical;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        input {
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 0.8rem;
            border-radius: 8px;
            font-family: var(--font-mono);
        }

        .btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            width: 100%;
            transition: opacity 0.3s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Results Area */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .switch-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .step-card {
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            font-family: var(--font-mono);
        }

        .math-expr {
            color: var(--secondary);
        }

        .result-box {
            border: 1px solid var(--success);
            padding: 0.5rem;
            display: inline-block;
            margin: 0.5rem 0;
            border-radius: 4px;
        }

        .badge {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge.success { background: var(--success); color: black; }
        .badge.danger { background: var(--danger); color: white; }
        .badge.info { background: var(--secondary); color: black; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        th, td {
            border: 1px solid var(--glass-border);
            padding: 0.8rem;
            text-align: center;
        }

        th {
            background: var(--primary);
            color: white;
        }

        .chart-container {
            width: 100%;
            height: 400px;
            margin-top: 2rem;
            background: var(--input-bg);
            border-radius: 8px;
            padding: 1rem;
        }

        .hidden { display: none !important; }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
        }

        /* Calculadora Styles */
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
        }
        .calc-display {
            grid-column: 1 / -1;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 1rem;
            text-align: right;
            font-family: var(--font-mono);
            font-size: 1.5rem;
            min-height: 80px;
            word-break: break-all;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .calc-display .history {
            font-size: 0.9rem;
            color: #aaa;
        }
        .calc-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .calc-btn:hover { background: var(--primary); }
        .calc-btn.op { background: var(--primary-hover); }
        .calc-btn.eq { grid-column: 1 / -1; background: var(--secondary); color: black; }

        /* Print CSS */
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            .glass-panel {
                border: none !important;
                box-shadow: none !important;
            }
            header, .cat-tabs, .method-tabs, .smart-input-container, .form-grid, .btn, .controls-row {
                display: none !important;
            }
            .step-card, table, .chart-container {
                page-break-inside: avoid;
            }
        }
        
        .dynamic-table {
            display: grid;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .dyn-row {
            display: flex;
            gap: 0.5rem;
        }
        .dyn-row input { flex: 1; }
        .btn-small { padding: 0.5rem; border:none; border-radius:4px; cursor:pointer; background:var(--primary); color:white;}
    </style>
</head>
<body>

<header>
    <div class="logo">MetResp</div>
    <div class="header-controls">
        <select id="historySelect">
            <option value="">Cargar historial...</option>
        </select>
        <button id="themeToggle">Tema Claro</button>
        <button onclick="window.print()">Exportar PDF</button>
    </div>
</header>

<main>
    <!-- Navegación de Categorías -->
    <div class="cat-tabs" id="catTabs">
        <button class="cat-tab active" data-cat="raices">Raíces</button>
        <button class="cat-tab" data-cat="sistemas">Sistemas Lineales</button>
        <button class="cat-tab" data-cat="interpolacion">Interpolación</button>
        <button class="cat-tab" data-cat="integracion">Integración</button>
        <button class="cat-tab" data-cat="edo">Ec. Diferenciales</button>
        <button class="cat-tab" data-cat="ajuste">Ajuste de Curvas</button>
        <button class="cat-tab" data-cat="calc">Calculadora</button>
    </div>

    <!-- Navegación de Métodos -->
    <div class="method-tabs" id="methodTabs">
        <!-- Renderizado dinámico -->
    </div>

    <div id="methodContainer">
        <div class="glass-panel" id="inputPanel">
            <h2 id="methodTitle" style="margin-bottom: 1rem;"></h2>
            
            <div class="smart-input-container" id="smartInputWrap">
                <label>Entrada Inteligente (Intenta detectar método y parámetros automáticamente):</label>
                <textarea id="smartInput" placeholder="Ej: Resolver f(x)=exp(x)-2 con Newton, x0=0, error 0.01"></textarea>
            </div>

            <div id="dynamicForm" class="form-grid">
                <!-- Inputs dinámicos aquí -->
            </div>

            <button class="btn" id="solveBtn">Calcular Solución</button>
        </div>

        <div class="glass-panel hidden" id="resultsPanel">
            <div class="controls-row">
                <h3>Resultados y Procedimiento</h3>
                <div class="switch-container">
                    <label>Vista Detallada:</label>
                    <input type="checkbox" id="detailedToggle" checked>
                </div>
            </div>
            
            <div id="resultsContent"></div>
            
            <div class="chart-container hidden" id="mainChartWrap">
                <canvas id="mainChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Calculadora (Oculta por defecto) -->
    <div class="glass-panel hidden" id="calcPanel">
        <h2>Calculadora Científica</h2>
        <div class="calc-grid" id="calcGrid">
            <div class="calc-display" id="calcDisplay">
                <div class="history" id="calcHist"></div>
                <div id="calcVal">0</div>
            </div>
            <!-- Fila Memoria y Modo -->
            <button class="calc-btn op" onclick="calcAction('MC')">MC</button>
            <button class="calc-btn op" onclick="calcAction('MR')">MR</button>
            <button class="calc-btn op" onclick="calcAction('M+')">M+</button>
            <button class="calc-btn op" onclick="calcAction('M-')">M-</button>
            
            <button class="calc-btn op" onclick="calcAction('MODE')" id="calcModeBtn">DEG</button>
            <button class="calc-btn op" onclick="calcAction('C')">C</button>
            <button class="calc-btn op" onclick="calcAction('DEL')">DEL</button>
            <button class="calc-btn op" onclick="calcAction('/')">/</button>
            
            <button class="calc-btn" onclick="calcAction('sin')">sin</button>
            <button class="calc-btn" onclick="calcAction('cos')">cos</button>
            <button class="calc-btn" onclick="calcAction('tan')">tan</button>
            <button class="calc-btn op" onclick="calcAction('*')">*</button>

            <button class="calc-btn" onclick="calcAction('asin')">asin</button>
            <button class="calc-btn" onclick="calcAction('acos')">acos</button>
            <button class="calc-btn" onclick="calcAction('atan')">atan</button>
            <button class="calc-btn op" onclick="calcAction('-')">-</button>
            
            <button class="calc-btn" onclick="calcAction('ln')">ln</button>
            <button class="calc-btn" onclick="calcAction('7')">7</button>
            <button class="calc-btn" onclick="calcAction('8')">8</button>
            <button class="calc-btn" onclick="calcAction('9')">9</button>
            
            <button class="calc-btn" onclick="calcAction('log')">log</button>
            <button class="calc-btn" onclick="calcAction('4')">4</button>
            <button class="calc-btn" onclick="calcAction('5')">5</button>
            <button class="calc-btn" onclick="calcAction('6')">6</button>
            <button class="calc-btn op" style="grid-row: span 2;" onclick="calcAction('+')">+</button>

            <button class="calc-btn" onclick="calcAction('sqrt')">√</button>
            <button class="calc-btn" onclick="calcAction('1')">1</button>
            <button class="calc-btn" onclick="calcAction('2')">2</button>
            <button class="calc-btn" onclick="calcAction('3')">3</button>

            <button class="calc-btn" onclick="calcAction('^')">^</button>
            <button class="calc-btn" onclick="calcAction('0')">0</button>
            <button class="calc-btn" onclick="calcAction('.')">.</button>
            <button class="calc-btn" onclick="calcAction('(-)')">±</button>
            
            <button class="calc-btn eq" onclick="calcAction('=')">=</button>
        </div>
    </div>
</main>

<footer>
    Desarrollado por Fisbert — MetResp © 2026
</footer>

<script>
/* ================= ESTRUCTURA Y DATOS ================= */
const methods = {
    raices: [
        { id: 'nr', name: 'Newton-Raphson', inputs: ['fx', 'fdx', 'x0', 'tol', 'iter'] },
        { id: 'bis', name: 'Bisección', inputs: ['fx', 'a', 'b', 'tol', 'iter'] },
        { id: 'pf', name: 'Punto Fijo', inputs: ['fx', 'gx', 'x0', 'tol', 'iter'] },
        { id: 'sec', name: 'Secante', inputs: ['fx', 'x0', 'x1', 'tol', 'iter'] },
        { id: 'rf', name: 'Regla Falsa', inputs: ['fx', 'a', 'b', 'tol', 'iter'] }
    ],
    sistemas: [
        { id: 'gj', name: 'Gauss-Jordan', inputs: ['sys_n', 'sys_matrix'] },
        { id: 'jac', name: 'Jacobi', inputs: ['sys_n', 'sys_matrix', 'tol', 'iter'] },
        { id: 'gs', name: 'Gauss-Seidel', inputs: ['sys_n', 'sys_matrix', 'tol', 'iter'] }
    ],
    interpolacion: [
        { id: 'lag', name: 'Lagrange', inputs: ['points', 'x_eval'] },
        { id: 'new', name: 'Newton (Dif. Divididas)', inputs: ['points', 'x_eval'] }
    ],
    integracion: [
        { id: 'trap', name: 'Regla del Trapecio', inputs: ['fx', 'a', 'b', 'n_int'] },
        { id: 's13', name: 'Simpson 1/3', inputs: ['fx', 'a', 'b', 'n_even'] },
        { id: 's38', name: 'Simpson 3/8', inputs: ['fx', 'a', 'b', 'n_mult3'] }
    ],
    edo: [
        { id: 'eu', name: 'Euler', inputs: ['fxy', 'x0', 'y0', 'h', 'xf'] },
        { id: 'rk4', name: 'Runge-Kutta (4to Orden)', inputs: ['fxy', 'x0', 'y0', 'h', 'xf'] }
    ],
    ajuste: [
        { id: 'minc', name: 'Mínimos Cuadrados', inputs: ['points', 'degree'] }
    ],
    calc: []
};

const inputDefinitions = {
    fx: { label: 'f(x) =', placeholder: 'Ej: exp(x) - 2 + x^2' },
    fdx: { label: 'f\'(x) = (Opcional)', placeholder: 'Derivada automática si vacío' },
    gx: { label: 'g(x) =', placeholder: 'Ej: 2*sin(x)' },
    fxy: { label: 'f(x,y) =', placeholder: 'Ej: x + y' },
    x0: { label: 'x₀ (Valor Inicial)', type: 'number', placeholder: '0' },
    x1: { label: 'x₁', type: 'number', placeholder: '1' },
    y0: { label: 'y₀', type: 'number', placeholder: '1' },
    a: { label: 'a (Límite inferior)', type: 'number', placeholder: '0' },
    b: { label: 'b (Límite superior)', type: 'number', placeholder: '1' },
    h: { label: 'h (Tamaño de paso)', type: 'number', placeholder: '0.1' },
    xf: { label: 'x final', type: 'number', placeholder: '0.5' },
    tol: { label: 'Tolerancia (%)', type: 'number', placeholder: '0.01' },
    iter: { label: 'Máx Iteraciones', type: 'number', placeholder: '50' },
    n_int: { label: 'n (Intervalos)', type: 'number', placeholder: '4' },
    n_even: { label: 'n (Par)', type: 'number', placeholder: '4' },
    n_mult3: { label: 'n (Múltiplo de 3)', type: 'number', placeholder: '6' },
    x_eval: { label: 'Evaluar en x =', type: 'number', placeholder: '2.5' },
    degree: { label: 'Grado del Polinomio', type: 'number', placeholder: '1' },
    sys_n: { label: 'Tamaño (n)', type: 'number', placeholder: '3' },
    sys_matrix: { label: 'Matriz (A|B) o Ecuaciones', isTextarea: true, placeholder: '2, 1, -1, 8\n-3, -1, 2, -11\n-2, 1, 2, -3' },
    points: { label: 'Puntos (x,y)', isPoints: true }
};

let currentCategory = 'raices';
let currentMethod = 'nr';
let mainChart = null;

/* ================= UTILIDADES ================= */
function normExpr(expr) {
    if(!expr) return '';
    return expr
        .replace(/sen/gi, 'sin')
        .replace(/ln/gi, 'log')
        .replace(/e\^x/gi, 'exp(x)')
        .replace(/(\d)(x)/gi, '$1*$2')
        .replace(/x\^2/gi, 'x^2');
}

function evaluateExpr(expr, scope = {}) {
    try {
        let compiled = math.compile(normExpr(expr));
        return compiled.evaluate(scope);
    } catch(e) {
        return NaN;
    }
}

function getDerivative(expr, variable = 'x') {
    try {
        return math.derivative(normExpr(expr), variable).toString();
    } catch(e) {
        return null;
    }
}

function getVal(id) {
    let el = document.getElementById(`inp_${id}`);
    if(!el) return 0;
    if(el.tagName === 'TEXTAREA') return el.value;
    if(el.dataset.type === 'points') {
        let rows = el.querySelectorAll('.dyn-row');
        let pts = [];
        rows.forEach(r => {
            let ins = r.querySelectorAll('input');
            pts.push({x: parseFloat(ins[0].value), y: parseFloat(ins[1].value)});
        });
        return pts;
    }
    return parseFloat(el.value);
}

function getStr(id) {
    let el = document.getElementById(`inp_${id}`);
    return el ? el.value : '';
}

function createPointsInput(id, container) {
    let div = document.createElement('div');
    div.id = `inp_${id}`;
    div.dataset.type = 'points';
    div.className = 'dynamic-table';
    
    const addRow = (x='', y='') => {
        let row = document.createElement('div');
        row.className = 'dyn-row';
        row.innerHTML = `
            <input type="number" placeholder="x" value="${x}">
            <input type="number" placeholder="y" value="${y}">
            <button class="btn-small" onclick="this.parentElement.remove()">X</button>
        `;
        div.insertBefore(row, div.lastElementChild);
    };

    let btn = document.createElement('button');
    btn.className = 'btn-small';
    btn.innerText = '+ Agregar Punto';
    btn.onclick = () => addRow();
    div.appendChild(btn);

    addRow(1, 1);
    addRow(2, 4);
    addRow(3, 9);
    
    container.appendChild(div);
}

/* ================= UI RENDER ================= */
function renderTabs() {
    let catTabs = document.getElementById('catTabs');
    catTabs.innerHTML = '';
    Object.keys(methods).forEach(cat => {
        let name = document.querySelector(`.cat-tab[data-cat="${cat}"]`)?.innerText || cat;
        if(cat === 'raices') name = 'Raíces';
        else if(cat === 'sistemas') name = 'Sistemas Lineales';
        else if(cat === 'interpolacion') name = 'Interpolación';
        else if(cat === 'integracion') name = 'Integración';
        else if(cat === 'edo') name = 'Ec. Diferenciales';
        else if(cat === 'ajuste') name = 'Ajuste de Curvas';
        else if(cat === 'calc') name = 'Calculadora';

        let b = document.createElement('button');
        b.className = `cat-tab ${cat === currentCategory ? 'active' : ''}`;
        b.dataset.cat = cat;
        b.innerText = name;
        b.onclick = () => {
            currentCategory = cat;
            if(methods[cat].length > 0) currentMethod = methods[cat][0].id;
            updateUI();
        };
        catTabs.appendChild(b);
    });

    let mTabs = document.getElementById('methodTabs');
    mTabs.innerHTML = '';
    if (currentCategory === 'calc') {
        document.getElementById('methodContainer').classList.add('hidden');
        document.getElementById('calcPanel').classList.remove('hidden');
        return;
    } else {
        document.getElementById('methodContainer').classList.remove('hidden');
        document.getElementById('calcPanel').classList.add('hidden');
    }

    methods[currentCategory].forEach(m => {
        let b = document.createElement('button');
        b.className = `method-tab ${m.id === currentMethod ? 'active' : ''}`;
        b.innerText = m.name;
        b.onclick = () => {
            currentMethod = m.id;
            updateUI();
        };
        mTabs.appendChild(b);
    });
}

function updateUI() {
    renderTabs();
    if(currentCategory === 'calc') return;

    let m = methods[currentCategory].find(x => x.id === currentMethod);
    document.getElementById('methodTitle').innerText = `Método: ${m.name}`;
    
    let form = document.getElementById('dynamicForm');
    form.innerHTML = '';

    m.inputs.forEach(inp => {
        let def = inputDefinitions[inp];
        let grp = document.createElement('div');
        grp.className = 'form-group';
        grp.innerHTML = `<label>${def.label}</label>`;
        
        if (def.isPoints) {
            createPointsInput(inp, grp);
        } else if (def.isTextarea) {
            grp.innerHTML += `<textarea id="inp_${inp}" placeholder="${def.placeholder}"></textarea>`;
        } else {
            grp.innerHTML += `<input type="${def.type || 'text'}" id="inp_${inp}" placeholder="${def.placeholder}">`;
        }
        form.appendChild(grp);
    });

    document.getElementById('resultsPanel').classList.add('hidden');
}

/* ================= HISTORIAL ================= */
function saveHistory(data) {
    let hist = JSON.parse(localStorage.getItem('metresp_history') || '[]');
    hist.unshift({
        time: new Date().toLocaleString(),
        cat: currentCategory,
        method: currentMethod,
        data: data
    });
    if(hist.length > 10) hist.pop();
    localStorage.setItem('metresp_history', JSON.stringify(hist));
    loadHistorySelect();
}

function loadHistorySelect() {
    let sel = document.getElementById('historySelect');
    sel.innerHTML = '<option value="">Cargar historial...</option>';
    let hist = JSON.parse(localStorage.getItem('metresp_history') || '[]');
    hist.forEach((h, i) => {
        let opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `${h.time} - ${h.method}`;
        sel.appendChild(opt);
    });
}

document.getElementById('historySelect').addEventListener('change', (e) => {
    let idx = e.target.value;
    if(idx === '') return;
    let hist = JSON.parse(localStorage.getItem('metresp_history') || '[]');
    let item = hist[idx];
    if(!item) return;
    currentCategory = item.cat;
    currentMethod = item.method;
    updateUI();
    
    // Fill inputs
    Object.keys(item.data).forEach(k => {
        let el = document.getElementById(`inp_${k}`);
        if(el) {
            if(el.dataset.type === 'points') {
                // handle points
            } else {
                el.value = item.data[k];
            }
        }
    });
});

document.getElementById('themeToggle').addEventListener('click', () => {
    let body = document.body;
    let current = body.parentElement.getAttribute('data-theme');
    if(current === 'light') {
        body.parentElement.removeAttribute('data-theme');
        document.getElementById('themeToggle').innerText = 'Tema Claro';

/* ================= GRÁFICOS ================= */
function plotGraph(type, datasets, labels) {
    let wrap = document.getElementById('mainChartWrap');
    wrap.classList.remove('hidden');
    let ctx = document.getElementById('mainChart').getContext('2d');
    
    if(mainChart) mainChart.destroy();

    mainChart = new Chart(ctx, {
        type: type,
        data: {
            labels: labels,
            datasets: datasets
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { type: type==='scatter'?'linear':'category', position: 'bottom' }
            }
        }
    });
}

function plotFunction(expr, rootX) {
    let xVals = [];
    let yVals = [];
    let range = 5;
    for(let x = rootX - range; x <= rootX + range; x += 0.1) {
        xVals.push(x);
        yVals.push(evaluateExpr(expr, {x: x}));
    }

    plotGraph('line', [
        {
            label: 'f(x)',
            data: yVals,
            borderColor: '#00d2ff',
            tension: 0.1
        },
        {
            label: 'Raíz',
            data: xVals.map(x => Math.abs(x - rootX) < 0.05 ? 0 : null),
            borderColor: '#ff4757',
            pointRadius: 5,
            showLine: false
        }
    ], xVals.map(x => x.toFixed(1)));
}

/* ================= ENGINE MATEMÁTICO ================= */

document.getElementById('solveBtn').addEventListener('click', () => {
    let res = document.getElementById('resultsContent');
    res.innerHTML = '';
    document.getElementById('resultsPanel').classList.remove('hidden');
    document.getElementById('mainChartWrap').classList.add('hidden');
    
    let html = '';
    let table = '';
    let isDetailed = document.getElementById('detailedToggle').checked;
    
    const addStep = (title, content) => {
        html += `<div class="step-card"><strong>${title}</strong><br>${content}</div>`;
    };

    let savedData = {};

    try {
        if(currentMethod === 'nr') {
            let fx = getStr('fx');
            let fdx = getStr('fdx');
            if(!fdx) { fdx = getDerivative(fx); addStep('Derivada automática', `f'(x) = ${fdx}`); }
            let x0 = getVal('x0');
            let tol = getVal('tol');
            let maxIter = getVal('iter') || 50;
            savedData = {fx, fdx, x0, tol, iter: maxIter};

            table = `<table><tr><th>Iter</th><th>x_i</th><th>f(x_i)</th><th>f'(x_i)</th><th>Error (%)</th></tr>`;
            let ea = 100, xi = x0, iter = 0;
            
            while(ea > tol && iter < maxIter) {
                let fxi = evaluateExpr(fx, {x: xi});
                let fdxi = evaluateExpr(fdx, {x: xi});
                let x_next = xi - (fxi / fdxi);
                
                if(iter > 0) ea = Math.abs((x_next - xi) / x_next) * 100;

                addStep(`Iteración ${iter}`, `
                    1) Evaluar: f(${xi}) = ${fxi.toFixed(6)}, f'(${xi}) = ${fdxi.toFixed(6)}<br>
                    2) Fórmula: x_i+1 = x_i - f(xi)/f'(xi) = ${xi} - (${fxi}/${fdxi}) = <span class="result-box">${x_next.toFixed(6)}</span><br>
                    3) Error: ${iter>0 ? `${ea.toFixed(4)}%` : '-'}
                `);
                table += `<tr><td>${iter}</td><td>${xi.toFixed(6)}</td><td>${fxi.toFixed(6)}</td><td>${fdxi.toFixed(6)}</td><td>${iter>0?ea.toFixed(4):'-'}</td></tr>`;
                
                xi = x_next;
                iter++;
            }
            table += '</table>';
            plotFunction(fx, xi);

        } else if(currentMethod === 'bis') {
            let fx = getStr('fx');
            let a = getVal('a');
            let b = getVal('b');
            let tol = getVal('tol');
            let maxIter = getVal('iter') || 50;
            savedData = {fx, a, b, tol, iter:maxIter};

            let fa = evaluateExpr(fx, {x: a});
            let fb = evaluateExpr(fx, {x: b});
            if(fa * fb >= 0) {
                res.innerHTML = `<div class="badge danger">Error: f(a) y f(b) deben tener signos opuestos.</div>`;
                return;
            }

            table = `<table><tr><th>Iter</th><th>a</th><th>b</th><th>m</th><th>f(m)</th><th>Error (%)</th></tr>`;
            let ea = 100, iter = 0, m;

            while(ea > tol && iter < maxIter) {
                m = (a + b) / 2;
                let fm = evaluateExpr(fx, {x: m});
                fa = evaluateExpr(fx, {x: a});
                ea = Math.abs((b - a) / 2) * 100;

                addStep(`Iteración ${iter}`, `
                    I) Medio: m = (${a} + ${b})/2 = <span class="result-box">${m.toFixed(6)}</span><br>
                    II) f(m) = ${fm.toFixed(6)}<br>
                    III) Nuevo intervalo: f(a)*f(m) = ${fa.toFixed(2)}*${fm.toFixed(2)} ${fa*fm < 0 ? '< 0 (b=m)' : '> 0 (a=m)'}<br>
                    IV) Error: ${ea.toFixed(4)}%
                `);

                table += `<tr><td>${iter}</td><td>${a.toFixed(6)}</td><td>${b.toFixed(6)}</td><td>${m.toFixed(6)}</td><td>${fm.toFixed(6)}</td><td>${ea.toFixed(4)}</td></tr>`;
                
                if(fa * fm < 0) b = m; else a = m;
                iter++;
            }
            table += '</table>';
            plotFunction(fx, m);
        }
        else if (currentMethod === 'gj') {
            let n = getVal('sys_n');
            let raw = getStr('sys_matrix');
            savedData = {sys_n: n, sys_matrix: raw};
            let rows = raw.trim().split('\n').map(r => r.split(',').map(Number));
            
            addStep('Matriz Inicial', renderMatrix(rows));
            
            for(let i=0; i<n; i++) {
                let pivot = rows[i][i];
                if(pivot === 0) { addStep('Error', 'Pivote 0 detectado, se requiere pivoteo (no implementado en esta versión básica)'); break; }
                
                for(let j=0; j<=n; j++) rows[i][j] /= pivot;
                addStep(`Pivoteo Fila ${i+1}`, `R${i+1} = R${i+1} / ${pivot.toFixed(2)}<br>` + renderMatrix(rows));

                for(let k=0; k<n; k++) {
                    if(k !== i) {
                        let factor = rows[k][i];
                        for(let j=0; j<=n; j++) rows[k][j] -= factor * rows[i][j];
                        addStep(`Eliminación Fila ${k+1}`, `R${k+1} = R${k+1} - (${factor.toFixed(2)})*R${i+1}<br>` + renderMatrix(rows));
                    }
                }
            }
            
            table = '<h4>Solución:</h4><ul>';
            for(let i=0; i<n; i++) table += `<li>x${i+1} = ${rows[i][n].toFixed(4)}</li>`;
            table += '</ul>';
        }
        else if (currentMethod === 'eu') {
            let fxy = getStr('fxy');
            let x0 = getVal('x0');
            let y0 = getVal('y0');
            let h = getVal('h');
            let xf = getVal('xf');
            savedData = {fxy, x0, y0, h, xf};

            table = `<table><tr><th>Iter</th><th>x</th><th>y</th><th>f(x,y)</th></tr>`;
            let x = x0, y = y0, iter = 0;
            let xPlot=[], yPlot=[];

            while(x <= xf + h/2) {
                xPlot.push(x); yPlot.push(y);
                let fval = evaluateExpr(fxy, {x: x, y: y});
                
                addStep(`Paso ${iter}`, `
                    x = ${x.toFixed(4)}, y = ${y.toFixed(6)}<br>
                    f(${x}, ${y}) = ${fval.toFixed(6)}<br>
                    y_sig = ${y.toFixed(6)} + ${h} * ${fval.toFixed(6)} = <span class="result-box">${(y + h*fval).toFixed(6)}</span>
                `);
                
                table += `<tr><td>${iter}</td><td>${x.toFixed(4)}</td><td>${y.toFixed(6)}</td><td>${fval.toFixed(6)}</td></tr>`;
                
                y = y + h * fval;
                x += h;
                iter++;
            }
            table += '</table>';
            plotGraph('line', [{label:'Euler y(x)', data:yPlot, borderColor:'#8a2be2'}], xPlot.map(v=>v.toFixed(2)));
        }
        else if (currentMethod === 'pf') {
            let fx = getStr('fx');
            let gx = getStr('gx');
            let x0 = getVal('x0');
            let tol = getVal('tol');
            let maxIter = getVal('iter') || 50;
            savedData = {fx, gx, x0, tol, iter: maxIter};
            table = `<table><tr><th>Iter</th><th>x_i</th><th>g(x_i)</th><th>Error (%)</th></tr>`;
            let ea = 100, xi = x0, iter = 0;
            while(ea > tol && iter < maxIter) {
                let x_next = evaluateExpr(gx, {x: xi});
                if(iter > 0) ea = Math.abs((x_next - xi) / x_next) * 100;
                addStep(`Iteración ${iter}`, `1) x_i = ${xi.toFixed(6)}<br>2) g(x_i) = <span class="result-box">${x_next.toFixed(6)}</span><br>3) Error: ${iter>0 ? ea.toFixed(4)+'%' : '-'}`);
                table += `<tr><td>${iter}</td><td>${xi.toFixed(6)}</td><td>${x_next.toFixed(6)}</td><td>${iter>0?ea.toFixed(4):'-'}</td></tr>`;
                xi = x_next;
                iter++;
            }
            table += '</table>';
            plotFunction(fx, xi);
        }
        else if (currentMethod === 'sec') {
            let fx = getStr('fx');
            let x0 = getVal('x0');
            let x1 = getVal('x1');
            let tol = getVal('tol');
            let maxIter = getVal('iter') || 50;
            savedData = {fx, x0, x1, tol, iter: maxIter};
            table = `<table><tr><th>Iter</th><th>x_{i-1}</th><th>x_i</th><th>x_{i+1}</th><th>Error (%)</th></tr>`;
            let ea = 100, xi_prev = x0, xi = x1, iter = 0;
            while(ea > tol && iter < maxIter) {
                let fxi = evaluateExpr(fx, {x: xi});
                let fxi_prev = evaluateExpr(fx, {x: xi_prev});
                let x_next = xi - fxi * (xi - xi_prev) / (fxi - fxi_prev);
                ea = Math.abs((x_next - xi) / x_next) * 100;
                addStep(`Iteración ${iter}`, `f(${xi_prev.toFixed(4)}) = ${fxi_prev.toFixed(4)}, f(${xi.toFixed(4)}) = ${fxi.toFixed(4)}<br>Fórmula: x_{i+1} = <span class="result-box">${x_next.toFixed(6)}</span><br>Error: ${ea.toFixed(4)}%`);
                table += `<tr><td>${iter}</td><td>${xi_prev.toFixed(6)}</td><td>${xi.toFixed(6)}</td><td>${x_next.toFixed(6)}</td><td>${ea.toFixed(4)}</td></tr>`;
                xi_prev = xi;
                xi = x_next;
                iter++;
            }
            table += '</table>';
            plotFunction(fx, xi);
        }
        else if (currentMethod === 'rf') {
            let fx = getStr('fx');
            let a = getVal('a');
            let b = getVal('b');
            let tol = getVal('tol');
            let maxIter = getVal('iter') || 50;
            savedData = {fx, a, b, tol, iter: maxIter};
            let fa = evaluateExpr(fx, {x: a});
            let fb = evaluateExpr(fx, {x: b});
            if(fa * fb >= 0) {
                res.innerHTML = `<div class="badge danger">Error: f(a) y f(b) deben tener signos opuestos.</div>`;
                return;
            }
            table = `<table><tr><th>Iter</th><th>a</th><th>b</th><th>c</th><th>f(c)</th><th>Error (%)</th></tr>`;
            let ea = 100, iter = 0, c, c_prev = a;
            while(ea > tol && iter < maxIter) {
                fa = evaluateExpr(fx, {x: a});
                fb = evaluateExpr(fx, {x: b});
                c = a - fa * (b - a) / (fb - fa);
                let fc = evaluateExpr(fx, {x: c});
                if(iter > 0) ea = Math.abs((c - c_prev) / c) * 100;
                addStep(`Iteración ${iter}`, `a=${a.toFixed(4)}, b=${b.toFixed(4)}<br>c = <span class="result-box">${c.toFixed(6)}</span><br>f(c) = ${fc.toFixed(6)}<br>Error: ${iter>0 ? ea.toFixed(4)+'%' : '-'}`);
                table += `<tr><td>${iter}</td><td>${a.toFixed(6)}</td><td>${b.toFixed(6)}</td><td>${c.toFixed(6)}</td><td>${fc.toFixed(6)}</td><td>${iter>0?ea.toFixed(4):'-'}</td></tr>`;
                if(fa * fc < 0) b = c; else a = c;
                c_prev = c;
                iter++;
            }
            table += '</table>';
            plotFunction(fx, c);
        }
        else if (currentMethod === 'jac' || currentMethod === 'gs') {
            let n = getVal('sys_n');
            let raw = getStr('sys_matrix');
            let tol = getVal('tol');
            let maxIter = getVal('iter') || 50;
            savedData = {sys_n: n, sys_matrix: raw, tol, iter: maxIter};
            let rows = raw.trim().split('\n').map(r => r.split(',').map(Number));
            let x = new Array(n).fill(0);
            let x_new = new Array(n).fill(0);
            table = `<table><tr><th>Iter</th>` + x.map((_,i)=>`<th>x${i+1}</th>`).join('') + `<th>Error (%)</th></tr><tr><td>0</td>` + x.map(v=>`<td>${v}</td>`).join('') + `<td>-</td></tr>`;
            let ea = 100, iter = 0;
            while(ea > tol && iter < maxIter) {
                let max_ea = 0;
                let stepStr = "";
                for(let i=0; i<n; i++) {
                    let sum = 0;
                    for(let j=0; j<n; j++) {
                        if(j !== i) sum += rows[i][j] * (currentMethod === 'gs' ? x_new[j] : x[j]);
                    }
                    x_new[i] = (rows[i][n] - sum) / rows[i][i];
                    let curr_ea = Math.abs((x_new[i] - x[i]) / (x_new[i] === 0 ? 1 : x_new[i])) * 100;
                    if(curr_ea > max_ea) max_ea = curr_ea;
                    stepStr += `x${i+1} = (${rows[i][n].toFixed(2)} - suma)/${rows[i][i].toFixed(2)} = ${x_new[i].toFixed(6)}<br>`;
                }
                ea = max_ea;
                addStep(`Iteración ${iter+1}`, stepStr + `Error max: ${ea.toFixed(4)}%`);
                table += `<tr><td>${iter+1}</td>` + x_new.map(v=>`<td>${v.toFixed(6)}</td>`).join('') + `<td>${ea.toFixed(4)}</td></tr>`;
                x = [...x_new];
                iter++;
            }
            table += '</table>';
        }
        else if (currentMethod === 'lag') {
            let pts = getVal('points');
            let x_eval = getVal('x_eval');
            savedData = {points: pts, x_eval};
            let n = pts.length;
            let result = 0;
            let stepStr = "";
            let plotX = [], plotY = [];
            for(let i=0; i<n; i++) {
                let L = 1, num = "", den = "";
                for(let j=0; j<n; j++) {
                    if(j !== i) {
                        L *= (x_eval - pts[j].x) / (pts[i].x - pts[j].x);
                        num += `(${x_eval} - ${pts[j].x})`;
                        den += `(${pts[i].x} - ${pts[j].x})`;
                    }
                }
                result += pts[i].y * L;
                stepStr += `L_${i} = [${num}] / [${den}] = ${L.toFixed(4)}<br>Término = ${pts[i].y} * ${L.toFixed(4)} = ${(pts[i].y * L).toFixed(4)}<br><br>`;
            }
            addStep('Cálculo de Términos', stepStr);
            table = `<div class="result-box">P(${x_eval}) = ${result.toFixed(6)}</div>`;
            for(let px = Math.min(...pts.map(p=>p.x))-1; px <= Math.max(...pts.map(p=>p.x))+1; px+=0.1) {
                let p_res = 0;
                for(let i=0; i<n; i++) {
                    let L = 1;
                    for(let j=0; j<n; j++) { if(j!==i) L *= (px - pts[j].x)/(pts[i].x - pts[j].x); }
                    p_res += pts[i].y * L;
                }
                plotX.push(px); plotY.push(p_res);
            }
            plotGraph('line', [
                {label:'Polinomio Lagrange', data:plotY, borderColor:'#8a2be2', tension:0.4},
                {label:'Puntos', data:pts.map(p=>p.y), type:'scatter', backgroundColor:'#ff4757'}
            ], plotX.map(x=>x.toFixed(2)));
        }
        else if (currentMethod === 'new') {
            let pts = getVal('points');
            let x_eval = getVal('x_eval');
            savedData = {points: pts, x_eval};
            let n = pts.length;
            let divDiff = Array.from({length: n}, () => new Array(n).fill(0));
            for(let i=0; i<n; i++) divDiff[i][0] = pts[i].y;
            for(let j=1; j<n; j++) {
                for(let i=0; i<n-j; i++) {
                    divDiff[i][j] = (divDiff[i+1][j-1] - divDiff[i][j-1]) / (pts[i+j].x - pts[i].x);
                }
            }
            let res_html = `<table><tr><th>x</th><th>f(x)</th>`;
            for(let j=1; j<n; j++) res_html += `<th>Orden ${j}</th>`;
            res_html += `</tr>`;
            for(let i=0; i<n; i++) {
                res_html += `<tr><td>${pts[i].x}</td>`;
                for(let j=0; j<n-i; j++) res_html += `<td>${divDiff[i][j].toFixed(4)}</td>`;
                res_html += `</tr>`;
            }
            res_html += `</table>`;
            addStep('Tabla de Diferencias Divididas', res_html);
            let result = divDiff[0][0], x_prod = 1;
            for(let i=1; i<n; i++) {
                x_prod *= (x_eval - pts[i-1].x);
                result += divDiff[0][i] * x_prod;
            }
            table = `<div class="result-box">P(${x_eval}) = ${result.toFixed(6)}</div>`;
        }
        else if (currentMethod === 'trap' || currentMethod === 's13' || currentMethod === 's38') {
            let fx = getStr('fx');
            let a = getVal('a'), b = getVal('b');
            let n = currentMethod === 'trap' ? getVal('n_int') : currentMethod === 's13' ? getVal('n_even') : getVal('n_mult3');
            savedData = {fx, a, b};
            if(currentMethod === 'trap') savedData.n_int = n;
            if(currentMethod === 's13') { savedData.n_even = n; if(n%2 !== 0) { res.innerHTML = `<div class="badge danger">n debe ser par.</div>`; return; } }
            if(currentMethod === 's38') { savedData.n_mult3 = n; if(n%3 !== 0) { res.innerHTML = `<div class="badge danger">n debe ser múltiplo de 3.</div>`; return; } }
            
            let h = (b - a) / n;
            let sum = 0, stepStr = `h = (${b} - ${a})/${n} = ${h.toFixed(4)}<br>`;
            
            for(let i=0; i<=n; i++) {
                let xi = a + i*h;
                let fxi = evaluateExpr(fx, {x: xi});
                let coeff = 1;
                
                if(i !== 0 && i !== n) {
                    if(currentMethod === 'trap') coeff = 2;
                    else if(currentMethod === 's13') coeff = i%2 === 1 ? 4 : 2;
                    else if(currentMethod === 's38') coeff = i%3 === 0 ? 2 : 3;
                }
                sum += coeff * fxi;
                stepStr += `f(x_${i}) = f(${xi.toFixed(4)}) = ${fxi.toFixed(4)} (coef: ${coeff})<br>`;
            }
            
            let finalRes = sum * (currentMethod === 'trap' ? h/2 : currentMethod === 's13' ? h/3 : 3*h/8);
            addStep('Evaluación', stepStr);
            table = `<div class="result-box">Integral = ${finalRes.toFixed(6)}</div>`;
        }
        else if (currentMethod === 'rk4') {
            let fxy = getStr('fxy'), x0 = getVal('x0'), y0 = getVal('y0'), h = getVal('h'), xf = getVal('xf');
            savedData = {fxy, x0, y0, h, xf};
            table = `<table><tr><th>Iter</th><th>x</th><th>y</th><th>k1</th><th>k2</th><th>k3</th><th>k4</th></tr>`;
            let x = x0, y = y0, iter = 0;
            let xPlot=[], yPlot=[];
            while(x <= xf + h/2) {
                xPlot.push(x); yPlot.push(y);
                let k1 = h * evaluateExpr(fxy, {x: x, y: y});
                let k2 = h * evaluateExpr(fxy, {x: x + h/2, y: y + k1/2});
                let k3 = h * evaluateExpr(fxy, {x: x + h/2, y: y + k2/2});
                let k4 = h * evaluateExpr(fxy, {x: x + h, y: y + k3});
                addStep(`Paso ${iter}`, `x=${x.toFixed(4)}, y=${y.toFixed(6)}<br>k1=${k1.toFixed(6)}<br>k2=${k2.toFixed(6)}<br>k3=${k3.toFixed(6)}<br>k4=${k4.toFixed(6)}<br>y_sig=<span class="result-box">${(y + (k1 + 2*k2 + 2*k3 + k4)/6).toFixed(6)}</span>`);
                table += `<tr><td>${iter}</td><td>${x.toFixed(4)}</td><td>${y.toFixed(6)}</td><td>${k1.toFixed(6)}</td><td>${k2.toFixed(6)}</td><td>${k3.toFixed(6)}</td><td>${k4.toFixed(6)}</td></tr>`;
                y += (k1 + 2*k2 + 2*k3 + k4) / 6; x += h; iter++;
            }
            table += '</table>';
            plotGraph('line', [{label:'RK4 y(x)', data:yPlot, borderColor:'#ff4757'}], xPlot.map(v=>v.toFixed(2)));
        }
        else if (currentMethod === 'minc') {
            let pts = getVal('points');
            let degree = getVal('degree') || 1;
            savedData = {points: pts, degree};
            let n = pts.length;
            if(degree === 1) {
                let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
                pts.forEach(p => { sumX+=p.x; sumY+=p.y; sumXY+=p.x*p.y; sumXX+=p.x*p.x; });
                let b = (n*sumXY - sumX*sumY) / (n*sumXX - sumX*sumX);
                let a = (sumY/n) - b*(sumX/n);
                addStep('Sumatorias', `n=${n}, &Sigma;x=${sumX}, &Sigma;y=${sumY}, &Sigma;xy=${sumXY}, &Sigma;x²=${sumXX}`);
                table = `<div class="result-box">Recta: y = ${a.toFixed(4)} + ${b.toFixed(4)}x</div>`;
                plotGraph('line', [{label:'Ajuste', data:pts.map(p=>a+b*p.x), borderColor:'#00d2ff'}, {label:'Datos', data:pts.map(p=>p.y), type:'scatter', backgroundColor:'#ff4757'}], pts.map(p=>p.x.toFixed(2)));
            } else {
                addStep('Info', 'Ajuste polinomial de grado mayor a 1 no implementado por longitud, se reduce a grado 1.');
            }
        }

        res.innerHTML = (isDetailed ? html : '') + table;
        saveHistory(savedData);

    } catch (e) {
        res.innerHTML = `<div class="badge danger">Error en el cálculo: ${e.message}</div>`;
    }
});

function renderMatrix(mat) {
    let h = '<table style="width:auto; margin:0 auto;">';
    mat.forEach(r => {
        h += '<tr>';
        r.forEach((c, i) => { h += `<td style="${i===r.length-1?'border-left:2px solid var(--primary)':''}">${c.toFixed(2)}</td>` });
        h += '</tr>';
    });
    return h + '</table>';
}

document.getElementById('detailedToggle').addEventListener('change', () => {
    document.getElementById('solveBtn').click();
});

/* ================= SMART INPUT ================= */
document.getElementById('smartInput').addEventListener('change', (e) => {
    let text = e.target.value.toLowerCase();
    
    // Simple heurística para detectar método
    if(text.includes('newton')) { currentCategory='raices'; currentMethod='nr'; }
    else if(text.includes('bisec')) { currentCategory='raices'; currentMethod='bis'; }
    else if(text.includes('gauss') && text.includes('jordan')) { currentCategory='sistemas'; currentMethod='gj'; }
    else if(text.includes('euler')) { currentCategory='edo'; currentMethod='eu'; }
    
    updateUI();
});

/* ================= CALCULADORA ================= */
let calcMem = 0;
let calcMode = 'DEG';
function calcAction(act) {
    let disp = document.getElementById('calcVal');
    let hist = document.getElementById('calcHist');
    let val = disp.innerText;

    if(act === 'C') { disp.innerText = '0'; hist.innerText = ''; }
    else if(act === 'DEL') { disp.innerText = val.length > 1 ? val.slice(0, -1) : '0'; }
    else if(act === 'MODE') {
        calcMode = calcMode === 'DEG' ? 'RAD' : 'DEG';
        document.getElementById('calcModeBtn').innerText = calcMode;
    }
    else if(act === 'MC') { calcMem = 0; }
    else if(act === 'MR') { disp.innerText = calcMem; }
    else if(act === 'M+') { calcMem += parseFloat(eval(val) || 0); }
    else if(act === 'M-') { calcMem -= parseFloat(eval(val) || 0); }
    else if(act === '=') {
        try {
            let expr = val.replace(/sin/g, calcMode==='DEG'?'sin(pi/180*)':'sin')
                          .replace(/cos/g, calcMode==='DEG'?'cos(pi/180*)':'cos');
            hist.innerText = val + ' =';
            disp.innerText = math.evaluate(expr.replace('^', '**'));
        } catch(e) { disp.innerText = 'Error'; }
    }
    else {
        if(val === '0' && act !== '.') disp.innerText = act;
        else disp.innerText += act;
    }
}

updateUI();
loadHistorySelect();
