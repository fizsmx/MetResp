            // Build sums
            let sums = {};
            for(let p = 0; p <= 2*degree; p++) {
                sums['x'+p] = pts.reduce((s,pt) => s + Math.pow(pt.x, p), 0);
            }
            for(let p = 0; p <= degree; p++) {
                sums['xy'+p] = pts.reduce((s,pt) => s + Math.pow(pt.x, p) * pt.y, 0);
            }
            
            // Build normal equations matrix (degree+1 x degree+2)
            let mat = [];
            for(let i = 0; i <= degree; i++) {
                let row = [];
                for(let j = 0; j <= degree; j++) row.push(sums['x'+(i+j)]);
                row.push(sums['xy'+i]);
                mat.push(row);
            }
            
            addStep('Sumatorias', Object.entries(sums).map(([k,v]) => k + ' = ' + v.toFixed(4)).join('<br>'));
            addStep('Sistema Normal', renderMatrix(mat));
            
            // Solve using Gauss elimination
            let sz = degree + 1;
            for(let i = 0; i < sz; i++) {
                let pivot = mat[i][i];
                if(Math.abs(pivot) < 1e-12) { addStep('Error', 'Pivote cero'); break; }
                for(let j = 0; j <= sz; j++) mat[i][j] /= pivot;
                for(let k = 0; k < sz; k++) {
                    if(k !== i) {
                        let f = mat[k][i];
                        for(let j = 0; j <= sz; j++) mat[k][j] -= f * mat[i][j];
                    }
                }
            }
            
            let coeffs = [];
            for(let i = 0; i < sz; i++) coeffs.push(mat[i][sz]);
            
            // Build polynomial string
            let polyStr = coeffs.map((c, i) => {
                if(i === 0) return c.toFixed(4);
                return (c >= 0 ? ' + ' : ' - ') + Math.abs(c).toFixed(4) + (i === 1 ? 'x' : 'x^' + i);
            }).join('');
            
            // Calculate R²
            let yMean = pts.reduce((s,p) => s + p.y, 0) / n;
            let ssTot = pts.reduce((s,p) => s + Math.pow(p.y - yMean, 2), 0);
            let ssRes = pts.reduce((s,p) => {
                let yPred = coeffs.reduce((sum, c, i) => sum + c * Math.pow(p.x, i), 0);
                return s + Math.pow(p.y - yPred, 2);
            }, 0);
            let r2 = 1 - ssRes / ssTot;
            
            addStep('Coeficientes', coeffs.map((c,i) => 'a' + i + ' = ' + c.toFixed(6)).join('<br>'));
            table = `<div class="result-box">P(x) = ${polyStr}</div><br><div class="result-box">R² = ${r2.toFixed(6)}</div>`;
            
            // Plot
            let xMin = Math.min(...pts.map(p=>p.x)), xMax = Math.max(...pts.map(p=>p.x));
            let fitX = [], fitY = [];
            for(let x = xMin; x <= xMax; x += (xMax-xMin)/50) {
                fitX.push(x.toFixed(2));
                fitY.push(coeffs.reduce((sum, c, i) => sum + c * Math.pow(x, i), 0));
            }
            setCharts(vistasAjuste(coeffs, pts, r2));

            // Condición de ortogonalidad de los residuos (ecuaciones normales)
            let residuos = pts.map(pt => pt.y - coeffs.reduce((sum, c, i) => sum + c * Math.pow(pt.x, i), 0));
            let ortoFilas = '', maxOrto = 0;
            for(let k = 0; k <= degree; k++) {
                let sk = pts.reduce((acc, pt, i) => acc + residuos[i] * Math.pow(pt.x, k), 0);
                if(Math.abs(sk) > maxOrto) maxOrto = Math.abs(sk);
                ortoFilas += `<tr><td>&Sigma; e<sub>i</sub>·x<sub>i</sub><sup>${k}</sup></td><td>${linFmt(sk, 10)}</td><td>0</td></tr>`;
            }
            let filasRes = '';
            pts.forEach((pt, i) => {
                let yp = coeffs.reduce((sum, c, j) => sum + c * Math.pow(pt.x, j), 0);
                filasRes += `<tr><td>${i + 1}</td><td>${linFmt(pt.x)}</td><td>${linFmt(pt.y)}</td><td>${linFmt(yp, 6)}</td><td>${linFmt(residuos[i], 6)}</td><td>${linFmt(residuos[i] * residuos[i], 8)}</td></tr>`;
            });

            table += buildVerif({
                fundamento: `A diferencia de la interpolación, este ajuste <b>no pasa por los puntos</b>: busca la curva que minimiza la suma de los residuos al cuadrado. Por eso no puede verificarse comprobando que P(x<sub>i</sub>) = y<sub>i</sub>. La condición que caracteriza al mínimo es que la derivada de esa suma respecto a cada coeficiente sea nula, lo que equivale a que los residuos sean <b>ortogonales</b> a cada potencia de x: &Sigma;e<sub>i</sub> = 0, &Sigma;e<sub>i</sub>x<sub>i</sub> = 0, ... Si esas sumas dan cero, los coeficientes resuelven correctamente las ecuaciones normales y ninguna otra curva del mismo grado tiene menor error.`,
                comprobacion: `<b>1) Condición de mínimo (ortogonalidad de los residuos):</b>
                    <table><tr><th>Suma</th><th>Valor obtenido</th><th>Valor exigido</th></tr>${ortoFilas}</table>
                    <br><b>2) Residuos punto a punto:</b>
                    <table><tr><th>i</th><th>x<sub>i</sub></th><th>y<sub>i</sub></th><th>P(x<sub>i</sub>)</th><th>e<sub>i</sub></th><th>e<sub>i</sub>²</th></tr>${filasRes}</table>
                    <br>SS<sub>res</sub> = &Sigma;e<sub>i</sub>² = ${linFmt(ssRes, 8)} &nbsp;|&nbsp; SS<sub>tot</sub> = ${linFmt(ssTot, 8)} &nbsp;|&nbsp; R² = 1 &minus; SS<sub>res</sub>/SS<sub>tot</sub> = ${linFmt(r2, 8)}`,
                ok: maxOrto < 1e-6,
                okTxt: `Los residuos son ortogonales al modelo: los coeficientes son los de mínimo error cuadrático.`,
                malTxt: `Las condiciones de mínimo no se cumplen (desvío máximo ${linFmt(maxOrto, 10)}); revisa los datos o el grado elegido.`,
                nota: `R² = ${linFmt(r2, 6)} indica qué proporción de la variación de los datos explica el modelo; mide la calidad del ajuste, no la corrección del cálculo (ambas cosas son distintas).`
            });
        }
        else if (currentMethod === 'lu') {
            let n = getVal('sys_n');
            let raw = getStr('sys_matrix');
            savedData = {sys_n: n, sys_matrix: raw};
            let rows = raw.trim().split('\n').map(r => r.split(',').map(Number));
            let A = rows.map(r => r.slice(0, n));
            let b_vec = rows.map(r => r[n]);
            
            // Initialize L and U
            let L = Array.from({length:n}, (_,i) => Array.from({length:n}, (_,j) => i===j?1:0));
            let U = A.map(r => [...r]);
            
            addStep('Matriz Original A', renderMatrix(rows));
            
            for(let i = 0; i < n; i++) {
                for(let k = i+1; k < n; k++) {
                    if(Math.abs(U[i][i]) < 1e-12) { addStep('Error', 'Pivote cero en LU'); break; }
                    let factor = U[k][i] / U[i][i];
                    L[k][i] = factor;
                    for(let j = 0; j < n; j++) U[k][j] -= factor * U[i][j];
                    addStep(`Eliminación F${k+1}`, `L[${k+1}][${i+1}] = ${factor.toFixed(4)}<br>R${k+1} = R${k+1} - ${factor.toFixed(4)} * R${i+1}`);
                }
            }
            
            addStep('Matriz L', renderMatrix(L.map((r,i) => [...r, 0])));
            addStep('Matriz U', renderMatrix(U.map((r,i) => [...r, 0])));
            
            // Forward substitution: Ly = b
            let y = new Array(n).fill(0);
            for(let i = 0; i < n; i++) {
                y[i] = b_vec[i];
                for(let j = 0; j < i; j++) y[i] -= L[i][j] * y[j];
                addStep(`Sustitución Ly=b: y${i+1}`, `y${i+1} = ${y[i].toFixed(6)}`);
            }
            
            // Back substitution: Ux = y
            let x_sol = new Array(n).fill(0);
            for(let i = n-1; i >= 0; i--) {
                x_sol[i] = y[i];
                for(let j = i+1; j < n; j++) x_sol[i] -= U[i][j] * x_sol[j];
                x_sol[i] /= U[i][i];
                addStep(`Sustitución Ux=y: x${i+1}`, `x${i+1} = <span class="result-box">${x_sol[i].toFixed(6)}</span>`);
            }
            
            table = '<h4>Solución:</h4><ul>';
            for(let i = 0; i < n; i++) table += `<li>x${i+1} = ${x_sol[i].toFixed(6)}</li>`;
            table += '</ul>';

            // 1) L·U debe reproducir A
            let LU = Array.from({length:n}, () => new Array(n).fill(0));
            let maxLU = 0;
            for(let i = 0; i < n; i++) {
                for(let j = 0; j < n; j++) {
                    let acc = 0;
                    for(let k = 0; k < n; k++) acc += L[i][k] * U[k][j];
                    LU[i][j] = acc;
                    let d = Math.abs(acc - A[i][j]);
                    if(d > maxLU) maxLU = d;
                }
            }
            let filasLU = '';
            for(let i = 0; i < n; i++) {
                let fila = [], filaA = [];
                for(let j = 0; j < n; j++) { fila.push(linFmt(LU[i][j], 6)); filaA.push(linFmt(A[i][j], 6)); }
                filasLU += `<tr><td>${i+1}</td><td>${fila.join(' &nbsp; ')}</td><td>${filaA.join(' &nbsp; ')}</td></tr>`;
            }
            // 2) A·x debe dar b
            let resLU = residualTable(A, b_vec, x_sol);

            table += buildVerif({
                fundamento: `La factorización se apoya en la identidad <b>A = L·U</b>: si el producto de las dos matrices obtenidas no devuelve la matriz original, la descomposición está mal y todo lo que sigue carece de sentido. Comprobado eso, resolver Ly = b y luego Ux = y equivale a resolver Ax = b, así que la segunda prueba es sustituir la solución en el sistema original. Las dos comprobaciones cubren las dos mitades del método: la descomposición y las sustituciones.`,
                comprobacion: `<b>1) El producto L·U reproduce A:</b>
                    <table><tr><th>Fila</th><th>L·U</th><th>A original</th></tr>${filasLU}</table>
                    Diferencia máxima: ${linFmt(maxLU, 10)}
                    <br><br><b>2) La solución satisface el sistema original:</b>
                    ${resLU.html}`,
                ok: maxLU < 1e-6 && resLU.maxRes < 1e-6,
                okTxt: `L·U = A y A·x = b: la factorización y la solución son correctas.`,
                malTxt: `Alguna comprobación falla (L·U difiere en ${linFmt(maxLU, 8)}, residuo ${linFmt(resLU.maxRes, 8)}); puede requerirse pivoteo.`,
                nota: `Con A ya factorizada, resolver el sistema para otro vector b sólo exige repetir las dos sustituciones: ahí está la ventaja de LU frente a Gauss-Jordan.`
            });

            setCharts(vistasSistemaDirecto(A, b_vec, x_sol, 'Factorización LU'));
        }
        else if (currentMethod === 'spline') {
            let pts = getVal('points').filter(p => !isNaN(p.x) && !isNaN(p.y));
            let x_eval_val = getVal('x_eval');
            if(pts.length < 3 || isNaN(x_eval_val)) {
                res.innerHTML = `<div class="badge danger">Introduce al menos 3 puntos válidos y el valor de x a evaluar.</div>`;
                return;
            }
            savedData = {points: pts, x_eval: x_eval_val};
            pts.sort((a,b) => a.x - b.x);
            let n = pts.length - 1;
            
            // Natural cubic spline
            let h = [], alpha = [];
            for(let i = 0; i < n; i++) h[i] = pts[i+1].x - pts[i].x;
            for(let i = 1; i < n; i++) alpha[i] = (3/h[i])*(pts[i+1].y-pts[i].y) - (3/h[i-1])*(pts[i].y-pts[i-1].y);
            
            let l = new Array(n+1), mu = new Array(n+1), z = new Array(n+1);
            let c = new Array(n+1).fill(0), b_s = new Array(n), d = new Array(n), a_s = pts.map(p => p.y);
            
            l[0] = 1; mu[0] = 0; z[0] = 0;
            for(let i = 1; i < n; i++) {
                l[i] = 2*(pts[i+1].x - pts[i-1].x) - h[i-1]*mu[i-1];
                mu[i] = h[i] / l[i];
                z[i] = (alpha[i] - h[i-1]*z[i-1]) / l[i];
            }
            l[n] = 1; z[n] = 0; c[n] = 0;
            
            for(let j = n-1; j >= 0; j--) {
                c[j] = z[j] - mu[j]*c[j+1];
                b_s[j] = (pts[j+1].y - pts[j].y)/h[j] - h[j]*(c[j+1]+2*c[j])/3;
                d[j] = (c[j+1]-c[j])/(3*h[j]);
            }
            
            // Show spline coefficients
            for(let i = 0; i < n; i++) {
                addStep(`Spline S${i}(x) en [${pts[i].x}, ${pts[i+1].x}]`,
                    `a=${a_s[i].toFixed(4)}, b=${b_s[i].toFixed(4)}, c=${c[i].toFixed(4)}, d=${d[i].toFixed(4)}<br>
                    S${i}(x) = ${a_s[i].toFixed(4)} + ${b_s[i].toFixed(4)}(x-${pts[i].x}) + ${c[i].toFixed(4)}(x-${pts[i].x})² + ${d[i].toFixed(4)}(x-${pts[i].x})³`);
            }
            
            // Evaluate at x_eval
            let result = NaN;
            for(let i = 0; i < n; i++) {
                if(x_eval_val >= pts[i].x && x_eval_val <= pts[i+1].x) {
                    let dx = x_eval_val - pts[i].x;
                    result = a_s[i] + b_s[i]*dx + c[i]*dx*dx + d[i]*dx*dx*dx;
                    break;
                }
            }
            table = `<div class="result-box">S(${x_eval_val}) = ${isNaN(result) ? 'Fuera de rango' : result.toFixed(6)}</div>`;

            const S  = (i, x) => { let t = x - pts[i].x; return a_s[i] + b_s[i]*t + c[i]*t*t + d[i]*t*t*t; };
            const S1 = (i, x) => { let t = x - pts[i].x; return b_s[i] + 2*c[i]*t + 3*d[i]*t*t; };
            const S2 = (i, x) => { let t = x - pts[i].x; return 2*c[i] + 6*d[i]*t; };

            // Pasa por los nodos
            let filasNodos = '', maxNodo = 0;
            for(let i = 0; i < n; i++) {
                let v = S(i, pts[i].x);
                let e = Math.abs(v - pts[i].y);
                if(e > maxNodo) maxNodo = e;
                filasNodos += `<tr><td>${i}</td><td>${linFmt(pts[i].x)}</td><td>${linFmt(pts[i].y)}</td><td>${linFmt(v, 8)}</td><td>${linFmt(e, 10)}</td></tr>`;
            }
            let vFin = S(n-1, pts[n].x);
            let eFin = Math.abs(vFin - pts[n].y);
            if(eFin > maxNodo) maxNodo = eFin;
            filasNodos += `<tr><td>${n}</td><td>${linFmt(pts[n].x)}</td><td>${linFmt(pts[n].y)}</td><td>${linFmt(vFin, 8)}</td><td>${linFmt(eFin, 10)}</td></tr>`;

            // Continuidad C0, C1 y C2 en los nodos interiores
            let filasCont = '', maxCont = 0;
            for(let i = 1; i < n; i++) {
                let xi = pts[i].x;
                let d0 = Math.abs(S(i-1, xi) - S(i, xi));
                let d1 = Math.abs(S1(i-1, xi) - S1(i, xi));
                let d2 = Math.abs(S2(i-1, xi) - S2(i, xi));
                maxCont = Math.max(maxCont, d0, d1, d2);
                filasCont += `<tr><td>${linFmt(xi)}</td><td>${linFmt(d0, 10)}</td><td>${linFmt(d1, 10)}</td><td>${linFmt(d2, 10)}</td></tr>`;
            }
            if(filasCont === '') filasCont = `<tr><td colspan="4">Sólo hay un tramo: no existen nodos interiores.</td></tr>`;

            // Condiciones naturales
            let s2ini = S2(0, pts[0].x);
            let s2fin = S2(n-1, pts[n].x);
            let natural = Math.abs(s2ini) < 1e-8 && Math.abs(s2fin) < 1e-8;

            table += buildVerif({
                fundamento: `Un spline cúbico natural se define por cuatro condiciones, y todas deben comprobarse: cada tramo <b>pasa por sus nodos</b>, y en los nodos interiores coinciden el <b>valor</b> (continuidad C⁰), la <b>primera derivada</b> (C¹, sin picos) y la <b>segunda derivada</b> (C², sin cambios bruscos de curvatura); además, por ser natural, la segunda derivada se anula en los extremos. Si alguna de estas igualdades fallara, la curva mostraría un salto o un quiebre justo en el punto de unión, y el sistema tridiagonal estaría mal resuelto.`,
                comprobacion: `<b>1) Cada tramo pasa por sus nodos:</b>
                    <table><tr><th>i</th><th>x<sub>i</sub></th><th>y<sub>i</sub></th><th>S(x<sub>i</sub>)</th><th>|Error|</th></tr>${filasNodos}</table>
                    <br><b>2) Continuidad en los nodos interiores (deben ser 0):</b>
                    <table><tr><th>Nodo</th><th>|&Delta;S| (C⁰)</th><th>|&Delta;S'| (C¹)</th><th>|&Delta;S''| (C²)</th></tr>${filasCont}</table>
                    <br><b>3) Condiciones de spline natural:</b><br>
                    S''(${linFmt(pts[0].x)}) = ${linFmt(s2ini, 10)} &nbsp;&nbsp; S''(${linFmt(pts[n].x)}) = ${linFmt(s2fin, 10)} &nbsp; (ambas deben ser 0)`,
                ok: maxNodo < 1e-8 && maxCont < 1e-8 && natural,
                okTxt: `Pasa por todos los nodos, es continuo hasta la segunda derivada y cumple las condiciones naturales.`,
                malTxt: `Alguna condición del spline no se cumple; revisa los puntos introducidos.`,
                nota: `Esta suavidad C² es la razón de usar splines en lugar de un único polinomio de grado alto: se evita el fenómeno de Runge sin perder continuidad.`
            });

            const splineAt = px => {
                let i = 0;
                while(i < n - 1 && px > pts[i+1].x) i++;
                let t = px - pts[i].x;
                return a_s[i] + b_s[i]*t + c[i]*t*t + d[i]*t*t*t;
            };
            let vistasSpline = vistasInterpolacion(splineAt, pts, isNaN(result) ? null : x_eval_val, result,
                'Spline cúbico natural (' + n + ' tramo' + (n > 1 ? 's' : '') + ')',
                `Cada tramo entre dos nodos es un polinomio cúbico distinto, pero se unen con la misma pendiente y curvatura: por eso <b>la curva no muestra quiebres en los nodos</b>. Los puntos morados son los datos que unen los tramos.`);
            let ds2 = [];
            for(let i = 0; i < n; i++) {
                ds2.push(lineDS('S\u2033(x) tramo ' + i,
                    sampleFn(px => 2*c[i] + 6*d[i]*(px - pts[i].x), pts[i].x, pts[i+1].x, 30),
                    i % 2 ? CHART_COLORS.curva2 : CHART_COLORS.curva, { tension: 0 }));
            }
            vistasSpline.push({
                name: 'Curvatura S\u2033(x)',
                cfg: chartCfg({ title: 'Segunda derivada: continua y nula en los extremos', xLabel: 'x', yLabel: 'S\u2033(x)', datasets: ds2 }),
                caption: `La segunda derivada mide la curvatura. En un spline natural <b>es continua al pasar de un tramo al siguiente y vale cero en los extremos</b>: por eso los trozos de recta se encuentran sin saltos y la curva termina sin curvarse.`
            });
            setCharts(vistasSpline);
        }
        else if (currentMethod === 'romb') {
            let fx = getStr('fx');
            let a = getVal('a'), b = getVal('b');
            let n = getVal('n_int') || 4;
            savedData = {fx, a, b, n_int: n};
            
            // Build Romberg table
            let R = [];
            for(let i = 0; i <= n; i++) {
                R[i] = [];
                let h_i = (b - a) / Math.pow(2, i);
                let sum = 0;
                for(let k = 1; k < Math.pow(2, i); k++) sum += evaluateExpr(fx, {x: a + k * h_i});
                R[i][0] = h_i / 2 * (evaluateExpr(fx, {x: a}) + 2 * sum + evaluateExpr(fx, {x: b}));
                addStep(`R[${i+1}][1] - Trapecio h=${h_i.toFixed(4)}`, `R[${i+1}][1] = ${R[i][0].toFixed(8)}`);
            }
            
            for(let j = 1; j <= n; j++) {
                for(let i = j; i <= n; i++) {
                    R[i][j] = (Math.pow(4, j) * R[i][j-1] - R[i-1][j-1]) / (Math.pow(4, j) - 1);
                }
            }
            
            // Show Romberg table
            let tableHtml = '<table><tr><th></th>';
            for(let j = 0; j <= n; j++) tableHtml += `<th>O(h^${2*(j+1)})</th>`;
            tableHtml += '</tr>';
            for(let i = 0; i <= n; i++) {
                tableHtml += `<tr><td>n=${Math.pow(2,i)}</td>`;
                for(let j = 0; j <= i; j++) tableHtml += `<td>${R[i][j].toFixed(8)}</td>`;
                for(let j = i+1; j <= n; j++) tableHtml += '<td></td>';
                tableHtml += '</tr>';
            }
            tableHtml += '</table>';
            addStep('Tabla de Romberg', tableHtml);
            table = `<div class="result-box">Integral ≈ ${R[n][n].toFixed(8)}</div>`;

            let refR = refIntegral(fx, a, b);
            let errR = Math.abs(R[n][n] - refR);
            let errRelR = Math.abs(refR) > 1e-12 ? errR / Math.abs(refR) * 100 : 0;
            let difDiag = n >= 1 ? Math.abs(R[n][n] - R[n-1][n-1]) : NaN;
            let filasDiag = '';
            for(let i = 0; i <= n; i++) {
                let d = i === 0 ? '—' : linFmt(Math.abs(R[i][i] - R[i-1][i-1]), 10);
                filasDiag += `<tr><td>R[${i+1}][${i+1}]</td><td>${linFmt(R[i][i], 10)}</td><td>${d}</td></tr>`;
            }

            table += buildVerif({
                fundamento: `Romberg aplica la extrapolación de Richardson sobre la regla del trapecio: cada columna cancela el siguiente término del error, de modo que la <b>diagonal de la tabla debe converger</b> rápidamente al valor exacto. Por eso la verificación observa dos cosas: que las diferencias entre elementos consecutivos de la diagonal tiendan a cero (convergencia interna del método) y que el valor final coincida con una integral calculada aparte con un mallado muy fino (contraste externo e independiente).`,
                comprobacion: `<b>1) Convergencia de la diagonal:</b>
                    <table><tr><th>Elemento</th><th>Valor</th><th>|Diferencia con el anterior|</th></tr>${filasDiag}</table>
                    <br><b>2) Contraste con una integral refinada:</b><br>
                    Referencia (Simpson, n = 2000) = ${linFmt(refR, 10)}<br>
                    Resultado de Romberg = ${linFmt(R[n][n], 10)}<br>
                    Error absoluto = ${linFmt(errR, 10)} &nbsp;|&nbsp; Error relativo = ${linFmt(errRelR, 8)} %`,
                ok: errRelR < 0.1,
                okTxt: `La diagonal converge y el valor coincide con la referencia: la integral es correcta.`,
                malTxt: `El valor difiere de la referencia en ${linFmt(errRelR, 6)} %: aumenta el número de niveles.`,
                nota: `Diferencia entre los dos últimos elementos de la diagonal: ${isNaN(difDiag) ? '—' : linFmt(difDiag, 10)}. Cuanto menor es, más estable es el resultado.`
            });

            let diagDatos = [];
            for(let i = 0; i <= n; i++) diagDatos.push({ x: i + 1, y: R[i][i] });
            let trapDatos = [];
            for(let i = 0; i <= n; i++) trapDatos.push({ x: i + 1, y: R[i][0] });
            let vistasRomb = [{
                name: 'Convergencia de la tabla',
                cfg: chartCfg({
                    title: 'La diagonal converge mucho antes que la columna del trapecio',
                    xLabel: 'Nivel de la tabla', yLabel: 'Valor de la integral',
                    datasets: [
                        lineDS('Columna 1 (sólo trapecio)', trapDatos, CHART_COLORS.aviso, { pointRadius: 5, tension: 0 }),
                        lineDS('Diagonal (Romberg)', diagDatos, CHART_COLORS.curva, { pointRadius: 5, tension: 0 }),
                        lineDS('Valor de referencia', [{ x: 1, y: refR }, { x: n + 1, y: refR }], CHART_COLORS.guia, { borderDash: [6, 4], borderWidth: 1, tension: 0 })
                    ]
                }),
                caption: `La línea roja es la regla del trapecio al ir refinando el paso; la azul es la diagonal de Romberg. <b>La extrapolación de Richardson alcanza el valor de referencia (línea punteada) con muchos menos niveles</b>: ahí está la ganancia del método.`
            }];
            setCharts(vistasRomb.concat(vistasIntegracion(fx, a, b, Math.pow(2, n), 'trap', R[n][n]).slice(0, 1)));
        }

        // Verificación de los métodos de raíces
        if(['nr','bis','pf','sec','rf'].includes(currentMethod) && lastRoot !== null) {
            let fxStr = getStr('fx');
            let r = lastRoot;
            let fRoot = evaluateExpr(fxStr, {x: r});
            let delta = Math.max(Math.abs(r), 1) * 1e-3;
            let fIzq = evaluateExpr(fxStr, {x: r - delta});
            let fDer = evaluateExpr(fxStr, {x: r + delta});
            let cambiaSigno = (fIzq * fDer) < 0;
            let tolUsada = getVal('tol') || 0.01;

            let comprobacion = `Sustituimos la raíz obtenida en la función original:<br>
                f(${linFmt(r, 8)}) = <span class="result-box">${linFmt(fRoot, 10)}</span><br><br>
                Comportamiento en el entorno de la raíz (&delta; = ${linFmt(delta, 6)}):<br>
                f(${linFmt(r - delta, 6)}) = ${linFmt(fIzq, 8)} &nbsp;&nbsp; f(${linFmt(r + delta, 6)}) = ${linFmt(fDer, 8)}<br>
                ${cambiaSigno ? 'La función cambia de signo alrededor del valor obtenido, por lo que la raíz real queda encerrada en ese intervalo.' : 'No se observa cambio de signo en el entorno inmediato (puede tratarse de una raíz múltiple o tangente al eje).'}`;

            if(currentMethod === 'pf') {
                let gr = evaluateExpr(getStr('gx'), {x: r});
                comprobacion += `<br><br>Además, un punto fijo debe cumplir x = g(x):<br>
                    g(${linFmt(r, 8)}) = ${linFmt(gr, 10)} &nbsp; frente a &nbsp; x = ${linFmt(r, 8)} &nbsp; (diferencia: ${linFmt(Math.abs(gr - r), 10)})`;
            }

            table += buildVerif({
                fundamento: `Por definición, una raíz de f es el valor de x donde la función vale cero. Por eso la única prueba válida es sustituir el valor obtenido en la <b>función original</b>: si f(x<sub>r</sub>) &asymp; 0, el número encontrado resuelve realmente la ecuación. No se compara contra un resultado previo, sino contra la ecuación que se quería resolver.`,
                comprobacion: comprobacion,
                ok: Math.abs(fRoot) < 0.01,
                okTxt: `f(x<sub>r</sub>) &asymp; 0: el valor obtenido es una raíz válida de la ecuación.`,
                malTxt: `f(x<sub>r</sub>) se aleja de 0: reduce la tolerancia o aumenta las iteraciones.`,
                nota: `El residuo no es exactamente cero porque el proceso se detiene al alcanzar la tolerancia pedida (${linFmt(tolUsada)} %), no al llegar al valor exacto.`
            });
        }
        res.innerHTML = (isDetailed ? html : '') + table;
        saveHistory(savedData);

    } catch (e) {
        res.innerHTML = `<div class="badge danger">Error en el cálculo: ${e.message}</div>`;
    }
});

let calcMem = 0;
let calcMode = 'DEG';
let calcExpr = '';
function calcAction(act) {
    let disp = document.getElementById('calcVal');
    let hist = document.getElementById('calcHist');

    if(act === 'C') { calcExpr = ''; disp.innerText = '0'; hist.innerText = ''; }
    else if(act === 'DEL') { calcExpr = calcExpr.slice(0, -1); disp.innerText = calcExpr || '0'; }
    else if(act === 'MODE') {
        calcMode = calcMode === 'DEG' ? 'RAD' : 'DEG';
        document.getElementById('calcModeBtn').innerText = calcMode;
    }
    else if(act === 'MC') { calcMem = 0; }
    else if(act === 'MR') { calcExpr = String(calcMem); disp.innerText = calcExpr; }
    else if(act === 'M+') { try { calcMem += math.evaluate(calcExpr); } catch(e) {} }
    else if(act === 'M-') { try { calcMem -= math.evaluate(calcExpr); } catch(e) {} }
    else if(act === '(-)') {
        try { calcExpr = String(-math.evaluate(calcExpr)); disp.innerText = calcExpr; } catch(e) {}
    }
    else if(act === '=') {
        try {
            let expr = calcExpr;
            if(calcMode === 'DEG') {
                expr = expr.replace(/sin\(/g, 'sin(pi/180*').replace(/cos\(/g, 'cos(pi/180*').replace(/tan\(/g, 'tan(pi/180*');
                expr = expr.replace(/asin\(/g, '(180/pi)*asin(').replace(/acos\(/g, '(180/pi)*acos(').replace(/atan\(/g, '(180/pi)*atan(');
            }
            let result = math.evaluate(expr);
            hist.innerText = calcExpr + ' =';
            calcExpr = String(typeof result === 'number' ? parseFloat(result.toPrecision(12)) : result);
            disp.innerText = calcExpr;
        } catch(e) { disp.innerText = 'Error'; setTimeout(() => { disp.innerText = calcExpr || '0'; }, 1500); }
    }
    else if(['sin','cos','tan','asin','acos','atan','ln','log','sqrt'].includes(act)) {
        calcExpr += act + '('; disp.innerText = calcExpr;
    }
    else {
        calcExpr += act;
        disp.innerText = calcExpr;
    }
}

};

function chartTextColor() {
    return getComputedStyle(document.body).getPropertyValue('color').trim() || '#fff';
}

// Muestrea f(x) evitando valores no finitos (asíntotas, dominios vacíos)
function sampleFn(fn, a, b, n = 220) {
    let pts = [], paso = (b - a) / n;
    for(let i = 0; i <= n; i++) {
        let x = a + i * paso;
        let y = fn(x);
        if(isFinite(y) && Math.abs(y) < 1e12) pts.push({ x: x, y: y });
    }
    return pts;
}

function lineDS(label, data, color, extra) {
    return Object.assign({
        label: label,
        type: 'line',
        data: data,
        borderColor: color,
        backgroundColor: color,
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.15,
        fill: false
    }, extra || {});
}

function pointsDS(label, data, color, extra) {
    return Object.assign({

        type: 'scatter',
        data: data,
        backgroundColor: color,
        borderColor: color,
        pointRadius: 6,
        showLine: false
    }, extra || {});
}

function drawChartView(i) {
    if(!chartViews[i]) return;

    if(mainChart) { mainChart.destroy(); mainChart = null; }

// Publica las vistas de gráfica del método actual
function setCharts(views) {
    chartViews = (views || []).filter(v => v && v.cfg);
    let wrap = document.getElementById('mainChartWrap');
    let tabs = document.getElementById('chartTabs');
    if(!wrap || !tabs) return;

    if(chartViews.length === 0) {
        wrap.classList.add('hidden');
        if(mainChart) { mainChart.destroy(); mainChart = null; }
        return;
    }

    wrap.classList.remove('hidden');
    tabs.innerHTML = '';
    if(chartViews.length > 1) {
        chartViews.forEach((v, i) => {
            let b = document.createElement('button');
            b.className = 'chart-tab';
            b.innerText = v.name;
            b.onclick = () => drawChartView(i);
            tabs.appendChild(b);
        });
    }
    drawChartView(0);
}

// Convergencia del error relativo por iteración (escala logarítmica)
function vistaConvergencia(errs, titulo, extraCaption) {
    let datos = errs.map((e, i) => ({ x: i + 1, y: e })).filter(p => isFinite(p.y) && p.y > 0);
    if(datos.length < 2) return null;
    return {
        name: 'Convergencia',
        cfg: chartCfg({
            title: titulo || 'Convergencia del error',
            xLabel: 'Iteración',
            yLabel: 'Error relativo (%)',
            logY: true,
            datasets: [
                lineDS('Error (%)', datos, CHART_COLORS.aviso, { pointRadius: 4, tension: 0 })
            ]
        }),
        caption: `Cada punto es el error relativo al terminar esa iteración, en escala logarítmica: <b>cuanto más rápido baja la curva, más rápido converge el método</b>. Una recta descendente indica convergencia lineal; una caída cada vez más pronunciada, convergencia cuadrática. ${extraCaption || ''}`
    };
}

// Función f(x) con la raíz marcada + convergencia
function vistasRaiz(fxStr, raiz, xs, errs, opts) {
    opts = opts || {};
    let vistas = [];
    let refs = xs.filter(v => isFinite(v)).concat([raiz]);
    if(isFinite(opts.a)) refs.push(opts.a);
    if(isFinite(opts.b)) refs.push(opts.b);
    let lo = Math.min.apply(null, refs), hi = Math.max.apply(null, refs);
    let span = (hi - lo) || Math.max(Math.abs(raiz), 1);
    let a = lo - span * 0.6, b = hi + span * 0.6;
    let curva = sampleFn(x => evaluateExpr(fxStr, { x: x }), a, b, 300);
    let fRaiz = evaluateExpr(fxStr, { x: raiz });

    let ds = [
        lineDS('f(x)', curva, CHART_COLORS.curva),
        lineDS('y = 0', [{ x: a, y: 0 }, { x: b, y: 0 }], CHART_COLORS.guia, { borderDash: [6, 4], borderWidth: 1, tension: 0 }),
        pointsDS('Raíz x = ' + linFmt(raiz, 6), [{ x: raiz, y: fRaiz }], CHART_COLORS.punto, { pointRadius: 10, pointStyle: 'rectRot' })
    ];
    if(isFinite(opts.a) && isFinite(opts.b)) {
        ds.push(pointsDS('Intervalo inicial [a, b]', [
            { x: opts.a, y: evaluateExpr(fxStr, { x: opts.a }) },
            { x: opts.b, y: evaluateExpr(fxStr, { x: opts.b }) }
        ], CHART_COLORS.curva2, { pointRadius: 7, pointStyle: 'triangle' }));
    }

    vistas.push({
        name: 'Función y raíz',
        cfg: chartCfg({ title: 'f(x) y la raíz encontrada', xLabel: 'x', yLabel: 'f(x)', datasets: ds }),
        caption: `La curva azul es la función <b>f(x)</b>; la línea punteada es <b>y = 0</b>. La raíz es exactamente el punto donde ambas se cruzan, señalado con el rombo verde en x = ${linFmt(raiz, 6)}. Si la curva pasa de un lado al otro del eje, el cambio de signo confirma que la raíz está ahí. Pasa el cursor sobre la curva para leer los valores.`
    });

    let conv = vistaConvergencia(errs, 'Cómo se acercó el método a la raíz');
    if(conv) vistas.push(conv);
    return vistas;
}

// Punto fijo: g(x) frente a la recta y = x
function vistasPuntoFijo(fxStr, gxStr, raiz, xs, errs) {
    let refs = xs.filter(v => isFinite(v)).concat([raiz]);
    let lo = Math.min.apply(null, refs), hi = Math.max.apply(null, refs);
    let span = (hi - lo) || Math.max(Math.abs(raiz), 1);
    let a = lo - span * 0.8, b = hi + span * 0.8;
    let vistas = [{
        name: 'g(x) y la recta y = x',
        cfg: chartCfg({
            title: 'El punto fijo es el corte de g(x) con y = x',
            xLabel: 'x', yLabel: 'y',
            datasets: [
                lineDS('g(x)', sampleFn(x => evaluateExpr(gxStr, { x: x }), a, b, 300), CHART_COLORS.curva),
                lineDS('y = x', [{ x: a, y: a }, { x: b, y: b }], CHART_COLORS.guia, { borderDash: [6, 4], borderWidth: 1, tension: 0 }),
                pointsDS('Punto fijo x = ' + linFmt(raiz, 6), [{ x: raiz, y: raiz }], CHART_COLORS.punto, { pointRadius: 10, pointStyle: 'rectRot' })
            ]
        }),
        caption: `Resolver f(x) = 0 se transformó en buscar <b>x = g(x)</b>. Por eso la solución aparece donde la curva g(x) corta la recta y = x (rombo verde). El método converge si la pendiente de g en ese punto es menor que 1 en valor absoluto: cuanto más horizontal sea g junto al corte, más rápido converge.`
    }];
    let conv = vistaConvergencia(errs, 'Cómo se acercó el método al punto fijo');
    if(conv) vistas.push(conv);
    return vistas;
}

// Curva interpoladora + puntos de soporte (+ punto evaluado)
function vistasInterpolacion(fn, pts, xEval, yEval, titulo, explicacion) {
    let xsAll = pts.map(p => p.x);
    if(xEval !== null && isFinite(xEval)) xsAll.push(xEval);
    let lo = Math.min.apply(null, xsAll), hi = Math.max.apply(null, xsAll);
    let pad = (hi - lo) * 0.18 || 1;
    let ds = [
        lineDS('Curva interpoladora', sampleFn(fn, lo - pad, hi + pad, 300), CHART_COLORS.curva),
        pointsDS('Puntos dados', pts.map(p => ({ x: p.x, y: p.y })), CHART_COLORS.curva2, { pointRadius: 7 })
    ];
    if(xEval !== null && isFinite(xEval) && isFinite(yEval)) {
        ds.push(lineDS('Lectura del valor', [
            { x: xEval, y: Math.min.apply(null, pts.map(p => p.y).concat([yEval])) },
            { x: xEval, y: yEval },
            { x: lo - pad, y: yEval }
        ], CHART_COLORS.aviso, { borderDash: [6, 4], borderWidth: 1.5, tension: 0 }));
        ds.push(pointsDS(`Valor calculado (${linFmt(xEval)}, ${linFmt(yEval, 6)})`, [{ x: xEval, y: yEval }], CHART_COLORS.punto, { pointRadius: 10, pointStyle: 'rectRot' }));
    }
    return [{
        name: 'Curva y puntos',
        cfg: chartCfg({ title: titulo, xLabel: 'x', yLabel: 'f(x)', datasets: ds }),
        caption: explicacion || `Los puntos morados son los datos; la curva azul es la función construida, que <b>pasa exactamente por todos ellos</b>. Si la curva se aleja de algún punto, la interpolación sería incorrecta.`
    }];
}

// Área bajo la curva y figura que usa la regla de integración
function vistasIntegracion(fxStr, a, b, n, metodo, resultado) {
    let pad = (b - a) * 0.12 || 1;
    let curva = sampleFn(x => evaluateExpr(fxStr, { x: x }), a - pad, b + pad, 300);
    let h = (b - a) / n;
    let nodos = [];
    for(let i = 0; i <= n; i++) {
        let x = a + i * h;
        nodos.push({ x: x, y: evaluateExpr(fxStr, { x: x }) });
    }

    // Figura de la aproximación: recta entre nodos (trapecio) o parábolas (Simpson)
    let aprox = [];
    if(metodo === 'trap') {
        aprox = nodos.slice();
    } else {
        let paso = metodo === 's13' ? 2 : 3;
        for(let i = 0; i + paso <= n; i += paso) {
            let sub = [];
            for(let k = 0; k <= paso; k++) sub.push(nodos[i + k]);
            let dens = 14;
            for(let t = 0; t <= dens; t++) {
                let x = sub[0].x + (sub[paso].x - sub[0].x) * t / dens;
                let y = 0;
                for(let j = 0; j <= paso; j++) {
                    let L = 1;
                    for(let m = 0; m <= paso; m++) if(m !== j) L *= (x - sub[m].x) / (sub[j].x - sub[m].x);
                    y += sub[j].y * L;
                }
                aprox.push({ x: x, y: y });
            }
        }
    }
    let nombre = metodo === 'trap' ? 'Trapecios' : metodo === 's13' ? 'Parábolas (Simpson 1/3)' : 'Cúbicas (Simpson 3/8)';

    let vistas = [{
        name: 'Área aproximada',
        cfg: chartCfg({
            title: `Área bajo f(x) entre ${linFmt(a)} y ${linFmt(b)} &asymp; ${linFmt(resultado, 6)}`,
            xLabel: 'x', yLabel: 'f(x)',
            datasets: [
                lineDS(nombre + ' (área calculada)', aprox, CHART_COLORS.curva2, { fill: 'origin', backgroundColor: CHART_COLORS.area, tension: 0 }),
                lineDS('f(x) real', curva, CHART_COLORS.curva),
                pointsDS('Nodos usados', nodos, CHART_COLORS.punto, { pointRadius: 5 })
            ]
        }),
        caption: `La región sombreada es <b>el área que el método calcula</b>: se sustituye la función por ${metodo === 'trap' ? 'segmentos rectos entre nodos' : 'arcos que pasan por cada grupo de nodos'}. Cuanto mejor se superpone esa figura a la curva azul, menor es el error. Aumentar n acerca ambas curvas.`
    }];

    // Convergencia al aumentar n
    let datosN = [], ref = refIntegral(fxStr, a, b);
    let mult = metodo === 's38' ? 3 : metodo === 's13' ? 2 : 1;
    for(let k = 1; k <= 6; k++) {
        let nn = mult * Math.pow(2, k);
        let val = integrateRule(metodo, fxStr, a, b, nn);
        let err = Math.abs(val - ref);
        if(err > 0) datosN.push({ x: nn, y: err });
    }
    if(datosN.length > 1) {
        vistas.push({
            name: 'Error según n',
            cfg: chartCfg({
                title: 'El error disminuye al aumentar los subintervalos',
                xLabel: 'n (subintervalos)', yLabel: 'Error absoluto',
                logY: true,
                datasets: [lineDS('Error frente a la integral refinada', datosN, CHART_COLORS.aviso, { pointRadius: 5, tension: 0 })]
            }),
            caption: `Error del método frente a una integral muy refinada, al duplicar n. La caída constante en escala logarítmica <b>confirma el orden del método</b>: ${metodo === 'trap' ? 'O(h²), el error se divide entre ~4 al duplicar n' : 'O(h⁴), el error se divide entre ~16 al duplicar n'}.`
        });
    }
    return vistas;
}

// Solución de una EDO frente a la solución de referencia
function vistasEDO(fxy, xs, ys, nombreMetodo) {
    let ref = xs.map(x => ({ x: x, y: rk4Reference(fxy, xs[0], ys[0], x, Math.max(200, xs.length * 40)) }));
    let numerica = xs.map((x, i) => ({ x: x, y: ys[i] }));
    let errores = xs.map((x, i) => ({ x: x, y: Math.abs(ys[i] - ref[i].y) })).filter(p => p.y > 0);

    let vistas = [{
        name: 'Solución y(x)',
        cfg: chartCfg({
            title: `Solución de la EDO por ${nombreMetodo}`,
            xLabel: 'x', yLabel: 'y(x)',
            datasets: [
                lineDS('Solución de referencia', ref, CHART_COLORS.guia, { borderWidth: 3, pointRadius: 0 }),
                lineDS(nombreMetodo, numerica, CHART_COLORS.curva, { pointRadius: 5, tension: 0 })
            ]
        }),
        caption: `Los puntos azules son los valores que calculó el método paso a paso; la línea gris gruesa es la solución de referencia (RK4 con paso muy fino). <b>La separación entre ambas es el error de truncamiento</b>: si se superponen, el paso h elegido es adecuado.`
    }];
    if(errores.length > 1) {
        vistas.push({
            name: 'Error acumulado',
            cfg: chartCfg({
                title: 'Cómo crece el error a lo largo del intervalo',
                xLabel: 'x', yLabel: 'Error absoluto',
                logY: true,
                datasets: [lineDS('|y numérica − y referencia|', errores, CHART_COLORS.aviso, { pointRadius: 4, tension: 0 })]
            }),
            caption: `El error de un paso se arrastra a los siguientes, por eso suele crecer con x. Reducir h baja toda la curva: <b>a la mitad en Euler, unas 16 veces en RK4</b>.`
        });
    }
    return vistas;
}

// Ajuste por mínimos cuadrados: curva + datos, y residuos
function vistasAjuste(coeffs, pts, r2) {
    const P = x => coeffs.reduce((sum, c, i) => sum + c * Math.pow(x, i), 0);
    let lo = Math.min.apply(null, pts.map(p => p.x)), hi = Math.max.apply(null, pts.map(p => p.x));
    let pad = (hi - lo) * 0.1 || 1;

    let vistas = [{
        name: 'Ajuste y datos',
        cfg: chartCfg({
            title: `Curva ajustada (R² = ${linFmt(r2, 6)})`,
            xLabel: 'x', yLabel: 'y',
            datasets: [
                lineDS('Curva ajustada', sampleFn(P, lo - pad, hi + pad, 200), CHART_COLORS.curva),
                pointsDS('Datos experimentales', pts.map(p => ({ x: p.x, y: p.y })), CHART_COLORS.aviso, { pointRadius: 7 })
            ]
        }),
        caption: `A diferencia de la interpolación, la curva <b>no pasa por los puntos</b>: busca el mejor compromiso entre todos. La distancia vertical de cada dato a la curva es su residuo, y el método minimiza la suma de esos residuos al cuadrado.`
    }];

    let residuos = pts.map(p => ({ x: p.x, y: p.y - P(p.x) }));
    vistas.push({
        name: 'Residuos',
        cfg: chartCfg({
            title: 'Residuos: diferencia entre cada dato y la curva',
            xLabel: 'x', yLabel: 'Residuo (y − P(x))',
            cruceEnCero: true,
            datasets: [
                pointsDS('Residuo de cada dato', residuos, CHART_COLORS.punto, { pointRadius: 7 }),
                lineDS('Residuo cero', [{ x: lo - pad, y: 0 }, { x: hi + pad, y: 0 }], CHART_COLORS.guia, { borderDash: [6, 4], borderWidth: 1, tension: 0 })
            ]
        }),
        caption: `Si el modelo es adecuado, los residuos se reparten <b>arriba y abajo del cero sin seguir ningún patrón</b>. Si en cambio dibujan una curva, el grado elegido es insuficiente y conviene subirlo.`
    });
    return vistas;
}

// Sistemas iterativos: evolución de las incógnitas y del error
function vistasSistemaIterativo(histX, histErr, nombreMetodo) {
    let paleta = ['#00d2ff', '#8a2be2', '#2ed573', '#ff4757', '#ffa502', '#eccc68'];
    let nVars = histX[0] ? histX[0].length : 0;
    let ds = [];
    for(let v = 0; v < nVars; v++) {
        ds.push(lineDS('x' + (v + 1), histX.map((fila, i) => ({ x: i, y: fila[v] })), paleta[v % paleta.length], { pointRadius: 4, tension: 0 }));
    }
    let vistas = [{
        name: 'Valores por iteración',
        cfg: chartCfg({
            title: `Cómo se estabilizan las incógnitas (${nombreMetodo})`,
            xLabel: 'Iteración', yLabel: 'Valor de la incógnita',
            datasets: ds
        }),
        caption: `Cada línea es una incógnita a lo largo de las iteraciones. <b>Cuando las líneas se aplanan, el método ha convergido</b>: los valores ya no cambian de una iteración a la siguiente. Si en cambio se separan cada vez más, el método diverge y la matriz no cumple la dominancia diagonal.`
    }];
    let conv = vistaConvergencia(histErr, 'Error entre iteraciones consecutivas');
    if(conv) vistas.push(conv);
    return vistas;
}

// Sistemas directos: residuo de cada ecuación (y rectas si el sistema es 2x2)
function vistasSistemaDirecto(A, b, x, nombreMetodo) {
    let vistas = [];
    if(A.length === 2 && A[0].length === 2) {
        let sols = x;
        let span = Math.max(Math.abs(sols[0]), Math.abs(sols[1]), 1) * 2;
        let lo = sols[0] - span, hi = sols[0] + span;
        let rectas = [];
        for(let i = 0; i < 2; i++) {
            if(Math.abs(A[i][1]) > 1e-12) {
                rectas.push(lineDS(`Ecuación ${i + 1}`, sampleFn(v => (b[i] - A[i][0] * v) / A[i][1], lo, hi, 60), i === 0 ? CHART_COLORS.curva : CHART_COLORS.curva2, { tension: 0 }));
            }
        }
        rectas.push(pointsDS(`Solución (${linFmt(sols[0], 4)}, ${linFmt(sols[1], 4)})`, [{ x: sols[0], y: sols[1] }], CHART_COLORS.punto, { pointRadius: 10, pointStyle: 'rectRot' }));
        vistas.push({
            name: 'Rectas del sistema',
            cfg: chartCfg({ title: 'La solución es el punto donde se cortan las ecuaciones', xLabel: 'x1', yLabel: 'x2', datasets: rectas }),
            caption: `Cada ecuación de un sistema 2×2 es una recta en el plano. <b>La solución es su punto de corte</b>: por eso satisface ambas ecuaciones a la vez.`
        });
    }
    let residuos = A.map((fila, i) => {
        let suma = fila.reduce((acc, aij, j) => acc + aij * x[j], 0);
        return { x: i + 1, y: Math.abs(suma - b[i]) };
    });
    vistas.push({
        name: 'Residuos por ecuación',
        cfg: chartCfg({
            title: `Comprobación: |Ax − b| en cada ecuación (${nombreMetodo})`,
            xLabel: 'Número de ecuación', yLabel: '|Residuo|',
            datasets: [pointsDS('|Residuo|', residuos, CHART_COLORS.punto, { pointRadius: 9 })]
        }),
        caption: `Se sustituye la solución en cada ecuación original y se mide cuánto se aleja del término independiente. <b>Residuos prácticamente nulos significan que la solución es exacta</b>; valores apreciables indicarían un error de cálculo o un sistema mal condicionado.`
    });
    return vistas;
}

/* ================= VERIFICACIÓN DE RESULTADOS =================
   Todo método cierra con un bloque que explica por qué su resultado es
   correcto: el fundamento (qué propiedad matemática debe cumplirse),
   la comprobación numérica y la conclusión. */
function buildVerif(o) {
    let estado = '';
    if(o.ok !== undefined) {
        estado = `<div class="verif-final"><span class="badge ${o.ok ? 'success' : 'danger'}">${o.ok ? (o.okTxt || 'Resultado verificado.') : (o.malTxt || 'La comprobación no se cumple; revisa los datos.')}</span></div>`;
    }
    return `<div class="step-card verification">
        <h4>Verificación del resultado</h4>
        <div class="verif-why"><b>Por qué esta comprobación lo valida:</b><br>${o.fundamento}</div>
        <div class="verif-check"><b>Comprobación:</b><br>${o.comprobacion}</div>
        ${estado}
        ${o.nota ? `<div class="verif-note">${o.nota}</div>` : ''}
    </div>`;
}

// Residuos de un sistema: sustituye la solución en cada ecuación original
function residualTable(A, b, x) {
    let filas = '', maxRes = 0;
    for(let i = 0; i < A.length; i++) {
        let suma = 0, expr = [];
        for(let j = 0; j < A[i].length; j++) {
            suma += A[i][j] * x[j];
            expr.push(`(${linFmt(A[i][j], 4)})(${linFmt(x[j], 6)})`);
        }
        let r = Math.abs(suma - b[i]);
        if(r > maxRes) maxRes = r;
        filas += `<tr><td>${i + 1}</td><td style="text-align:left">${expr.join(' + ')}</td><td>${linFmt(suma, 8)}</td><td>${linFmt(b[i], 6)}</td><td>${linFmt(r, 10)}</td></tr>`;
    }
    return {
        html: `<table><tr><th>Ec.</th><th>Sustitución en la ecuación original</th><th>Resultado</th><th>Término independiente</th><th>|Residuo|</th></tr>${filas}</table>`,
        maxRes: maxRes
    };
}

// Integral de referencia: Simpson 1/3 compuesto muy refinado
function refIntegral(fx, a, b, n = 2000) {
    if(n % 2 !== 0) n++;
    let h = (b - a) / n;
    let s = evaluateExpr(fx, { x: a }) + evaluateExpr(fx, { x: b });
    for(let i = 1; i < n; i++) s += (i % 2 ? 4 : 2) * evaluateExpr(fx, { x: a + i * h });
    return s * h / 3;
}

// Recalcula la misma regla de integración con otro número de intervalos
function integrateRule(metodo, fx, a, b, n) {
    let h = (b - a) / n, sum = 0;
    for(let i = 0; i <= n; i++) {
        let coef = 1;
        if(i !== 0 && i !== n) {
            if(metodo === 'trap') coef = 2;
            else if(metodo === 's13') coef = i % 2 === 1 ? 4 : 2;
            else if(metodo === 's38') coef = i % 3 === 0 ? 2 : 3;
        }
        sum += coef * evaluateExpr(fx, { x: a + i * h });
    }
    return sum * (metodo === 'trap' ? h / 2 : metodo === 's13' ? h / 3 : 3 * h / 8);
}

// Solución de referencia de una EDO con RK4 y paso muy pequeño
function rk4Reference(fxy, x0, y0, xf, pasos = 2000) {
    let h = (xf - x0) / pasos, x = x0, y = y0;
    for(let i = 0; i < pasos; i++) {
        let k1 = h * evaluateExpr(fxy, { x: x, y: y });
        let k2 = h * evaluateExpr(fxy, { x: x + h / 2, y: y + k1 / 2 });
        let k3 = h * evaluateExpr(fxy, { x: x + h / 2, y: y + k2 / 2 });
        let k4 = h * evaluateExpr(fxy, { x: x + h, y: y + k3 });
        y += (k1 + 2 * k2 + 2 * k3 + k4) / 6;
        x += h;
    }
    return y;
}

// Polinomio de Lagrange evaluado en x
function lagrangeAt(pts, x) {
    let r = 0;
    for(let i = 0; i < pts.length; i++) {
        let L = 1;
        for(let j = 0; j < pts.length; j++) if(j !== i) L *= (x - pts[j].x) / (pts[i].x - pts[j].x);
        r += pts[i].y * L;
    }
    return r;
}

/* ========== POLINOMIOS (Newton / diferencias divididas) ========== */
// Coeficientes en orden ascendente: [c0, c1, c2] = c0 + c1*x + c2*x^2
function polyMul(p, q) {
    let r = new Array(p.length + q.length - 1).fill(0);
    for(let i = 0; i < p.length; i++)
        for(let j = 0; j < q.length; j++) r[i + j] += p[i] * q[j];
    return r;
}

function polyEval(c, x) {
    let r = 0;
    for(let i = c.length - 1; i >= 0; i--) r = r * x + c[i];
    return r;
}

// Escribe el polinomio en potencias descendentes: 3x^2 - 2x + 1
function polyToString(c, v = 'x') {
    let terms = [];
    for(let i = c.length - 1; i >= 0; i--) {
        let a = parseFloat(c[i].toFixed(10));
        if(a === 0) continue;
        let abs = Math.abs(a);
        let coefTxt = (abs === 1 && i > 0) ? '' : linFmt(abs, 6);
        let varTxt = i === 0 ? '' : (i === 1 ? v : `${v}<sup>${i}</sup>`);
        terms.push({ sign: a < 0 ? '−' : '+', txt: coefTxt + varTxt });
    }
    if(terms.length === 0) return '0';
    let out = (terms[0].sign === '−' ? '−' : '') + terms[0].txt;
    for(let k = 1; k < terms.length; k++) out += ` ${terms[k].sign} ${terms[k].txt}`;
    return out;
}

// Factor (x − xj) formateado según el signo de xj
function newtonFactor(xj) {
    if(xj === 0) return '(x)';
    return xj > 0 ? `(x − ${linFmt(xj)})` : `(x + ${linFmt(Math.abs(xj))})`;
}

// P(x) = a0 + a1(x−x0) + a2(x−x0)(x−x1) + ... con o sin valores numéricos
function newtonPolyString(coefs, pts, numerico) {
    let out = '';
    for(let i = 0; i < coefs.length; i++) {
        let a = coefs[i];
        if(numerico && parseFloat(a.toFixed(10)) === 0 && i > 0) continue;
        let factores = '';
        for(let k = 0; k < i; k++) factores += newtonFactor(pts[k].x);
        let aTxt = numerico ? linFmt(Math.abs(a), 6) : `a<sub>${i}</sub>`;
        let signo = (numerico && a < 0) ? '−' : '+';
        if(out === '') out = (numerico && a < 0 ? '−' : '') + aTxt + factores;
        else out += ` ${numerico ? signo : '+'} ${aTxt}${factores}`;
    }
    return out === '' ? '0' : out;
}

// Gráfica de un polinomio con sus puntos de soporte

/* ================= INTERPOLACIÓN LINEAL ================= */
let linMode = 'y'; // 'y' = se conoce X y se calcula Y | 'x' = se conoce Y y se calcula X

function linFmt(v, d = 6) {
    if(v === null || v === undefined || isNaN(v)) return '—';
    if(!isFinite(v)) return '∞';
    let r = parseFloat(v.toFixed(d));
    if(Object.is(r, -0)) r = 0;
    return String(r);
}

function linEl(id) { return document.getElementById('inp_' + id); }

function linNum(id) {
    let el = linEl(id);
    if(!el || el.value.trim() === '') return null;

    return isNaN(v) ? null : v;
}

function linVarNames() {

        : 'Escribe <b>' + vy + '</b> en el Punto 3 y <b>' + vx + '</b> se calcula automáticamente (o escribe ' + vx + ' para obtener ' + vy + ').';
}

function computeLinInterp() {
    const { vx, vy } = linVarNames();
    const x1 = linNum('lin_x1'), y1 = linNum('lin_y1');
    const x2 = linNum('lin_x2'), y2 = linNum('lin_y2');

    if([x1, y1, x2, y2].some(v => v === null))
        return { ok: false, pending: true, msg: `Completa los dos puntos conocidos: (${vx}<sub>1</sub>, ${vy}<sub>1</sub>) y (${vx}<sub>2</sub>, ${vy}<sub>2</sub>).`, vx, vy };

    if(x1 === x2 && y1 === y2)
        return { ok: false, msg: 'El Punto 1 y el Punto 2 son idénticos: no definen una recta.', vx, vy };

    const known = linMode === 'y' ? linNum('lin_x3') : linNum('lin_y3');
    if(known === null)
        return { ok: false, pending: true, msg: linMode === 'y'
            ? `Introduce el valor conocido ${vx}<sub>3</sub> del Punto 3.`
            : `Introduce el valor conocido ${vy}<sub>3</sub> del Punto 3.`, vx, vy };

    if(linMode === 'y' && x1 === x2)
        return { ok: false, msg: `${vx}<sub>1</sub> y ${vx}<sub>2</sub> son iguales: la recta es vertical y ${vy} no queda determinada.`, vx, vy };
    if(linMode === 'x' && y1 === y2)
        return { ok: false, msg: `${vy}<sub>1</sub> y ${vy}<sub>2</sub> son iguales: la recta es horizontal y ${vx} no puede despejarse.`, vx, vy };

    const dx = x2 - x1, dy = y2 - y1;
    const m = dy / dx;
    const b = y1 - m * x1;

    let x3, y3;
    if(linMode === 'y') {
        x3 = known;
        y3 = y1 + (x3 - x1) * (dy / dx);
    } else {
        y3 = known;
        x3 = x1 + (y3 - y1) * (dx / dy);
    }

    if(!isFinite(x3) || !isFinite(y3))
        return { ok: false, msg: 'El resultado no es un número finito. Revisa los datos ingresados.', vx, vy };

    const lo = Math.min(x1, x2), hi = Math.max(x1, x2);
    const dentro = x3 >= lo && x3 <= hi;

    return { ok: true, vx, vy, x1, y1, x2, y2, x3, y3, dx, dy, m, b, dentro, mode: linMode };
}

function buildLinSteps(r) {
    const { vx, vy, x1, y1, x2, y2, x3, y3, dx, dy, m, b } = r;
    const f = linFmt;
    let steps = [];

    steps.push({
        t: '1. Datos del problema',
        c: `<table style="max-width:440px;margin:0.5rem auto;">
            <tr><th></th><th>${vx}</th><th>${vy}</th></tr>
            <tr><td>Punto 1</td><td>${f(x1)}</td><td>${f(y1)}</td></tr>
            <tr><td>Punto 2</td><td>${f(x2)}</td><td>${f(y2)}</td></tr>
            <tr><td>Punto 3</td>
                <td${r.mode === 'y' ? '' : ' style="color:var(--success);font-weight:700"'}>${f(x3)}</td>
                <td${r.mode === 'x' ? '' : ' style="color:var(--success);font-weight:700"'}>${f(y3)}</td>
            </tr>
        </table>
        Dato conocido del Punto 3: <b>${r.mode === 'y' ? vx + '<sub>3</sub> = ' + f(x3) : vy + '<sub>3</sub> = ' + f(y3)}</b> &nbsp;|&nbsp; Incógnita: <b>${r.mode === 'y' ? vy + '<sub>3</sub>' : vx + '<sub>3</sub>'}</b>`
    });

    steps.push({
        t: '2. Planteamiento (semejanza de triángulos)',
        c: `Los tres puntos pertenecen a la misma recta, por lo que las pendientes de los segmentos P<sub>1</sub>P<sub>3</sub> y P<sub>1</sub>P<sub>2</sub> son iguales:<br><br>
            <span class="math-expr">(${vy} &minus; ${vy}<sub>1</sub>) / (${vx} &minus; ${vx}<sub>1</sub>) = (${vy}<sub>2</sub> &minus; ${vy}<sub>1</sub>) / (${vx}<sub>2</sub> &minus; ${vx}<sub>1</sub>)</span>`
    });

    steps.push({
        t: '3. Incrementos y pendiente',
        c: `&Delta;${vx} = ${vx}<sub>2</sub> &minus; ${vx}<sub>1</sub> = ${f(x2)} &minus; ${f(x1)} = <b>${f(dx)}</b><br>
            &Delta;${vy} = ${vy}<sub>2</sub> &minus; ${vy}<sub>1</sub> = ${f(y2)} &minus; ${f(y1)} = <b>${f(dy)}</b><br>
            m = &Delta;${vy} / &Delta;${vx} = ${f(dy)} / ${f(dx)} = <b>${f(m, 8)}</b>`
    });

    if(r.mode === 'y') {
        steps.push({
            t: '4. Despeje de la incógnita',
            c: `<span class="math-expr">${vy}<sub>3</sub> = ${vy}<sub>1</sub> + (${vx}<sub>3</sub> &minus; ${vx}<sub>1</sub>) &middot; (${vy}<sub>2</sub> &minus; ${vy}<sub>1</sub>) / (${vx}<sub>2</sub> &minus; ${vx}<sub>1</sub>)</span>`
        });
        steps.push({
            t: '5. Sustitución de valores',
            c: `${vy}<sub>3</sub> = ${f(y1)} + (${f(x3)} &minus; ${f(x1)}) &middot; (${f(y2)} &minus; ${f(y1)}) / (${f(x2)} &minus; ${f(x1)})<br>
                ${vy}<sub>3</sub> = ${f(y1)} + (${f(x3 - x1)}) &middot; (${f(dy)} / ${f(dx)})<br>
                ${vy}<sub>3</sub> = ${f(y1)} + (${f(x3 - x1)}) &middot; (${f(m, 8)})<br>
                ${vy}<sub>3</sub> = ${f(y1)} + ${f((x3 - x1) * m, 8)}<br>
                ${vy}<sub>3</sub> = <b>${f(y3, 8)}</b>`
        });
    } else {
        steps.push({
            t: '4. Despeje de la incógnita',
            c: `<span class="math-expr">${vx}<sub>3</sub> = ${vx}<sub>1</sub> + (${vy}<sub>3</sub> &minus; ${vy}<sub>1</sub>) &middot; (${vx}<sub>2</sub> &minus; ${vx}<sub>1</sub>) / (${vy}<sub>2</sub> &minus; ${vy}<sub>1</sub>)</span>`
        });
        steps.push({
            t: '5. Sustitución de valores',
            c: `${vx}<sub>3</sub> = ${f(x1)} + (${f(y3)} &minus; ${f(y1)}) &middot; (${f(x2)} &minus; ${f(x1)}) / (${f(y2)} &minus; ${f(y1)})<br>
                ${vx}<sub>3</sub> = ${f(x1)} + (${f(y3 - y1)}) &middot; (${f(dx)} / ${f(dy)})<br>
                ${vx}<sub>3</sub> = ${f(x1)} + (${f(y3 - y1)}) &middot; (${f(dx / dy, 8)})<br>
                ${vx}<sub>3</sub> = ${f(x1)} + ${f((y3 - y1) * (dx / dy), 8)}<br>
                ${vx}<sub>3</sub> = <b>${f(x3, 8)}</b>`
        });
    }

    steps.push({
        t: '6. Ecuación de la recta que une P<sub>1</sub> y P<sub>2</sub>',
        c: `<span class="math-expr">${vy} = ${f(m, 8)} &middot; ${vx} ${b >= 0 ? '+' : '&minus;'} ${f(Math.abs(b), 8)}</span><br>
            Forma punto-pendiente: ${vy} &minus; ${f(y1)} = ${f(m, 8)} &middot; (${vx} &minus; ${f(x1)})`
    });

    return steps;
}

function plotLinearInterp(r) {
    const xs = [r.x1, r.x2, r.x3], ys = [r.y1, r.y2, r.y3];
    const minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
    const minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
    const padX = (maxX - minX) * 0.25 || Math.abs(maxX * 0.25) || 1;
    const padY = (maxY - minY) * 0.25 || Math.abs(maxY * 0.25) || 1;
    const a = minX - padX, b = maxX + padX;
    const yAt = x => r.y1 + r.m * (x - r.x1);

    setCharts([{
        name: 'Recta de interpolación',
        cfg: chartCfg({
            title: `Interpolación lineal entre (${linFmt(r.x1)}, ${linFmt(r.y1)}) y (${linFmt(r.x2)}, ${linFmt(r.y2)})`,
            xLabel: r.vx,
            yLabel: r.vy,
            datasets: [
                lineDS('Recta que une los puntos conocidos', [{ x: a, y: yAt(a) }, { x: b, y: yAt(b) }], CHART_COLORS.curva, { tension: 0 }),
                lineDS('Lectura del valor buscado', [
                    { x: r.x3, y: minY - padY },
                    { x: r.x3, y: r.y3 },
                    { x: a, y: r.y3 }
                ], CHART_COLORS.aviso, { borderDash: [6, 4], borderWidth: 1.5, tension: 0 }),
                pointsDS('Puntos conocidos (P1 y P2)', [{ x: r.x1, y: r.y1 }, { x: r.x2, y: r.y2 }], CHART_COLORS.curva2, { pointRadius: 8 }),
                pointsDS(`Punto calculado (${linFmt(r.x3, 4)}, ${linFmt(r.y3, 4)})`, [{ x: r.x3, y: r.y3 }], CHART_COLORS.punto, { pointRadius: 10, pointStyle: 'rectRot' })
            ]
        }),
        caption: `Los dos puntos morados son los datos conocidos y la línea azul es la recta que los une: <b>interpolar linealmente es leer un valor sobre esa recta</b>. La línea punteada roja muestra la lectura: se entra por ${r.vx} = ${linFmt(r.x3)}, se sube hasta la recta y se sale por ${r.vy} = ${linFmt(r.y3, 6)}. ${r.dentro ? 'El punto cae <b>entre</b> los dos conocidos, por eso es una interpolación.' : 'El punto cae <b>fuera</b> del tramo conocido: es una extrapolación y la recta ya no está respaldada por datos.'}`
    }]);
}

function runLinInterp(save) {
    let panel = document.getElementById('resultsPanel');
    let res = document.getElementById('resultsContent');
    if(!panel || !res) return;

    const r = computeLinInterp();

    // Rellenar automáticamente la celda calculada del Punto 3
    const outId = linMode === 'y' ? 'lin_y3' : 'lin_x3';
    const otherId = linMode === 'y' ? 'lin_x3' : 'lin_y3';
    let outEl = linEl(outId), otherEl = linEl(otherId);
    if(outEl) {
        if(r.ok) {
            outEl.value = linFmt(linMode === 'y' ? r.y3 : r.x3, 8);
            outEl.classList.add('auto-filled');
        } else {
            outEl.value = '';
            outEl.classList.remove('auto-filled');
        }
    }
    if(otherEl) otherEl.classList.remove('auto-filled');

    if(!r.ok) {
        panel.classList.remove('hidden');
        setCharts([]);
        res.innerHTML = `<div class="badge ${r.pending ? 'info' : 'danger'}">${r.msg}</div>`;
        return;
    }

    const f = linFmt;
    const isDetailed = document.getElementById('detailedToggle').checked;
    let html = '';
    buildLinSteps(r).forEach(s => {
        html += `<div class="step-card"><strong>${s.t}</strong><br>${s.c}</div>`;
    });

    const yVerif = r.y1 + r.m * (r.x3 - r.x1);
    const errAbs = Math.abs(yVerif - r.y3);
    const colin = (r.x2 - r.x1) * (r.y3 - r.y1) - (r.y2 - r.y1) * (r.x3 - r.x1);
    const escala = Math.max(1, Math.abs(r.dx * r.dy));

    let verif = buildVerif({
        fundamento: `Interpolar linealmente significa suponer que los tres puntos están <b>sobre la misma recta</b>. Por eso la comprobación es doble: se sustituye el valor obtenido en la ecuación de esa recta, y se aplica la prueba de colinealidad, que da exactamente cero cuando P<sub>1</sub>, P<sub>2</sub> y P<sub>3</sub> están alineados. Si el punto calculado no fuera colineal con los datos, el valor no procedería de la recta que se planteó.`,
        comprobacion: `Sustituyendo ${r.vx} = ${f(r.x3)} en la ecuación de la recta:<br>
            ${r.vy} = ${f(r.m, 8)} &middot; ${f(r.x3)} ${r.b >= 0 ? '+' : '&minus;'} ${f(Math.abs(r.b), 8)} = <b>${f(yVerif, 8)}</b><br>
            Diferencia con el valor obtenido: ${f(errAbs, 10)}<br><br>
            Prueba de colinealidad de P<sub>1</sub>, P<sub>2</sub> y P<sub>3</sub>:<br>
            (${r.vx}<sub>2</sub>&minus;${r.vx}<sub>1</sub>)(${r.vy}<sub>3</sub>&minus;${r.vy}<sub>1</sub>) &minus; (${r.vy}<sub>2</sub>&minus;${r.vy}<sub>1</sub>)(${r.vx}<sub>3</sub>&minus;${r.vx}<sub>1</sub>) = ${f(colin, 8)} (debe ser 0)`,
        ok: Math.abs(colin) < 1e-8 * escala,
        okTxt: `Los tres puntos son colineales: el valor interpolado es correcto.`,
        malTxt: `Los puntos no resultan colineales; revisa los datos introducidos.`,
        nota: r.dentro
            ? `El punto pedido está dentro del tramo conocido, que es donde la hipótesis de linealidad está respaldada por los datos.`
            : `Atención: el punto pedido queda fuera del tramo conocido. El cálculo es correcto, pero supone que la recta sigue siendo válida más allá de los datos disponibles.`
    });

    let aviso = r.dentro
        ? `<span class="badge success">Interpolación: ${r.vx}<sub>3</sub> = ${f(r.x3)} está dentro del intervalo [${f(Math.min(r.x1, r.x2))}, ${f(Math.max(r.x1, r.x2))}].</span>`
        : `<span class="badge danger">Extrapolación: ${r.vx}<sub>3</sub> = ${f(r.x3)} está fuera del intervalo [${f(Math.min(r.x1, r.x2))}, ${f(Math.max(r.x1, r.x2))}]; el resultado es menos confiable.</span>`;

    let resumen = `<div class="result-box" style="font-size:1.1rem;">
            Punto 3 = ( ${r.vx} = ${f(r.x3, 8)} , ${r.vy} = ${f(r.y3, 8)} )
        </div>
        <div style="margin:0.5rem 0;">${aviso}</div>
        <table style="max-width:480px;">
            <tr><th>Concepto</th><th>Valor</th></tr>
            <tr><td>${r.mode === 'y' ? r.vy + '<sub>3</sub> (calculado)' : r.vx + '<sub>3</sub> (calculado)'}</td><td>${f(r.mode === 'y' ? r.y3 : r.x3, 8)}</td></tr>
            <tr><td>Pendiente (m)</td><td>${f(r.m, 8)}</td></tr>
            <tr><td>Ordenada al origen (b)</td><td>${f(r.b, 8)}</td></tr>
            <tr><td>Ecuación de la recta</td><td>${r.vy} = ${f(r.m, 6)}&middot;${r.vx} ${r.b >= 0 ? '+' : '&minus;'} ${f(Math.abs(r.b), 6)}</td></tr>
            <tr><td>&Delta;${r.vx} / &Delta;${r.vy}</td><td>${f(r.dx)} / ${f(r.dy)}</td></tr>
        </table>`;

    panel.classList.remove('hidden');
    res.innerHTML = (isDetailed ? html : '') + resumen + verif;
    plotLinearInterp(r);

    if(save) {
        saveHistory({
            lin_varx: r.vx, lin_vary: r.vy,
            lin_x1: r.x1, lin_y1: r.y1,
            lin_x2: r.x2, lin_y2: r.y2,
            lin_x3: f(r.x3, 8), lin_y3: f(r.y3, 8)
        });
    }
}

/* INIT */
updateUI();
loadHistorySelect();

</script>

</html>
